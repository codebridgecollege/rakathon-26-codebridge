<title>MDT Workspace v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Mock v3: v2 plus Soňa's second feedback round (docs/design/PRODUCT.md, "Feedback round 2").
   Soňa's brief: a GLIDE-inspired clinical workspace in a white version only.
   Light ground, dark type, fine dividing lines, minimal shadow; colour only where it carries meaning.
   Layout: a top bar with the three main areas (patients, calendar, tasks); each screen is a full-width working page. */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --sunk: #f0f2ef;
  --fg: #1c2726;
  --muted: #5b6866;
  --faint: #8a9593;
  --line: #e1e4e0;
  --line-strong: #cdd3cf;
  --accent: #3d7a6f;
  --accent-ink: #2c5c53;
  --accent-soft: #e3ece8;
  --missing: #8f5a06; --missing-soft: #fbf0dc;
  --conflict: #a8323f; --conflict-soft: #fbe6e8;
  --change: #2b5aa8; --change-soft: #e5ecf8;
  --unclear: #6a5b8a; --unclear-soft: #eeeaf5;
  --ok: #2d7650; --ok-soft: #e1f1e7;
  --mark: #fff0a8;
  --font-head: "Manrope", "DM Sans", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14.5px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-head); letter-spacing: -.005em; text-wrap: balance; }
h1 { font-size: 22px; margin: 0; line-height: 1.25; }
h2 { font-size: 16px; margin: 0; }
h3 { font-size: 14px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 800 15px/1 var(--font-head); display: flex; align-items: center; gap: 8px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav button:hover { background: var(--sunk); }
.nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.nav .count { font-size: 11px; background: var(--accent); color: #fff; border-radius: 99px; padding: 0 6px; margin-left: 4px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.who select { border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 6px; background: var(--surface); }
.demo { font-size: 11.5px; font-weight: 600; color: var(--missing); background: var(--missing-soft); border-radius: 99px; padding: 2px 8px; }

.page { padding-block: 22px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card > .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { justify-content: space-between; }

.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 7px 13px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.st-new { background: var(--sunk); color: var(--muted); }
.st-scheduled { background: var(--change-soft); color: var(--change); }
.st-attention { background: var(--missing-soft); color: var(--missing); }
.st-ready { background: var(--ok-soft); color: var(--ok); }
.st-done { background: var(--accent-soft); color: var(--accent-ink); }
.k-missing { background: var(--missing-soft); color: var(--missing); }
.k-contradiction { background: var(--conflict-soft); color: var(--conflict); }
.k-change { background: var(--change-soft); color: var(--change); }
.k-unclear { background: var(--unclear-soft); color: var(--unclear); }

/* Toolbar and tables */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.search { flex: 1 1 220px; max-width: 340px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 10px; background: var(--surface); }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.filter[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
select.input, input.input, textarea.input { border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; background: var(--surface); width: 100%; }
textarea.input { min-height: 96px; resize: vertical; }
.scroll { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--sunk); }
.tbl .id { font-weight: 700; font-variant-numeric: tabular-nums; }
.ex { font-size: 10.5px; color: var(--faint); margin-left: 3px; vertical-align: super; }

/* Calendar */
.calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.cal { display: grid; grid-template-columns: 56px repeat(5, minmax(120px, 1fr)); min-width: 720px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.cal .dh { padding: 8px 10px; border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.cal .dh small { display: block; color: var(--muted); font-weight: 500; }
.cal .dh .startmdt { margin-top: 6px; }
/* Selected patient (round 17): the chosen slot and list row stand out, so the user sees what the card and actions refer to. */
.slotbtn.taken[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft, #e3efec); box-shadow: 0 0 0 2px var(--accent) inset; font-weight: 700; }
.dragrow.sel { border-color: var(--accent); background: var(--accent-soft, #e3efec); box-shadow: 0 0 0 1px var(--accent) inset; }
.minicard .row .btn { padding: 4px 10px; font-size: 13px; }
.cal .tm { font-size: 11.5px; color: var(--faint); padding: 0 6px; text-align: right; border-top: 1px solid var(--line); height: 34px; line-height: 34px; font-variant-numeric: tabular-nums; }
.cal .cell { border-top: 1px solid var(--line); border-left: 1px solid var(--line); height: 34px; padding: 2px 4px; position: relative; }
.cal .cell { background: #eceeeb; }
.cal .cell.sem { background: var(--surface); }
.slotbtn { width: 100%; height: 100%; border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer; font-size: 12.5px; text-align: left; padding: 0 6px; display: flex; align-items: center; gap: 6px; }
.slotbtn.free { color: var(--faint); }
.slotbtn.drop { border-color: var(--accent); background: var(--accent-soft, #e3efec); color: var(--accent-ink); }
.slotbtn.taken[draggable="true"], [data-drag] { cursor: grab; }
.dragrow { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.dragrow:hover { border-color: var(--line-strong); }
.dragrow { flex-wrap: nowrap; min-width: 0; max-width: 100%; }
.tasklist { min-width: 0; }
.tasklist > * { min-width: 0; }
.dragrow > span:first-child { min-width: 0; flex: 1; }
.dragrow > span:first-child > span[style*="block"] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dragrow.dragging { opacity: .5; }
.tbl th { position: relative; }
.colrs { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 1; touch-action: none; }
.colrs:hover, .colrs.on { background: linear-gradient(var(--accent), var(--accent)) center / 2px 100% no-repeat; }
.slotbtn.free:hover, .slotbtn.target { border-color: var(--accent); color: var(--accent-ink); background: #fff; }
.slotbtn.taken { background: var(--surface); border-color: var(--line-strong); font-weight: 700; }
.slotbtn.taken .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.popover { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 14px 16px; box-shadow: 0 6px 24px rgba(28,39,38,.08); }

/* Patient header */
.phead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: start; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.facts b { color: var(--fg); font-weight: 600; }
.question { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r) var(--r) 0; padding: 10px 14px; }
.question.missing { border-left-color: var(--missing); background: var(--missing-soft); }
.question p { margin: 2px 0 0; font-size: 15.5px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 9px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.tab .n { font-size: 11px; background: var(--sunk); border-radius: 99px; padding: 0 6px; margin-left: 4px; }

/* Summary with paper-style references */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 99px; padding: 2px; background: var(--sunk); }
.seg button { border: 0; background: none; border-radius: 99px; padding: 3px 12px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.prose { font-size: 15px; line-height: 1.65; max-width: 78ch; margin: 0; }
.ref { margin-top: -2px; transform: translateY(4px); font-size: 11px; vertical-align: super; line-height: 1; min-width: 18px; min-height: 18px; background: none; border: 0; padding: 0 1px; color: var(--accent-ink); cursor: pointer; font-weight: 700; }
.ref:hover { text-decoration: underline; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14.5px; max-width: 86ch; }
.dl dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.dl dd { margin: 0; }
.refs { margin: 12px 0 0; padding: 10px 0 0 22px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }
.refs li { padding-left: 2px; }
.refs button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; }
.refs button:hover { color: var(--accent-ink); text-decoration: underline; }
details.more > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.disclaim { font-size: 12px; color: var(--faint); margin-top: 8px; }

/* Alerts strip */
.alerts { display: grid; gap: 6px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 6px; background: var(--sunk); }
.alert.ack { opacity: .55; }
.alert .why { display: block; color: var(--muted); font-size: 12.5px; }

/* Horizontal labelled timeline */
.tlbar { position: relative; overflow-x: auto; padding: 6px 2px 4px; }
.tltrack { position: relative; display: flex; align-items: flex-start; gap: 0; min-width: max-content; padding: 0 8px; }
.tltrack::before { content: ""; position: absolute; left: 0; right: 0; top: 39px; height: 2px; background: var(--line-strong); }
.tlyear { position: relative; min-width: 56px; padding-inline: 4px; flex: none; text-align: center; padding-top: 30px; }
.tlyear span { position: relative; display: inline-block; font: 700 12px/1 var(--font-head); color: var(--muted); background: var(--surface); padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 99px; }
.ev { position: relative; flex: none; width: 196px; padding: 0 8px; background: none; border: 0; text-align: left; cursor: pointer; }
.ev .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; height: 18px; display: block; white-space: nowrap; }
.ev .pin { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid currentColor; margin: 4px 0 8px; }
.ev .pin svg { width: 15px; height: 15px; }
.ev.planned .pin { border-style: dashed; }
.ev .t { display: block; font-weight: 700; font-size: 13.5px; line-height: 1.3; color: var(--fg); }
.ev .d { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.ev[aria-pressed="true"] .pin { box-shadow: 0 0 0 4px var(--accent-soft); }
.ev[aria-pressed="true"] .t { color: var(--accent-ink); }
.evdetail { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.kind-diagnosis { color: #7a3f8f; } .kind-imaging { color: #2b5aa8; } .kind-surgery { color: #8f5a06; }
.kind-pathology { color: #a8323f; } .kind-systemic { color: #2d7650; } .kind-radiotherapy { color: #b5521b; }
.kind-mdt { color: #3d7a6f; } .kind-visit { color: #5b6866; }

/* Anamnesis and documents */
.anam { display: grid; grid-template-columns: 220px minmax(0, 1fr); border-top: 1px solid var(--line); }
.anam > div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.anam > div:nth-child(odd) { font-weight: 600; padding-right: 12px; }
.anam ul { margin: 0; padding-left: 18px; }
.gap { color: var(--faint); font-style: italic; }
.tag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; margin-left: 4px; white-space: nowrap; }
.tag.neg { background: var(--sunk); color: var(--fg); border: 1px solid var(--line-strong); }
.tag.obs { background: var(--unclear-soft); color: var(--unclear); }
.tag.ocr { background: var(--missing-soft); color: var(--missing); }
.note { display: block; color: var(--muted); font-size: 12.5px; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.pipeline li { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pipeline li.wait { background: var(--sunk); color: var(--muted); }
.pipeline li.run { background: var(--change-soft); color: var(--change); }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); background: var(--sunk); }

/* MDT session bar: the day's agenda above the patient view while an MDT is running. It sticks under the top bar
   (whose height is measured into --toph), so the next patient is always one click away. */
.sesbar { position: sticky; top: calc(var(--toph, 52px) + env(safe-area-inset-top, 0px)); z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--r); padding: 8px 10px; box-shadow: 0 4px 14px rgba(28,39,38,.08); min-width: 0; }
.sesbar .sestitle { font-weight: 700; font-size: 13px; color: var(--accent-ink); white-space: nowrap; }
.agenda { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; min-width: 0; flex: 1 1 280px; }
.agenda button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.agenda button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
/* On a phone the top bar already wraps to several rows, so a second sticky band would cover most of the screen. */
@media (max-width: 640px) { .sesbar { position: static; } .sesbar .sestitle { flex-basis: 100%; } }
.agenda button .tm2 { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
/* The MDT discussion card: collapsed outside a session, open and outlined while the case is being discussed. */
details.mdtcard > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
details.mdtcard > summary::-webkit-details-marker { display: none; }
details.mdtcard > summary::before { content: "›"; font-size: 18px; color: var(--muted); transition: transform .15s; width: 10px; }
details.mdtcard[open] > summary { margin-bottom: 12px; }
details.mdtcard[open] > summary::before { transform: rotate(90deg); }
.mdtcard.live { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.mdtcard .sub { border-top: 1px solid var(--line); padding-top: 12px; }
.mdtcard .sub > .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }

/* MDT discussion: attendance, notes, steps */
.att { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.att .dept { font-weight: 600; font-size: 13.5px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 3px; }
.seg2 button { border: 0; background: none; border-radius: 6px; padding: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.rec { text-align: center; padding: 18px 10px; display: grid; gap: 6px; justify-items: center; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.steps .s { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.steps .s.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.task { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 150px auto; gap: 8px; align-items: center; }
.tasklist { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.trow input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.trow.done .tt { text-decoration: line-through; color: var(--muted); }
.mail { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 12px 14px; background: var(--surface); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hist li { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.hist li.old { opacity: .6; }

/* Report sheet */
.sheet { background: #fff; color: #111; max-width: 760px; margin: 0 auto; padding: 40px 46px; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.06); font-size: 13px; line-height: 1.5; }
.sheet h4 { font: 700 12px/1.3 var(--font-head); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 6px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
.sheet p, .sheet li { margin: 2px 0; }
.sheet .hdr { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #111; padding-bottom: 10px; }
.sheet .src { color: #666; font-size: 11px; }

/* Source drawer */
.scrim { position: fixed; inset: 0; background: rgba(28,39,38,.25); z-index: 30; }

u, důsledně buď vždy s jídlem, nebo vždy bez jídla. Tablety se polykají celé a zapíjejí se sklenicí vody. Tablety se nesmí kousat nebo drtit.\n\nNesmí se současně jíst grepy, pomelo, grepové džusy, preparáty s třezalkou.\nNené vhodné současné užívání antimykotik a antivirotik p.o. nebo i.v. (lokální aplikce nevadí), verapamilu, erytromycynu, klaritromycinu.\nKontraindikovány jsou ACEi pro zvýšené riziko anafylace.\n\nPři nevolnosti doma užívat Degan 10mg tbl. 1-1-1, při nedostatečném efektu nebo zvracení přidá Novetron 8mg tbl. 1-0-1 á 12hod.\nPři průjmu užívat Imodium 2mg cps., vstupně 2 cps., pak 1 cps. při každé další řídké stolici, maxim. 8 cps. denně. Při nedostatečném efektu přidá Smecta 1-1-1.\n\n-----------------------------------------------\n\nChron. medikace: Kapidin 20mg 1-0-0, Spiriva inhal. 1-0-1 + Ventolin N inhal. dlp.\nPři úzkosti, neklidu Neurol 0,25mg 1tbl. dlp.\nCps. Natrii chloridi 1,0g 1-0-1, pro hypokalcémii Calcichew 1000/800IU 0-0-1.\n\nPro mírnou hyperkalémii ve stravě omezit banány, meruňky, broskve, sušené a kompotované ovoce, džusy, čokoládu, kakao, černý čaj - poučen.\n\n*Doporučení:*\nPacient po nefrektomii vpravo a retroperitoneální lymfadenektomii pro tumor 6/2022, histol. světlobuněčný renální adenoca G2, vstupně bez zn. generalizace. Při restagingu 9/2022 zjištěna susp. paraaortální uzlina vlevo, stp. extirpaci 10/2022 - histol. mts světlobuněčného renálního ca. Další restaging. 3/2022, kde patol. mediastinální a plicní hilová lymfadenopatie charakteru hypervaskularizovaných mts.\nDle IMDC střední prognóza - 1 faktor - interval méně než 1 rok od diagnózy do započetí syst. léčby.\nJe indikováno podání nivolumab 3mg/kg v kombinaci s ipilimumabem 1mg/kg q3w 4 cykly - schváleno KOC komisi.\nPo podání 2 cyklů léčby rozvoj GIT toxicity 1.st., plicní toxicita = IPP 1.až 2. stupně, od 28.4.2023 kortikoterapie prednison 1mg/kg/den s rychlou regresi plicního nálezu. Proto od 12.5.2023 zahájeno postupné snižování dávky kortikoidu, ukončen 26.7.2023.\nDle restaging. CT 6/2023 dosaženo iPR, proto pokračujeme v udržovací léčbě nivolumabem 240mg q2w.\nPři CT vyš. 9/23 popisován nově útvar do 21x27 mm vlevo ventrálně v mesogastriu, etiologie je spíše cystická, jinak bez lymfadenopatie, bez mts, restaging. CT vyš. 11/2023 + 2/2024 + 6/2024 + 10/2024 + 2/2025 + 6/2025 - trvá iPR - pokračujeme v zavedené léčbě.\n\n11/2023 provedena excize susp. ložiska na bradě vlevo, histol. kožní metastáza světlebuněčného (konvenčního) karcinomu renálního origa, grade 2 - dle pacienta pozoruje cca od 6/23, dle CT vyš. 11/23 iPR.\n-----------------------------------------------\n**Opakovaným CT vyš. 11/2025 a 1/2026 verifikována progrese onkologického onemocnění.\nDo 2. linie léčby indikován sunitinib 50mg denně = schváleno KOC komisí.\nLéčbu zahájil od 27.1.2026 v režimu 4/2.\nDle restaging. CT 4/2026 SD - velikostní regrese sledovaných lézí je o cca 24 %.**\n\n**Dle CT 8/2026 ale PD - velikostní progrese LU v levém pl. hilu a v retroperitonu paraaortálně vlevo. Proto léčbu sunitinibem ukončuji.**\n\n**Do 3. pal. linie léčby indikován everolimus - schváleno KOC komisí.** Cabozantinib na\n", "engine": "vision", "words": [{"t": "Ambulantní", "c": 96, "b": [440, 95, 120, 18]}, {"t": "vyšetření", "c": 96, "b": [566, 96, 96, 22]}, {"t": "kontrolní", "c": 96, "b": [670, 95, 90, 18]}, {"t": "OA:", "c": 95, "b": [236, 187, 30, 15]}, {"t": "HN,", "c": 93, "b": [280, 188, 28, 16]}, {"t": "CHOPN", "c": 89, "b": [322, 188, 52, 14]}, {"t": "u", "c": 92, "b": [388, 192, 8, 10]}, {"t": "fumátora", "c": 92, "b": [410, 187, 84, 14]}, {"t": "Canamn.", "c": 83, "b": [508, 188, 69, 16]}, {"t": "léčba", "c": 96, "b": [594, 188, 52, 14]}, {"t": "přerušena", "c": 96, "b": [658, 188, 96, 18]}, {"t": "pacientem),", "c": 93, "b": [766, 188, 114, 18]}, {"t": "HLP", "c": 92, "b": [896, 188, 31, 14]}, {"t": "na", "c": 97, "b": [939, 192, 20, 10]}, {"t": "dietě,", "c": 96, "b": [972, 188, 60, 17]}, {"t": "hyperglykémie", "c": 90, "b": [236, 211, 138, 18]} měřil, protože byl na dovolené.\n\n**Objektivní nález:** Tlak S/D [mmHg]: 155/70, Pulz [1/mín]: 68, Dech [1/min]: 14, Hmotnost [kg]: 87, Výška [cm]: 183, BMI: 25.98, Plocha těla [m2]: 2.09\n\n**Status praesens:** ECOG PS: 1, bez klin. známek mozkových mts\nlucidní, orientace správná, spolupracuje, eupnoe, bez cyanózy, bez ikteru, normální hydratace\nHLAVA: poklep nebolestivý, zornice izokorické, správně reagují na osvit, hrdlo zarudlé, hnisavý povlak, tonzily nezvětšené, jazyk vlhký, bez povlaku, plazí středem\nKRK: souměrný, šije bez opozice, štítnice nezvětšená, uzliny nehmatné, pulzace karotid symetrická, bez šelestu, žíly bez kongesce.\nHRUDNÍK: souměrný, palpačně nebolestivý, prsy bez patologického nálezu, axily, nadklíčky volné, bez LU, páteř poklepově nebolestivá.\nPLÍCE: poklep plný, jasný, dýchání alveolární, bez vedlejších fenomenu.\nSRDCE: akce pravidelná, ozvy ohraničené, bez šelestu.\nBŘICHO: v niveau, měkké, prohmatné, palpačně nebolestivé, bez patologické rezistence, peristaltika přiměřená, játra v oblouku., slezina nenaráží, tapott bilaterálně negativní,\nZevní genitál: nevyšetřen\nVYŠETŘENÍ PER RECTUM: nevyšetřen\nKONČETINY: hybnost v normě, klouby bez deformit.\nDKK: třísla bez hmatných zvětšených LU, bez otoků, varixů a flebitid, pulzace hmatné symetricky do periferie.\nST. LOC . . [začerněno] : jizvy pod pravým i levým obloukem žeberním klidné.\n\n**Provedená vyšetření:**\nPlicní vyš.[?]\nSpirometrie - lehká obsturce\nCHOPN II/B fumat, inhal teprie Spiriva rest 2-0-0 + Ventolin dlp, kontrola za 1/2 roku\n\nCT plic + břicha 10.11.2025\nZávěr:\nve srovnání s base line CT z 03/2023 trvá mírná parc. regrese velikosti retroperitoneální lymfadenopatie vlevo ( ve srovnání s min. CT z 06/2025 je ale mírná progrese velikosti), navíc nově patol. LU v levém plicním hilu - dle **iRECIST tedy PD (progressive disease).**\n\nCT hrudník, břicho 16.1.2026\nZávěr:\nVe srovnání s baseline CT došlo k regresi mediastinální a pravostranné hilové lymfadenopatie, v levé 26.**\n\n**Tablety je možné užívat s jídlem nebo bez jídla. Během léčby nejíst grapefruity, pomelo, nepít grapefruitovou šťávou.\nNení vhodné současné užívání s klaritromycinem a antimykotiky p.o. či i.v..**\n\nPři průjmu užívat Imodium 2mg cps., vstupně 2 cps., pak 1 cps. při každé další řídké stolici, maxim. 8 cps. denně. Při nedostatečném efektu přidá Smecta 1-1-1.\n\nPokračuje Calcichew 1000/800IU 0-0-1.\n\nChron. medikace: Nebivolol 5mg tbl 1-0-0\n**Od bolesti Biofenac 100mg 1-0-1, Novalgin 500mg tbl. 1-1-1.\nOd PL nově Asentra 50mg 1-0-0.**\nPozn. netoleruje tramadol - zvracení, slabost.\n\n**Doporučení:** Pacientka s Luminal A karcinomem levého prsu, HER2 low, stp. mastektomii vlevo 11/2023, stp. adjuvantní RT 1-2/2024, od 2/2024 adjuvantní HT s letrozolem.\nPro bolesti skeletu 9/2026 provedena scintigrafie, která prokazuje mnohočetné mts postižení skeletu.\nPro progresi onemocnění na léčbě letrozolem je do 1. pal. linie léčby indikován fulvestrant + CDK 4/6i abemaciklib = schváleno KOC komisí.\nTaké zažádáno o NGS vyš. = také schváleno KOC komisí.\n-----\n\n**Dnes 21.9.26 druhá aplikace fulvestrant 500mg i.m., další bude 6.10.26, poté á 1 měsíc.**\n", "engine": "vision", "words": [{"t": "m", "c": 54, "b": [594, 77, 12, 6]}, {"t": "Ambulantní", "c": 96, "b": [440, 98, 120, 18]}, {"t": "vyšetření", "c": 97, "b": [568, 98, 96, 23]}, {"t": "kontrolní", "c": 97, "b": [670, 98, 90, 18]}, {"t": "PET/CT", "c": 79, "b": [235, 188, 227, 19]}, {"t": "vyš,", "c": 59, "b": [308, 186, 44, 26]}, {"t": "14,9,2026", "c": 75, "b": [363, 188, 99, 19]}, {"t": "Závěr:", "c": 96, "b": [234, 212, 64, 16]}, {"t": "prokazujeme", "c": 92, "b": [234, 237, 118, 18]}, {"t": "FDG", "c": 93, "b": [366, 238, 30, 14]}, {"t": "avidní", "c": 90, "b": [408, 236, 62, 16]}, {"t": "generalizaci", "c": 96, "b": [484, 236, 126, 18]}, {"t": "základního", "c": 96, "b": [624, 238, 106, 14]}, {"t": "onemocnění", "c": 96, "b": [743, 238, 104, 14]}, {"t": "do", "c": 97, "b": [862, 236, 21, 15]}, {"t": "s 0.1093/eurheartj/ehae178", "pdf_url": "https://repisalud.isciii.es/bitstreams/4fe1933e-3844-454d-9cef-4a64b5debafe/download", "file": "docs/sources/guidelines/im-esc-hypertension-2024.pdf", "license": "'© The European Society of Cardiology 2024. All rights reserved.' The content 'has been published for personal and educational use only. No commercial use is authorized. No part of the ESC Guidelines may be translated or reproduced in any form without written permission from the ESC.' (page 1). pdf_url is the version of record deposited in the ISCIII repository (repisalud.isciii.es); the publisher page is https://academic.oup.com/eurheartj/article/45/38/3912/7741010.", "republish_ok": false}], "statements": [{"id": "eano-srs-1-4", "guideline_id": "eano-esmo-2021-bm", "section": "Management - Recommendations - Radiotherapy", "pdf_page": 7, "printed_page": 1338, "quote": "SRS is recommended for patients with a limited number (1-4) of BMs [EANO: I, A; ESMO: I, A].", "evidence": "EANO: I, A; ESMO: I, A", "applies_because_cs": "Jediné ložisko podezřelé z metastázy (počet 1, tedy v rozmezí 1-4). Metastáza zatím není potvrzena.", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se ložisko v pravé hemisféře mozečku do 3 mm, susp. metastáza"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "doporučení · EANO I A / ESMO I A"}, {"id": "eano-srs-vs-surgery-factors", "guideline_id": "eano-esmo-2021-bm", "section": "Integrated therapeutic approaches", "pdf_page": 8, "printed_page": 1339, "quote": "Factors favouring SRS alone over surgery commonly followed by SRS or systemic therapy include a surgically less accessible location, increased surgical risk and preference for a noninvasive outpatient treatment.", "evidence": "bez stupně (text kapitoly, ne doporučení)", "applies_because_cs": "Věta srovnává SRS s chirurgickou léčbou (ne se sledováním). Ložisko v pravé hemisféře mozečku do 3 mm je suspektní z metastázy; dostupnost pro operaci a operační riziko dokumentace nehodnotí.", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se ložisko v pravé hemisféře mozečku do 3 mm, susp. metastáza", "ECOG PS 1, bez klinických známek mozkových metastáz (občasné mžitky před očima)"], "kind": "brain_metastasis", "type": "guideline_text", "evidence_cs": "text kapitoly, bez stupně"}, {"id": "eano-no-trials-timing", "guideline_id": "eano-esmo-2021-bm", "section": "Integrated therapeutic approaches", "pdf_page": 8, "printed_page": 1339, "quote": "For patients with asymptomatic or oligosymptomatic BM, no prospective trials have addressed the question of optimal combined modality treatment with systemic therapy, including TKI or immune checkpoint inhibition, and surgery or SRS.", "evidence": "bez stupně (text kapitoly, ne doporučení)", "applies_because_cs": "Onkolog zapsal ‚bez klin. známek mozkových mts‘; pacient uvádí občasné mžitky před očima, jejich souvislost s ložiskem dokumentace nehodnotí. Pacient je na systémové léčbě (everolimus od 3. 9. 2026).", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se ložisko v pravé hemisféře mozečku do 3 mm, susp. metastáza", "ECOG PS 1, bez klinických známek mozkových metastáz (občasné mžitky před očima)", "od 9/2026 3. linie everolimus 5 mg"], "kind": "brain_metastasis", "type": "guideline_text", "evidence_cs": "text kapitoly, bez stupně"}, {"id": "eano-bm-board", "guideline_id": "eano-esmo-2021-bm", "section": "Integrated therapeutic approaches - Recommendations", "pdf_page": 8, "printed_page": 1339, "quote": "Ideally, therapeutic decisions should be discussed at a dedicated BM board or at a disease-specific tumour board with participation of colleagues experienced in the management of CNS tumours [EANO: IV, n/a; ESMO: V, B].", "evidence": "EANO: IV, n/a; ESMO: V, B", "applies_because_cs": "Pacient je projednáván na MDT kvůli podezření na metastázu v mozečku.", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se ložisko v pravé hemisféře mozečku do 3 mm, susp. metastáza"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "doporučení · EANO IV, n/a / ESMO V B"}, {"id": "eano-mri-2-3-months", "guideline_id": "eano-esmo-2021-bm", "section": "Monitoring and follow-up - Recommendations", "pdf_page": 12, "printed_page": 1343, "quote": "Brain MRI should be carried out every 2-3 months or at any instance of suspected neurological progression [EANO: IV, C; ESMO: IV, B].", "evidence": "EANO: IV, C; ESMO: IV, B", "applies_because_cs": "Doporučení platí pro sledování pacientů s mozkovými metastázami; u pacienta je metastáza zatím jen suspektní (MR 14. 9. 2026).", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se ložisko v pravé hemisféře mozečku do 3 mm, susp. metastáza", "ECOG PS 1, bez klinických známek mozkových metastáz (občasné mžitky před očima)"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "doporučení · EANO IV C / ESMO IV B"}, {"id": "eano-systemic-prev-treatment", "guideline_id": "eano-esmo-2021-bm", "section": "Management - Recommendations - Pharmacotherapy", "pdf_page": 7, "printed_page": 1338, "quote": "Systemic pharmacotherapy based on histological and molecular characteristics of the primary tumour and previous treatment should be considered for most patients with BMs [EANO: IV, n/a; ESMO: IV, B].", "evidence": "EANO: IV, n/a; ESMO: IV, B", "applies_because_cs": "Primární nádor: světlobuněčný karcinom ledviny G2; dvě předchozí linie systémové léčby (nivolumab + ipilimumab, sunitinib), nyní 3. linie everolimus.", "patient_facts": ["světlobuněčný renální karcinom G2, nefrektomie vpravo 6/2022, pT2a pN1 M0", "1. linie nivolumab + ipilimumab, progrese (iRECIST potvrzena 1/2026)", "2. linie sunitinib 1-8/2026, progrese", "od 9/2026 3. linie everolimus 5 mg"], "kind": "systemic_therapy", "type": "recommendation", "evidence_cs": "doporučení · EANO IV, n/a / ESMO IV B"}, {"id": "eano-cns-extracns-activity", "guideline_id": "eano-esmo-2021-bm", "section": "Management - Pharmacotherapy", "pdf_page": 5, "printed_page": 1336, "quote": "In the situations of multiple systemic treatment options, CNS and extra-CNS disease activity as well as toxicity profile of the respective treatment options should be considered in the decision-making process for the optimal systemic treatment strategy [EANO: IV, A; ESMO: IV, B].", "evidence": "EANO: IV, A; ESMO: IV, B", "applies_because_cs": "Vedle ložiska v mozečku (suspekce na metastázu) je v dokumentaci extrakraniální onemocnění (uzliny, kůže, nejasná ložiska Th/L); pacient je ve 3. linii systémové léčby (everolimus).", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se ložisko v pravé hemisféře mozečku do 3 mm, susp. metastáza", "histologicky ověřené metastázy (paraaortální uzlina, kůže)", "možná drobná osteoplastická ložiska Th/L (nejasné)"], "kind": "systemic_therapy", "type": "recommendation", "evidence_cs": "doporučení · EANO IV A / ESMO IV B"}, {"id": "cos-3l-after-io-tki", "guideline_id": "cos-mk-2026", "section": "21.2.2 Systémová léčba metastatického karcinomu ledviny - Léčebný algoritmus - Léčba mRCC třetí linie - Předchozí léčba IO a inhibitorem VEGF-TKI", "pdf_page": 217, "printed_page": 217, "quote": "Kabozantinib (2A) Everolimus (2A) Dosud nepoužitý VEGF-TKI (2B) Belzutifan (2B) Lenvatinib a everolimus (2B)", "evidence": "stupeň ČOS u každého léku: 2A, 2A, 2B, 2B, 2B", "applies_because_cs": "Pacient měl IO (nivolumab + ipilimumab) a VEGF-TKI (sunitinib); everolimus ze stejného boxu už dostává. Algoritmus nemá box pro 4. linii.", "patient_facts": ["1. linie nivolumab + ipilimumab, progrese (iRECIST potvrzena 1/2026)", "2. linie sunitinib 1-8/2026, progrese", "od 9/2026 3. linie everolimus 5 mg"], "kind": "systemic_therapy", "type": "recommendation", "evidence_cs": "ČOS 2A / 2B (podle léku)"}, {"id": "cos-lines-not-limited", "guideline_id": "cos-mk-2026", "section": "21.2.2 Systémová léčba metastatického karcinomu ledviny - Komentář k léčebným schématům", "pdf_page": 218, "printed_page": 218, "quote": "Počet linií léčby mRCC by neměl být limitován jinak než stavem nemocného a dostupností léků (2A).", "evidence": "ČOS 2A", "applies_because_cs": "Pacient je ve 3. linii systémové léčby mRCC (everolimus od 3. 9. 2026) a dokumentace uvádí ECOG PS 1.", "patient_facts": ["1. linie nivolumab + ipilimumab, progrese (iRECIST potvrzena 1/2026)", "2. linie sunitinib 1-8/2026, progrese", "od 9/2026 3. linie everolimus 5 mg", "ECOG PS 1"], "kind": "systemic_therapy", "type": "recommendation", "evidence_cs": "ČOS 2A"}, {"id": "cos-clinical-trial", "guideline_id": "cos-mk-2026", "section": "21.2.2 Systémová léčba metastatického karcinomu ledviny - Komentář k léčebným schématům", "pdf_page": 218, "printed_page": 218, "quote": "U nemocných s mRCC by mělo být zvažováno zařazení do klinické studie.", "evidence": "bez stupně", "applies_because_cs": "Metastatický světlobuněčný RCC po vyčerpání IO a VEGF-TKI.", "patient_facts": ["1. linie nivolumab + ipilimumab, progrese (iRECIST potvrzena 1/2026)", "2. linie sunitinib 1-8/2026, progrese", "od 9/2026 3. linie everolimus 5 mg"], "kind": "systemic_therapy", "type": "guideline_text", "evidence_cs": "text kapitoly, bez stupně"}, {"id": "cos-metastasectomy-sbrt", "guideline_id": "cos-mk-2026", "section": "21.2.1 Chirurgická léčba metastatického karcinomu ledviny", "pdf_page": 216, "printed_page": 216, "quote": "Chirurgická léčba metastáz je doporučena v případě možnosti jejich kompletního odstranění a zvážení přínosu vs. operační zátěže (úroveň důkazů 2A), alternativou může být využití lokálně ablativních metod (např. SBRT).", "evidence": "ČOS 2A", "applies_because_cs": "Věta platí obecně pro metastázy RCC, mozek nejmenuje. U pacienta je v mozečku solitární ložisko suspektní z metastázy (MR 14. 9. 2026).", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se ložisko v pravé hemisféře mozečku do 3 mm, susp. metastáza"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "ČOS 2A"}, {"id": "eano-surgery-doubt", "guideline_id": "eano-esmo-2021-bm", "section": "Management - Recommendations - Surgery", "pdf_page": 7, "printed_page": 1338, "quote": "Surgery should be considered when there is doubt on the neoplastic nature of a brain lesion, when no primary tumour is known, when more than one tumour is known, when the primary tumour rarely generates BM or when changes in molecular profile compared with the primary tumour may impact clinical decision making [EANO: III, C; ESMO: IV, B].", "evidence": "EANO: III, C; ESMO: IV, B", "applies_because_cs": "Ložisko je zatím jen suspektní z metastázy (MR), histologicky nepotvrzené, tedy povaha ložiska není jistá. Primární nádor je znám (světlobuněčný RCC).", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se nodulus v pravé hemisféře mozečku do 3 mm, suspekce na solitérní metastázu", "Histologie primárního nádoru: světlobuněčný renální adenokarcinom G2"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "doporučení · EANO III C / ESMO IV B"}, {"id": "eano-surgery-factors", "guideline_id": "eano-esmo-2021-bm", "section": "Management - Surgery and radiotherapy", "pdf_page": 8, "printed_page": 1339, "quote": "The following factors favour neurosurgical resection: unknown primary tumour, neuroradiologically uncertain lesion, large cystic or necrotic lesion, need for high-dose steroids, mass effect and need for molecular profiling to guide clinical decision making.", "evidence": "bez stupně (text kapitoly, ne doporučení)", "applies_because_cs": "Ložisko je jen suspektní z metastázy (pochybnost o jeho povaze). Velikost do 3 mm; masový efekt ani léčba kortikoidy: neuvedeno v dostupné dokumentaci.", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se nodulus v pravé hemisféře mozečku do 3 mm, suspekce na solitérní metastázu"], "kind": "brain_metastasis", "type": "guideline_text", "evidence_cs": "text kapitoly, bez stupně"}, {"id": "us-astro-srs-limited", "guideline_id": "us-astro-2022-bm", "section": "Abstract - Results (PubMed record; full text not retrieved)", "pdf_page": null, "printed_page": 265, "quote": "Strong recommendations are made for SRS for patients with limited brain metastases and Eastern Cooperative Oncology Group performance status 0 to 2.", "evidence": "Strong recommendation (as stated in the abstract); the quality of evidence per recommendation is in the full text, which was not retrieved", "applies_because_cs": "MR mozku popisuje jediné ložisko (omezený počet) a dokumentace uvádí ECOG PS 1 (v rozmezí 0 až 2). Ložisko je zatím jen suspektní z metastázy, histologicky nepotvrzené. Citace je ze souhrnu (abstraktu), ne z plného znění doporučení.", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se nodulus v pravé hemisféře mozečku do 3 mm, suspekce na metastázu, jiná sytící se ložiska nejsou", "ECOG PS 1"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "silné doporučení (dle abstraktu; kvalita důkazů v plném znění neověřena)"}, {"id": "us-astro-defer-cns-active", "guideline_id": "us-astro-2022-bm", "section": "Abstract - Results (PubMed record; full text not retrieved)", "pdf_page": null, "printed_page": 265, "quote": "For patients with asymptomatic brain metastases eligible for central nervous system-active systemic therapy, multidisciplinary and patient-centered decision-making to determine whether local therapy may be safely deferred is conditionally recommended.", "evidence": "Conditional recommendation (as stated in the abstract); quality of evidence not given in the abstract", "applies_because_cs": "Pacient je na systémové léčbě (everolimus od 3. 9. 2026) a na cílený dotaz neguje závratě a poruchy rovnováhy, uvádí občasné mžitky před očima. Zda je ložisko asymptomatické a zda je everolimus pro tento účel léčba s účinkem v CNS, je na posouzení lékaře; dokumentace to neuvádí. Citace je ze souhrnu, ne z plného znění.", "patient_facts": ["Everolimus 5 mg od 3. 9. 2026 (3. linie), plánováno zvýšení na 10 mg", "Na cílený dotaz neguje závratě či poruchy rovnováhy, někdy během dne mžitky před očima", "MR mozku 14. 9. 2026: solitární ložisko do 3 mm v pravé hemisféře mozečku, suspekce na metastázu"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "podmíněné doporučení (dle abstraktu; kvalita důkazů v plném znění neověřena)"}, {"id": "us-asco-symptomatic", "guideline_id": "us-asco-sno-astro-2022-bm", "section": "Abstract - Recommendations (PMC record of the Neuro-Oncology co-publication; full text not retrieved)", "pdf_page": null, "printed_page": 331, "quote": "Patients with symptomatic brain metastases should receive local therapy regardless of the systemic therapy used.", "evidence": "Strength and evidence quality are not stated in the abstract; they are in the full text, which was not retrieved", "applies_because_cs": "Ložisko v mozečku je suspektní z metastázy a pacient je na systémové léčbě (everolimus). Onkolog zapsal ‚bez klin. známek mozkových mts‘; pacient neguje závratě a poruchy rovnováhy a uvádí občasné mžitky před očima, jejich souvislost s ložiskem dokumentace nehodnotí. Citace je ze souhrnu, ne z plného znění.", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se nodulus v pravé hemisféře mozečku do 3 mm, suspekce na metastázu", "Everolimus 5 mg od 3. 9. 2026", "Na cílený dotaz neguje závratě či poruchy rovnováhy, někdy během dne mžitky před očima"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "doporučení (dle abstraktu; síla a kvalita důkazů v plném znění neověřeny)"}, {"id": "us-asco-asymptomatic", "guideline_id": "us-asco-sno-astro-2022-bm", "section": "Abstract - Recommendations (PMC record of the Neuro-Oncology co-publication; full text not retrieved)", "pdf_page": null, "printed_page": 331, "quote": "For patients with asymptomatic brain metastases, local therapy should not be deferred unless deferral is specifically recommended in this guideline. The decision to defer local therapy should be based on a multidisciplinary discussion of the potential benefits and harms that the patient may experience.", "evidence": "Strength and evidence quality are not stated in the abstract; they are in the full text, which was not retrieved", "applies_because_cs": "Ložisko je suspektní z metastázy a pacient je na systémové léčbě, otázka odložení lokální léčby je tedy otevřená. Souhrn jmenuje systémové režimy jen pro nemalobuněčný karcinom plic, karcinom prsu a melanom, ne pro karcinom ledviny. Onkolog zapsal ‚bez klin. známek mozkových mts‘; souvislost občasných mžitek před očima s ložiskem dokumentace nehodnotí. Citace je ze souhrnu, ne z plného znění.", "patient_facts": ["MR mozku 14. 9. 2026: solitární sytící se nodulus v pravé hemisféře mozečku do 3 mm, suspekce na metastázu", "Everolimus 5 mg od 3. 9. 2026", "Na cílený dotaz neguje závratě či poruchy rovnováhy, někdy během dne mžitky před očima"], "kind": "brain_metastasis", "type": "recommendation", "evidence_cs": "doporučení (dle abstraktu; síla a kvalita důkazů v plném znění neověřeny)"}, {"id": "im-easl-hbvr-assess", "guideline_id": "im-easl-hbv-2025", "section": "Prophylaxis of HBV reactivation - How should individuals at risk of HBV reactivation be managed? - Recommendations", "pdf_page": 40, "printed_page": 40, "quote": "HBV reactivation risk assessment and the indication for prophylaxis is based on HBV markers (HBsAg, anti-HBc and HBV DNA status), the planned immunosuppressive regimen and the underlying disease requiring immunosuppression (Table 14). Thus, HBsAg and anti-HBc antibody status should be assessed before starting immunosuppressive therapy. HBsAg-positive individuals starting immunosuppressive therapy should undergo the same clinical evaluation recommended for all HBsAg-positive individuals.", "evidence": "LoE 1, strong recommendation, strong consensus", "applies_because_cs": "Pacient je HBsAg pozitivní a od 3. 9. 2026 užívá everolimus (inhibitor mTOR); Tabulka 14 (str. 42) uvádí u HBsAg-pozitivních inhibitory mTOR ve skupině středního rizika reaktivace (1-10 %). Sunitinib (do 8/2026) a nivolumab s ipilimumabem (do 12/2025) již skončily. Zařazení sunitinibu do řádku tabulky ‚Tyrosine kinase inhibitors‘ (vysoké riziko) je čtení asistenta, nejisté. HBV DNA, anti-HBc a hepatologické vyšetření: neuvedeno v dostupné dokumentaci.", "patient_facts": ["HBsAg pozit. pac. (anamnéza v dokumentaci)", "Everolimus 5 mg od 3. 9. 2026 (aktuální léčba)", "Sunitinib 1-8/2026 (ukončen)", "Nivolumab + ipilimumab, udržovací nivolumab do 12/2025 (ukončeno)"], "kind": "comorbidity", "type": "recommendation", "evidence_cs": "LoE 1, silné doporučení"}, {"id": "im-easl-hbvr-prophylaxis", "guideline_id": "im-easl-hbv-2025", "section": "Prophylaxis of HBV reactivation - Recommendations (HBsAg-positive individuals without another indication for antiviral therapy)", "pdf_page": 40, "printed_page": 40, "quote": "HBsAg-positive individuals at high and moderate risk of reactivation should receive prophylactic antiviral therapy with NAs (LoE 1, strong recommendation, strong consensus).", "evidence": "LoE 1, strong recommendation, strong consensus", "applies_because_cs": "Pacient je HBsAg pozitivní a užívá everolimus; Tabulka 14 (str. 42) uvádí u HBsAg-pozitivních inhibitory mTOR ve skupině středního rizika reaktivace (1-10 %). NA = nukleos(t)idová analoga. Antivirová léčba nebo profylaxe HBV: neuvedeno v dostupné dokumentaci (v chronické medikaci není).", "patient_facts": ["HBsAg pozitivní", "Everolimus 5 mg od 3. 9. 2026, plánováno zvýšení na 10 mg"], "kind": "comorbidity", "type": "recommendation", "evidence_cs": "LoE 1, silné doporučení"}, {"id": "im-easl-hbvr-agent", "guideline_id": "im-easl-hbv-2025", "section": "Prophylaxis of HBV reactivation - Recommendations (all individuals who require prophylactic NA therapy)", "pdf_page": 40, "printed_page": 40, "quote": "ETV or tenofovir (TAF or TDF) should be used for the prophylaxis of HBV reactivation.", "evidence": "LoE 3, strong recommendation, strong consensus", "applies_because_cs": "Platí, pokud lékaři u HBsAg-pozitivního pacienta na everolimu indikují profylaxi reaktivace HBV. ETV = entekavir, TAF/TDF = tenofovir alafenamid / tenofovir disoproxil fumarát. Stejné doporučení dále uvádí délku profylaxe po skončení imunosupresivní léčby (viz dokument).", "patient_facts": ["HBsAg pozitivní", "Everolimus od 3. 9. 2026"], "kind": "comorbidity", "type": "recommendation", "evidence_cs": "LoE 3, silné doporučení"}, {"id": "im-esc-anticancer-vegf", "guideline_id": "im-esc-htn-2024", "section": "9.14.6.1. Anticancer drug-induced hypertension", "pdf_page": 72, "printed_page": 3983, "quote": "This is especially evident in patients treated with vascular endothelial growth factor inhibitors, in whom BP increases in 80%–90%.", "evidence": "Text of the guideline, not a numbered recommendation (no class or level of evidence)", "applies_because_cs": "Pacient dostával sunitinib (inhibitor tyrozinkináz receptorů VEGF) 1-8/2026; při interním vyšetření 10. 2. 2026 TK 174/92. Hypertenze je uvedena v osobní anamnéze s chronickou medikací Kapidin; souvislost s protinádorovou léčbou dokumentace neuvádí.", "patient_facts": ["Arteriální hypertenze v osobní anamnéze, chronická medikace Kapidin 20 mg 1-0-0", "TK 174/92 při interním vyšetření 10. 2. 2026 (během léčby sunitinibem)", "TK 155/70 později", "Sunitinib 1-8/2026"], "kind": "comorbidity", "type": "guideline_text", "evidence_cs": "text kapitoly, bez stupně"}, {"id": "im-esc-anticancer-tki", "guideline_id": "im-esc-htn-2024", "section": "9.14.6.1. Anticancer drug-induced hypertension", "pdf_page": 72, "printed_page": 3983, "quote": "Tyrosine kinase inhibitors and proteasome inhibitors also increase BP, as do adjuvant therapies (corticosteroids, calcineurin inhibitors, non-steroidal anti-inflammatory drugs, and anti-androgen hormone therapy).", "evidence": "Text of the guideline, not a numbered recommendation (no class or level of evidence)", "applies_because_cs": "Pacient dostával sunitinib (inhibitor tyrozinkináz) 1-8/2026; při interním vyšetření 10. 2. 2026 TK 174/92, později 155/70. Hypertenze je uvedena v osobní anamnéze s chronickou medikací Kapidin; souvislost s protinádorovou léčbou dokumentace neuvádí.", "patient_facts": ["Arteriální hypertenze v osobní anamnéze, chronická medikace Kapidin 20 mg 1-0-0", "TK 174/92 při interním vyšetření 10. 2. 2026 (během léčby sunitinibem)", "TK 155/70 později", "Sunitinib 1-8/2026"], "kind": "comorbidity", "type": "guideline_text", "evidence_cs": "text kapitoly, bez stupně"}, {"id": "im-esc-anticancer-management", "guideline_id": "im-esc-htn-2024", "section": "9.14.6.1. Anticancer drug-induced hypertension", "pdf_page": 72, "printed_page": 3983, "quote": "It is recommended that management of hypertension in these patients follows that for the general population.", "evidence": "Text of the guideline, not a numbered recommendation (no class or level of evidence)", "applies_because_cs": "Platí pro hypertenzi způsobenou protinádorovou léčbou. Hypertenze je uvedena v osobní anamnéze s chronickou medikací Kapidin; souvislost s protinádorovou léčbou dokumentace neuvádí.", "patient_facts": ["Arteriální hypertenze v osobní anamnéze, chronická medikace Kapidin 20 mg 1-0-0", "TK 174/92 při interním vyšetření 10. 2. 2026 (během léčby sunitinibem)", "TK 155/70 později", "Sunitinib 1-8/2026"], "kind": "comorbidity", "type": "guideline_text", "evidence_cs": "text kapitoly, bez stupně"}, {"id": "im-esc-target", "guideline_id": "im-esc-htn-2024", "section": "8.5.2. The ideal target of blood pressure-lowering treatment - Recommendation Table 18", "pdf_page": 55, "printed_page": 3966, "quote": "To reduce CVD risk, it is recommended that treated systolic BP values in most adults be targeted to 120–129 mmHg, provided the treatment is well tolerated.", "evidence": "Class I, Level A", "applies_because_cs": "Pacient má hypertenzi s chronickou medikací Kapidin 20 mg 1-0-0; od 10. 2. 2026 přidán Orcal 10 mg ½-0-0. Při interním vyšetření 10. 2. 2026 TK 174/92, dle pacienta doma prav. TK kolem 150; později v ordinaci 155/70 (doma tehdy neměřil, byl na dovolené). Tyto hodnoty jsou nad cílovým rozmezím systolického tlaku. Dokumentace uvádí, že ACE-inhibitory jsou kontraindikovány pro zvýšené riziko anafylaxe (pacient je na everolimu). Snášenlivost léčby: neuvedeno v dostupné dokumentaci.", "patient_facts": ["TK 174/92 při interním vyšetření 10. 2. 2026, dle pacienta doma prav. TK kolem 150", "Od 10. 2. 2026 nově Orcal 10 mg ½-0-0, poučen o domácím měření TK", "Chronická medikace: Kapidin 20 mg 1-0-0", "TK 155/70 později; doma tehdy TK neměřil (dovolená)", "Kontraindikovány jsou ACEi pro zvýšené riziko anafylaxe"], "kind": "comorbidity", "type": "recommendation", "evidence_cs": "třída I, úroveň A"}, {"id": "im-esc-lenient-target", "guideline_id": "im-esc-htn-2024", "section": "8.5.2. The ideal target of blood pressure-lowering treatment - Recommendation Table 18", "pdf_page": 55, "printed_page": 3966, "quote": "Because the CVD benefit of an on-treatment systolic BP target of 120–129 mmHg may not generalize to the following specific settings, personalized and more lenient BP targets (e.g. <140/90 mmHg) may be considered among patients meeting the following criteria: clinically significant moderate-to-severe frailty at any age, and/or limited predicted lifespan (<3 years).", "evidence": "Class IIb, Level C", "applies_because_cs": "Pacient má metastatický karcinom ledviny s progresí po dvou liniích léčby. Zda má omezenou předpokládanou délku života nebo klinicky významnou křehkost, dokumentace neuvádí a je to klinický úsudek lékaře; asistent jej nečiní.", "patient_facts": ["Metastatický světlobuněčný karcinom ledviny, progrese po 1. a 2. linii, od 3. 9. 2026 everolimus", "ECOG PS 1"], "kind": "comorbidity", "type": "recommendation", "evidence_cs": "třída IIb, úroveň C"}], "pages": [{"guideline_id": "eano-esmo-2021-bm", "pdf_page": 7, "text": "Recommendations Surgery \u0001 Surgery should be considered when there is doubt on the neoplastic nature of a brain lesion, when no primary tumour is known, when more than one tumour is known, when the primary tumour rarely generates BM or when changes in molecular profile compared with the primary tumour may impact clinical decision making [EANO: III, C; ESMO: IV, B]. […] Radiotherapy \u0001 SRS is recommended for patients with a limited number (1-4) of BMs [EANO: I, A; ESMO: I, A]. \u0001 SRS may be considered for patients with a higher number of BMs (5-10) with a cumulative tumour volume <15 ml [EANO: II, B; ESMO: II, B]. \u0001 SRS to the resection cavity is recommended after complete or incomplete resection of BMs [EANO: I, A; ESMO: I, A]. […] Pharmacotherapy \u0001 Systemic pharmacotherapy based on histological and molecular characteristics of the primary tumour and previous treatment should be considered for most patients with BMs [EANO: IV, n/a; ESMO: IV, B]."}, {"guideline_id": "eano-esmo-2021-bm", "pdf_page": 8, "text": "Ideally, therapeutic decisions should be discussed at a dedicated BM board or at a disease-specific tumour board with participation of colleagues experienced in the management of CNS tumours [EANO: IV, n/a; ESMO: V, B]. […] The following factors favour neurosurgical resection: unknown primary tumour, neuroradiologically uncertain lesion, large cystic or necrotic lesion, need for high-dose steroids, mass effect and need for molecular profiling to guide clinical decision making. Factors favouring SRS alone over surgery commonly followed by SRS or systemic therapy include a surgically less accessible location, increased surgical risk and preference for a noninvasive outpatient treatment. […] BRAF inhibitors and WBRT cause severe dermatitis that is usually managed by avoiding concomitant treatment.75 For patients with asymptomatic or oligosymptomatic BM, no prospective trials have addressed the question of optimal combined modality treatment with systemic therapy, including TKI or immune checkpoint inhibition, and surgery or SRS."}, {"guideline_id": "eano-esmo-2021-bm", "pdf_page": 12, "text": "Volume 32 - Issue 11 - 2021 Annals of Oncology \u0001 Neurocognitive function and ability to consent should be regularly assessed [EANO: IV, n/a; ESMO: IV, B]. \u0001 Brain MRI should be carried out every 2-3 months or at any instance of suspected neurological progression [EANO: IV, C; ESMO: IV, B]. \u0001 Advanced MRI techniques, such as MRS and perfusion imaging and amino acid PET, should be considered for distinguishing treatment-related changes from tumour progression [EANO: III, C; ESMO: IV, C]."}, {"guideline_id": "eano-esmo-2021-bm", "pdf_page": 5, "text": "In the situations of multiple systemic treatment options, CNS and extra-CNS disease activity as well as toxicity profile of the respective treatment options should be considered in the decision-making process for the optimal systemic treatment strategy [EANO: IV, A; ESMO: IV, B]."}, {"guideline_id": "cos-mk-2026", "pdf_page": 217, "text": "Kabozantinib (2A) Everolimus (2A) Dosud nepoužitý VEGF-TKI (2B) Belzutifan (2B) Lenvatinib a everolimus (2B) Nivolumab (1) Kabozantinib (1) Everolimus (1) Dosud nepoužitý VEGF-TKI (2B) […] Nivolumab + ipilimumab (1) Axitinib+ pembrolizumab (1) Kabozantinib + nivolumab (1) Lenvatinib + pemrolizumab (1) Kabozantinib (2A) Pazopanib (2A) Sunitinib (2A) Axitinib + avelumab (2A) Tivozanib (2B) […] Kabozantinib (2A) Pazopanib (2A) Sunitinib (2A) Axitinib (2A) Everolimus (2B) […] Kabozantinib (2A) Everolimus (2A) Dosud nepoužitý VEGF-TKI (2B) Belzutifan (2B) Lenvatinib a everolimus (2B)"}, {"guideline_id": "cos-mk-2026", "pdf_page": 218, "text": "\u0007U nemocných s mRCC by mělo být zvažováno zařazení do klinické studie. […] \u0007Počet linií léčby mRCC by neměl být limitován jinak než stavem nemocného a dostupností léků (2A)."}, {"guideline_id": "cos-mk-2026", "pdf_page": 216, "text": "\u0007Chirurgická léčba metastáz je doporučena v případě možnosti jejich kompletního odstranění a zvážení přínosu vs. operační zátěže (úroveň důkazů 2A), alternativou může být využití lokálně ablativních metod (např. SBRT)."}, {"guideline_id": "us-astro-2022-bm", "pdf_page": null, "text": "RESULTS: Strong recommendations are made for SRS for patients with limited brain metastases and Eastern Cooperative Oncology Group performance status 0 to 2. […] For patients with asymptomatic brain metastases eligible for central nervous system-active systemic therapy, multidisciplinary and patient-centered decision-making to determine whether local therapy may be safely deferred is conditionally recommended."}, {"guideline_id": "us-asco-sno-astro-2022-bm", "pdf_page": null, "text": "Patients with symptomatic brain metastases should receive local therapy regardless of the systemic therapy used. For patients with asymptomatic brain metastases, local therapy should not be deferred unless deferral is specifically recommended in this guideline. The decision to defer local therapy should be based on a multidisciplinary discussion of the potential benefits and harms that the patient may experience."}, {"guideline_id": "im-easl-hbv-2025", "pdf_page": 40, "text": "Recommendations \u0002 HBV reactivation risk assessment and the indication for prophylaxis is based on HBV markers (HBsAg, anti-HBc and HBV DNA status), the planned immunosuppressive regimen and the underlying disease requiring immunosuppression (Table 14). Thus, HBsAg and anti-HBc antibody status should be assessed before starting immunosuppressive therapy. HBsAg-positive individuals starting immunosuppressive therapy should undergo the same clinical evaluation recommended for all HBsAg-positive individuals. […] The term prophylaxis is therefore used for NA therapy. \u0002 HBsAg-positive individuals at high and moderate risk of reactivation should receive prophylactic antiviral therapy with NAs (LoE 1, strong recommendation, strong consensus). […] The following section is intended for all individuals who require prophylactic NA therapy \u0002 ETV or tenofovir (TAF or TDF) should be used for the prophylaxis of HBV reactivation."}, {"guideline_id": "im-esc-htn-2024", "pdf_page": 72, "text": "This is especially evident in patients treated with vascular endothelial growth factor inhibitors, in whom BP increases in 80%–90%.945 Tyrosine kinase inhibitors and proteasome inhibitors also increase BP, as do adjuvant therapies (corticosteroids, calcineurin inhibitors, non-steroidal anti-inflammatory drugs, and anti-androgen hormone therapy). […] It is recommended that management of hypertension in these patients follows that for the general population.945,946 Managing these complex patients requires multidisciplinary healthcare involving oncologists, hypertension specialists, cardiologists, and nephrologists,945,946 as highlighted in the 2022 ESC Guidelines on cardio-oncology.946"}, {"guideline_id": "im-esc-htn-2024", "pdf_page": 55, "text": "3966 Recommendation Table 18 — Recommendations for blood pressure targets with treatment (see Evidence Table 34) Recommendations To reduce CVD risk, it is recommended that treated systolic BP values in most adults be targeted to 120–129 mmHg, provided the treatment is well tolerated. […] Because the CVD benefit of an on-treatment systolic BP target of 120–129 mmHg may not generalize to the following specific settings, personalized and more lenient BP targets (e.g. <140/90 mmHg) may be considered among patients meeting the following criteria: clinically significant moderate-to-severe frailty at any age, and/or limited predicted lifespan (<3 years)."}, {"guideline_id": "cos-mk-2026", "pdf_page": 215, "text": "Základem je léčba chirurgická. Pokud je to možné, pak by u všech T1 tumorů měl být proveden ledvinu šetřící výkon, ve všech ostatních případech je provedena radikální nefrektomie. Ledvinu šetřící výkon by měl být zvážen i u T2 tumorů, pokud je technicky možný. […] Regionální lymfadenektomie je možná u vysoce rizikových tumorů nebo v případě radiograficky patrné lymfadenopatie z důvodů zpřesnění stagingu a prognózy, i když její onkologický benefit nebyl jednoznačně prokázaný. […] Adjuvantní léčba pembrolizumabem může být zvažovaná u pacientů s operabilním světlobuněčným RCC se středním nebo vysokým rizikem (střední riziko: pT2, grade 4 nebo sarkomatoidní složka, N0M0 nebo pT3, jakýkoliv grade, N0M0; vysoké riziko: pT4, jakýkoliv grade, N0 M0 nebo jakékoliv pT jakýkoliv grade, N1M0) konzultaci s pacientem s ohledem na potenciální dlouhodobé nežádoucí účinky (úroveň důkazů 1). […] U pacientů po metastasektomii (dle registrační studie optimálně do jednoho roku od nefrektomie) pro oligometastatické onemocnění lze nabídnout adjuvantní pembrolizumab po kompletní resekci (stupeň doporučení 1).."}, {"guideline_id": "cos-mk-2026", "pdf_page": 219, "text": "Nivolumab 3 mg/kg první 4 cykly à 3 týdny poté 240 mg à 2 týdny nebo 480 mg à 4 týdny ipilimumab 1 mg/kg à 3 týdny 4 cykly"}], "not_retrieved": [{"name": "ESMO Clinical Practice Guideline: Renal cell carcinoma (Powles T et al., Ann Oncol 2024;35(8):692-706) a ESMO Living Guideline RCC v1.1 (červen 2025)", "society": "ESMO", "region": "EU", "url": "https://www.esmo.org/guidelines/esmo-clinical-practice-guideline-renal-cell-carcinoma", "pdf_url": "https://www.annalsofoncology.org/action/showPdf?pii=S0923-7534%2824%2900676-8", "reason": "PDF nelze stáhnout (vydavatel 403, není v PMC, kopie v repozitáři je neveřejná); sada snímků Living Guideline obsahuje jen obrázky bez textu, citace proto nelze ověřit", "important": true, "note_cs": "Doporučení ESMO pro karcinom ledviny (2024) nenačteno; systémové možnosti léčby citujeme z Modré knihy ČOS."}, {"name": "EAU Guidelines on Renal Cell Carcinoma (limited update March 2026)", "society": "EAU", "region": "EU", "url": "https://uroweb.org/guidelines/renal-cell-carcinoma", "reason": "PDF je volně ke stažení, ale podmínky užití (kap. 13) zakazují bez písemného svolení EAU nahrávat text doporučení nebo z něj odvozený materiál do softwaru, aplikací a nástrojů umělé inteligence. Proto necitujeme; tým může požádat EAU o svolení. Stažená kopie byla smazána."}, {"name": "NCCN Clinical Practice Guidelines in Oncology: Central Nervous System Cancers a Kidney Cancer", "society": "NCCN", "region": "US", "reason": "Nenačteno: stažení vyžaduje bezplatné přihlášení k NCCN. Necitujeme."}, {"name": "Radiation Therapy for Brain Metastases: An ASTRO Clinical Practice Guideline (plné znění)", "society": "ASTRO", "region": "US", "reason": "Plné znění nenačteno: vydavatel (practicalradonc.org) i astro.org blokují automatické stažení, kopie v PMC ani v repozitáři neexistuje. Citujeme jen abstrakt z PubMed; jednotlivá doporučení s kvalitou důkazů a tabulky dávek nejsou ověřena."}, {"name": "Treatment for Brain Metastases: ASCO-SNO-ASTRO Guideline (plné znění)", "society": "ASCO, SNO, ASTRO", "region": "US", "reason": "Plné znění neověřeno: PMC (PMC8917399) odpovídá automatickým dotazům stránkou reCAPTCHA a plný text v XML neuvolňuje, ascopubs.org a academic.oup.com vracejí 403, kopie v repozitáři Erasmus je za ochranou Cloudflare. Citujeme jen abstrakt."}, {"name": "Radiation Therapy for Brain Metastases: ASCO Guideline Endorsement of ASTRO Guideline (Schiff D a kol., J Clin Oncol 2022)", "society": "ASCO", "region": "US", "reason": "Nenačteno: jediná volná kopie (pure.eur.nl) je za ochranou Cloudflare. Necitujeme."}, {"name": "ESTRO / ESTRO-ACROP doporučení ke stereotaktické radiochirurgii mozkových metastáz", "society": "ESTRO", "region": "EU", "reason": "V časovém limitu podrobně nehledáno; evropským doporučením k této otázce je EANO-ESMO. Necitujeme."}, {"name": "Doporučení k metabolickému sledování při léčbě everolimem (glykémie, lipidy)", "society": null, "region": null, "reason": "V časovém limitu jsme v doporučeních text nenašli; doporučení ESC k hypertenzi ani EASL k HBV to neřeší. Obvykle to uvádí SPC everolimu (příbalová informace, ne doporučený postup). Necitujeme."}], "literature": [{"id": "lit-01", "pmid": "42559731", "doi": "10.1002/cam4.71557", "title": "Up to Four-Year Outcomes of Single-Fraction Stereotactic Radiosurgery for Small Brain Metastases: A Competing-Risk Analysis.", "first_author": "Gruber I", "journal": "Cancer Med", "year": 2026, "pub_type": ["Journal Article"], "url": "https://pubmed.ncbi.nlm.nih.gov/42559731/", "pmc": "PMC13445558", "question": "q1", "quotes": ["Local control after 18 Gy SRS is poor in radioresistant brain metastases.", "At 36 months, cumulative LTF was 62% (95% CI, 42%-77%) versus 31% (95% CI, 17%-46%) in radioresistant versus radiosensitive tumors (p = 0.011), whereas death without prior LTF was 19% (95% CI, 7%-34%) versus 46% (95% CI, 30%-61%) (p = 0.003)."], "why_relevant_cs": "Kohorta malých mozkových metastáz (medián objemu 0,3 cc) léčených jednorázovou SRS 18 Gy; RCC je zde zařazen mezi radiorezistentní nádory s horší lokální kontrolou. Týká se pacienta se solitárním uzlem v mozečku do 3 mm při metastatickém světlobuněčném RCC. Studie nesrovnává SRS se sledováním MR. Výsledek je v rozporu s kohortou Yaeh 2015 (lit-03); radiorezistentní skupina spojuje melanom, sarkom a RCC, údaj pro samotný RCC abstrakt neuvádí."}, {"id": "lit-02", "pmid": "39107179", "doi": "10.1016/j.euo.2024.07.005", "title": "Clinical Outcomes and Targeted Genomic Analysis of Renal Cell Carcinoma Brain Metastases Treated with Stereotactic Radiosurgery.", "first_author": "Ma J", "journal": "Eur Urol Oncol", "year": 2025, "pub_type": ["Journal Article"], "url": "https://pubmed.ncbi.nlm.nih.gov/39107179/", "pmc": "PMC12930426", "question": "q1", "quotes": ["Durable local control of 83% was achieved at 12 mo after SRS, and 59% of lesions initially meeting the radiographic criteria for progression at 3-mo evaluation would be considered to represent pseudoprogression at 6-mo evaluation.", "SRS provides durable in-field local control of BMs."], "why_relevant_cs": "Největší uvedená kohorta mozkových metastáz RCC léčených SRS (91 pacientů, 212 lézí); udává lokální kontrolu a riziko pseudoprogrese, což je důležité pro hodnocení kontrolních MR u pacienta s podezřením na metastázu v mozečku."}, {"id": "lit-03", "pmid": "26233247", "doi": "10.1007/s11060-015-1871-5", "title": "Control of brain metastases from radioresistant tumors treated by stereotactic radiosurgery.", "first_author": "Yaeh A", "journal": "J Neurooncol", "year": 2015, "pub_type": ["Journal Article"], "url": "https://pubmed.ncbi.nlm.nih.gov/26233247/", "pmc": null, "question": "q1", "quotes": ["The overall local control rate in the radioresistant cohort was 89.8 and 90.1 % in the non-radioresistant cohort.", "There was no significant difference in local control of BM from radioresistant and non-radioresistant primary tumors treated with GKRS."], "why_relevant_cs": "Srovnání lokální kontroly po Gamma Knife u radiorezistentních (včetně RCC) a ostatních nádorů; výsledek je v rozporu s kohortou Gruber 2026, proto obě uvádíme vedle sebe. Týká se otázky SRS u pacienta s metastatickým světlobuněčným RCC."}, {"id": "lit-04", "pmid": "34673916", "doi": "10.1001/jamaoncol.2021.4544", "title": "Clinical Activity and Safety of Cabozantinib for Brain Metastases in Patients With Renal Cell Carcinoma.", "first_author": "Hirsch L", "journal": "JAMA Oncol", "year": 2021, "pub_type": ["Journal Article"], "url": "https://pubmed.ncbi.nlm.nih.gov/34673916/", "pmc": "PMC8532040", "question": "q2", "quotes": ["The intracranial response rate was 55% (95% CI, 36%-73%) and 47% (95% CI, 33%-61%) in cohorts A and B, respectively.", "In this cohort study, cabozantinib showed considerable intracranial activity and an acceptable safety profile in patients with RCC and brain metastases."], "why_relevant_cs": "Retrospektivní mezinárodní kohorta (88 pacientů) s intrakraniální odpovědí na kabozantinib v jakékoli linii; pacient progreduje po nivolumabu+ipilimumabu a sunitinibu a kabozantinib je jednou z možností další linie."}, {"id": "lit-05", "pmid": "31178240", "doi": "10.1016/j.clgc.2019.05.002", "title": "Cabozantinib in Renal Cell Carcinoma With Brain Metastases: Safety and Efficacy in a Real-World Population.", "first_author": "Peverelli G", "journal": "Clin Genitourin Cancer", "year": 2019, "pub_type": ["Journal Article"], "url": "https://pubmed.ncbi.nlm.nih.gov/31178240/", "pmc": null, "question": "q2", "quotes": ["Patients were selected for the presence of BM before the start of treatment and for at least 1 previous tyrosine kinase inhibitor (TKI) treatment regimen for metastatic disease.", "All 5 patients treated with a combined systemic and brain-directed approach obtained intracranial disease control, without increased toxicity."], "why_relevant_cs": "Malá reálná kohorta (12 pacientů) s kabozantinibem po předchozím TKI, což odpovídá pacientovi po sunitinibu; popisuje i kombinaci systémové a lokální léčby mozku."}, {"id": "lit-06", "pmid": "41014863", "doi": "10.1016/j.ctrv.2025.103024", "title": "Impact of brain metastases on systemic renal cell carcinoma treatment outcomes: A systematic literature review.", "first_author": "Charnley N", "journal": "Cancer Treat Rev", "year": 2025, "pub_type": ["Journal Article", "Systematic Review"], "url": "https://pubmed.ncbi.nlm.nih.gov/41014863/", "pmc": null, "question": "q2", "quotes": ["The most evaluated systemic therapies were sunitinib, nivolumab, ipilimumab + nivolumab, cabozantinib and sorafenib.", "There were no robust comparative data to guide systemic treatment selection."], "why_relevant_cs": "Systematický přehled 62 publikací o systémové léčbě RCC s mozkovými metastázami; mezi nejčastěji hodnocenými léky nejsou everolimus, lenvatinib+everolimus ani tivozanib, tedy právě léčba, kterou pacient dostává nebo může dostat. Podklad pro vyznačení mezery v datech."}, {"id": "lit-07", "pmid": "39682184", "doi": "10.3390/cancers16233997", "title": "Hepatitis and Hepatitis B Virus Reactivation in Everolimus-Treated Solid Tumor Patients: A Focus on HBV-Endemic Areas.", "first_author": "Su CH", "journal": "Cancers (Basel)", "year": 2024, "pub_type": ["Journal Article"], "url": "https://pubmed.ncbi.nlm.nih.gov/39682184/", "pmc": "PMC11640431", "question": "q3", "quotes": ["HBVr occurred in 11.36% (5/44) of HBsAg-positive patients without NUCs and 5.56% (2/36) with prophylaxis.", "HBV screening and liver function monitoring are critical for patients with past or current HBV infection receiving everolimus, especially in endemic areas."], "why_relevant_cs": "Retrospektivní kohorta (377 pacientů) léčených everolimem s údaji o reaktivaci HBV podle HBsAg; pacient je HBsAg pozitivní a nyní užívá everolimus. Reaktivace 11,36 % (n = 44, bez profylaxe) je nad pásmem 1-10 %, do kterého EASL 2025 (Tabulka 14) řadí inhibitory mTOR u HBsAg-pozitivních."}, {"id": "lit-08", "pmid": "24368609", "doi": "10.1097/MJT.0000000000000005", "title": "Prevention of Hepatitis B Virus Reactivation With Lamivudine in a Patient With Advanced Renal Cell Carcinoma Treated With Everolimus.", "first_author": "D'Aniello C", "journal": "Am J Ther", "year": 2016, "pub_type": ["Case Reports", "Journal Article"], "url": "https://pubmed.ncbi.nlm.nih.gov/24368609/", "pmc": null, "question": "q3", "quotes": ["We present in this study the first case to our knowledge of a hepatitis B surface antigen-positive patient with metastatic renal cell carcinoma who has been successfully treated with prophylactic lamivudine and everolimus.", "Hepatitis B surface antigen positivity may be found in up to 10% of cancer patients but should not be considered a contraindication to treatment with everolimus."], "why_relevant_cs": "Kazuistika HBsAg pozitivního pacienta s metastatickým RCC léčeného everolimem s profylaxí lamivudinem; shoduje se s pacientem ve třech faktech (RCC, HBsAg pozitivita, everolimus)."}, {"id": "lit-09", "pmid": "23606919", "doi": "10.1007/s12328-013-0371-4", "title": "Progressive liver failure induced by everolimus for renal cell carcinoma in a 58-year-old male hepatitis B virus carrier.", "first_author": "Mizuno S", "journal": "Clin J Gastroenterol", "year": 2013, "pub_type": ["Journal Article"], "url": "https://pubmed.ncbi.nlm.nih.gov/23606919/", "pmc": "PMC3627850", "question": "q3", "quotes": ["He was admitted under a diagnosis of flare (acute exacerbation) of chronic B hepatitis due to HBV reactivation.", "Antiviral prophylaxis must be taken into consideration before beginning immunosuppressive therapy such as everolimus in HBV carriers."], "why_relevant_cs": "Kazuistika fatálního selhání jater při reaktivaci HBV u nosiče HBV léčeného everolimem pro metastatický RCC; týká se pacienta s HBsAg pozitivitou na everolimu."}, {"id": "lit-10", "pmid": "24002736", "doi": "10.1007/s10549-013-2681-0", "title": "Fatal hepatitis B reactivation due to everolimus in metastatic breast cancer: case report and review of literature.", "first_author": "Teplinsky E", "journal": "Breast Cancer Res Treat", "year": 2013, "pub_type": ["Case Reports", "Journal Article", "Review"], "url": "https://pubmed.ncbi.nlm.nih.gov/24002736/", "pmc": null, "question": "q3", "quotes": ["Here, we present an unfortunate case of fatal hepatitis B reactivation in a woman with metastatic breast cancer treated with everolimus and exemestane.", "Clinicians and patients should be aware of this rare but fatal complication prior to everolimus use, and a detailed history, screening for hepatitis B and prophylactic antiviral treatment should be considered."], "why_relevant_cs": "Kazuistika s přehledem literatury o fatální reaktivaci HBV při everolimu (karcinom prsu, ne RCC); doplňuje údaje k HBsAg pozitivitě pacienta na everolimu."}], "queries": [{"question_cs": "Otázka 1: Léčba velmi malých (≤5 mm) mozkových metastáz karcinomu ledviny: SRS vs aktivní sledování MR, lokální kontrola SRS u radiorezistentního RCC.", "query": "(renal cell carcinoma) AND (brain metastases) AND (stereotactic radiosurgery) AND (local control)", "date_run": "2026-10-16"}, {"question_cs": "Otázka 1 (doplňující): velmi function refRegistry() {

    n(r) { if (!r) return ""; if (list.findIndex(x => key(x) === key(r)) < 0) list.push(r); return ""; },
    /* Numbered marker for blocks where the text itself opens the edit dialog (round 15). */
    mark(r) { if (!r) return ""; this.n(r); const k = list.findIndex(x => key(x) === key(r)) + 1; return `<button class="ref" data-src='${esc(JSON.stringify(r))}' title="Otevřít zdroj">[${k}]</button>`; },
    wrap(html, r) { if (!r) return html; this.n(r); return `<span class="srcl" role="button" tabindex="0" data-src='${esc(JSON.stringify(r))}' title="Otevřít zdroj">${html}</span>`; },

function linkProse(text, refs, reg) {

      <thead><tr><th>ID${RS}</th><th>Pacient${RS}</th><th>RČ${RS}</th><th>Věk${RS}</th><th>Diagnóza${RS}</th>${colHead("owner", "Vlastník")}${colHead("dept", "Odesílající pracoviště")}${colHead("slot", "Příští MDT")}${colHead("status", "Stav")}<th>Podáno${RS}</th></tr></thead>
      <tbody>${rows.map(p => `<tr class="click" data-open="${esc(p.file)}">
        <td class="id nw">${p.id}</td><td><b>${esc(surnameFirst(p))}</b>${p.warn ? ' <span class="tag ocr">ověřit identitu</span>' : ""}</td>
        <td class="num ${p.rc ? "" : "muted"}" title="${p.rc ? "" : "Rodné číslo " + GAP}">${esc(rcText(p))}</td><td class="num ${ageNum(p) ? "" : "muted"}" ${!p.age && p.birth ? 'title="vypočteno z data narození"' : ""}>${esc(ageNum(p) || "-")}</td>
