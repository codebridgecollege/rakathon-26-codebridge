        <td>${statusChip(p)}</td><td class="num nw">${fmtDate(p.submitted)}</td></tr>`).join("") || `<tr><td colspan="12" class="muted">Žádný pacient neodpovídá filtru.</td></tr>`}</tbody>
    </table></div>
    <div class="row spread" style="padding:10px 14px;border-top:1px solid var(--line)"><span class="muted small">${S.dbAll ? `Zobrazeno všech ${all.length}` : `Zobrazeno ${all.length ? S.dbPage * PER + 1 : 0}-${Math.min(all.length, S.dbPage * PER + PER)} z ${all.length}`}</span>
      <span class="row">${S.dbAll ? `<button class="btn small" data-act="dbpaged">Stránkovat</button>` : `<button class="btn small" data-dbpage="${S.dbPage - 1}" ${S.dbPage ? "" : "disabled"}>‹ Předchozí</button>${Array.from({ length: pages }, (_, i) => `<button class="btn small ${i === S.dbPage ? "primary" : ""}" data-dbpage="${i}">${i + 1}</button>`).join("")}<button class="btn small" data-dbpage="${S.dbPage + 1}" ${S.dbPage < pages - 1 ? "" : "disabled"}>Další ›</button>${all.length > PER ? `<button class="btn small" data-act="dball">Zobrazit vše (+${all.length - rows.length})</button>` : ""}`}</span></div></div>
  </div>`;
}

/* ---------- 2. MDT calendar ---------- */
/* Google-calendar-like navigation (Soňa, round 2): week arrows, a month grid to jump anywhere, a year picker. */
function miniMonth() {
  const [y, m] = S.miniMonth.split("-").map(Number);
  const first = `${S.miniMonth}-01`, start = mondayOf(first);
  const weekEnd = addDays(S.week, 6);
  let cells = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"].map(d => `<span class="wd">${d}</span>`).join("");
  for (let i = 0; i < 42; i++) {
    const iso = addDays(start, i), d = dObj(iso);
    if (i >= 35 && d.getUTCMonth() + 1 !== m) break;
    cells += `<button data-jump="${iso}" class="${d.getUTCMonth() + 1 !== m ? "out" : ""} ${iso >= S.week && iso <= weekEnd ? "wk" : ""} ${seminarOn(iso) ? "sem" : ""}" aria-label="${iso}">${d.getUTCDate()}</button>`;
  }
  const years = [2024, 2025, 2026, 2027, 2028];
  return `<div class="card"><div class="row spread" style="margin-bottom:8px"><button class="btn small" data-mm="-1" aria-label="Předchozí měsíc">‹</button>
      <span class="row"><b>${MONTHS[m - 1]}</b><select class="input" id="mmyear" style="width:auto;padding:3px 6px" aria-label="Rok">${years.map(v => `<option ${v === y ? "selected" : ""}>${v}</option>`).join("")}</select></span>
      <button class="btn small" data-mm="1" aria-label="Další měsíc">›</button></div>
    <div class="mini">${cells}</div></div>`;
}
const dayAgenda = day => S.patients.filter(x => x.slot && x.slot.day === day).sort((a, b) => a.slot.time.localeCompare(b.slot.time));
function viewCalendar() {
  const days = [0, 1, 2, 3, 4].map(i => addDays(S.week, i));
  const unscheduled = S.patients.filter(p => !p.slot || p.file === S.schedPick);
  const byslot = {}; S.patients.forEach(p => { if (p.slot) byslot[`${p.slot.day} ${p.slot.time}`] = p; });
  const inSem = (day, t) => { const s = seminarOn(day); return s && t >= s[0] && t < s[1]; };
  let cells = `<div></div>${days.map(d => `<div class="dh">${dayLabel(d)}${d === TODAY ? " · dnes" : ""}<small>${seminarOn(d) ? esc(seminarOn(d)[2]) + " " + seminarOn(d)[0] + "-" + seminarOn(d)[1] : "&nbsp;"}</small>${dayAgenda(d).length ? `<button class="btn small primary startmdt" data-startday="${d}">Zahájit MDT ▸</button>` : ""}</div>`).join("")}`;
  /* By default the grid shows seminar hours with 30 minutes either side, so the first seminar row is in view
     without scrolling; "Zobrazit celý den" shows every slot. A week without a seminar, or a booking outside
     that range, always shows the whole day so no booked slot is hidden. */
  const sems = days.map(seminarOn).filter(Boolean);
  const shift = (t, n) => { const [h, m] = t.split(":").map(Number), x = h * 60 + m + n; return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; };
  const from = sems.length ? shift(sems.map(s => s[0]).sort()[0], -30) : null, to = sems.length ? shift(sems.map(s => s[1]).sort().slice(-1)[0], 30) : null;
  const outside = from && days.some(d => TIMES.some(t => byslot[`${d} ${t}`] && (t < from || t >= to)));
  const canTrim = !!from && !outside;
  const times = canTrim && !S.calFullDay ? TIMES.filter(t => t >= from && t < to) : TIMES;
  for (const t of times) {
    cells += `<div class="tm ${t.endsWith(":00") ? "hr" : ""}">${t}</div>`;
    for (const d of days) {
      const p = byslot[`${d} ${t}`];
      const sem = inSem(d, t);
      let inner = "";
      /* Soňa wants the real name in the slot, not just the case ID: the calendar is used by the MDT team itself. */
      /* A missing birth number is left out of the slot text (a bare "RČ -" is noise there) but stays in the label. */
      if (p) inner = `<button class="slotbtn taken" draggable="true" data-drag="${esc(p.file)}" data-slot="${d} ${t}" data-dbl="${esc(p.file)}" title="${esc(surnameFirst(p))}, RČ ${esc(p.rc || GAP)}. Dvojklik otevře případ" aria-label="${esc(surnameFirst(p))}, RČ ${esc(p.rc || GAP)}, ${t}" aria-pressed="${S.calPop === p.file}"><span class="dot" style="background:var(--${{ new: "muted", scheduled: "change", attention: "missing", ready: "ok", done: "accent" }[p.status]})"></span><span class="cid">${esc(surnameFirst(p))}</span>${p.rc ? `<span class="nm">RČ ${esc(p.rc)}</span>` : ""}</button>`;
      else if (sem) inner = `<button class="slotbtn free ${S.schedPick ? "target" : ""}" data-free="${d} ${t}" aria-label="Volný termín ${t}"><span class="tt2">${t}-${slotEnd(t)}</span>${S.schedPick ? " · Naplánovat sem" : ""}</button>`;
      cells += `<div class="cell ${sem ? "sem" : ""}">${inner}</div>`;
    }
  }
  const pop = S.calPop && P(S.calPop);
  const card = pop ? `<div class="minicard" id="minicard"><div class="row spread"><span class="label">Pacient</span>${statusChip(pop)}</div>
      <h2>${esc(surnameFirst(pop))}</h2>
      <div class="facts" style="margin:0"><span>RČ: <b>${esc(pop.rc || "-")}</b></span>${ageNum(pop) ? `<span>Věk: <b>${esc(ageNum(pop))}</b></span>` : ""}<span>Termín: <b>${esc(slotText(pop))}</b></span><span>Vlastník: <b>${esc(pop.owner)}</b></span></div>
      <div><span class="label">Diagnóza</span><p style="margin:2px 0 0;font-weight:700">${esc(pop.full ? dxHeadlineText() : pop.diagnosis)}</p></div>
      <div class="question ${pop.explicit || edOf("q", pop.file) ? "" : "missing"}" style="padding:8px 12px"><span class="label">Otázka pro MDT</span><p style="font-size:14px">${esc(questionText(pop))}</p></div>
      ${pop.full ? `<p class="small" style="margin:0">${esc(briefPlain().slice(0, 260))}…${edOf("brief", CASE.file) ? " (upraveno lékařem)" : ""}</p>` : `<p class="small" style="margin:0">${esc(pop.summary || "")}</p>`}
      <div class="row" style="gap:6px"><button class="btn primary" data-open="${esc(pop.file)}">Otevřít případ</button><button class="btn" data-pick="${esc(pop.file)}">Změnit termín</button><button class="btn" data-unsched="${esc(pop.file)}">Uvolnit termín</button><button class="btn" data-calclose="1" aria-label="Zavřít kartu" style="margin-left:auto">✕</button></div></div>` : "";
  const end = addDays(S.week, 4);
  return `<div class="page">
    <div class="pagehead"><div><h1>Kalendář MDT</h1><div class="muted small">${dObj(S.week).getUTCDate()}. ${dObj(S.week).getUTCMonth() + 1}. až ${dObj(end).getUTCDate()}. ${dObj(end).getUTCMonth() + 1}. ${end.slice(0, 4)}</div></div>
      <div class="row"><button class="btn small" data-wk="-1">‹ Předchozí týden</button><button class="btn small" data-act="today">Dnes</button><button class="btn small" data-wk="1">Další týden ›</button></div></div>
    <div class="calwrap3">
      <div class="stack" style="gap:8px"><div class="scroll"><div class="cal">${cells}</div></div>
        ${canTrim ? `<div class="row small muted"><span>${S.calFullDay ? "Zobrazen celý den" : `Zobrazeny hodiny semináře ${esc(from)}-${esc(to)}`}</span><button class="linkbtn small" data-act="calfull">${S.calFullDay ? "Jen hodiny semináře" : "Zobrazit celý den"}</button></div>` : ""}</div>
      <div class="stack">
        ${miniMonth()}
        <div class="card"><div class="head"><h2>Nenaplánovaní (${unscheduled.length})</h2></div>
          ${S.schedPick ? `<p class="small" style="margin:0 0 8px">Vyberte volný slot pro <b>${esc(surnameFirst(P(S.schedPick)))}</b> v kalendáři. <button class="linkbtn" data-act="cancelsched">Zrušit</button></p>` : `<p class="muted small" style="margin:0 0 8px">Přetáhněte pacienta do volného slotu.</p>`}
          <div class="tasklist">${unscheduled.map(p => `<div class="row spread dragrow ${S.schedPick === p.file || S.calPop === p.file ? "sel" : ""}" draggable="true" data-drag="${esc(p.file)}" aria-selected="${S.schedPick === p.file}"><span><b>${esc(surnameFirst(p))}</b> <span class="muted small">RČ: ${p.rc ? esc(p.rc) : DASH}</span><span class="muted small" style="display:block">${esc(p.diagnosis)}</span></span>
            <button class="btn small ${S.schedPick === p.file ? "primary" : ""}" data-pick="${esc(p.file)}">${S.schedPick === p.file ? "Vybráno" : p.slot ? "Přesunout" : "Naplánovat"}</button></div>`).join("") || `<span class="muted small">Všichni pacienti mají termín.</span>`}</div>
        </div>
        ${card}
      </div>
    </div>
  </div>`;
}

/* ---------- 3. Patient detail ---------- */
const R3 = i => (EXTRA.refs || [])[i];
/* v3 brief in the clinicians' own compact style, staging first (round 4); v2 keeps its own brief. */
const BRIEF_CS = EXTRA.onco_summary_v3_cs || EXTRA.onco_brief_v3_cs || EXTRA.onco_brief_cs;
const BRIEF_REFS = EXTRA.onco_summary_v3_refs || EXTRA.onco_brief_v3_refs || EXTRA.onco_brief_refs;
const DXH = () => EXTRA.diagnosis_headline || null;
/* Soňa: the first line is histology + grade + staging; the MKN code is for reporting and goes below. */
/* The TNM is the stage at diagnosis; every place that shows the headline says so, and keeps the OCR flag. */
function dxHeadlineText(forReport = false) {
  const d = DXH(); if (!d) return P(CASE.file).diagnosis;
  const base = [d.histology_cs, d.grade_cs, d.tnm_cs].filter(Boolean).join(", ");
  const txt = forReport ? edRep("dx", base, CASE.file) : edText("dx", base, CASE.file);
  return `${txt}${!forReport && edOf("dx", CASE.file) ? " (upraveno lékařem)" : ""}${d.tnm_context_cs ? `; ${d.tnm_context_cs}` : ""}${d.ocr_note_cs && !edOf("dx", CASE.file) ? " [ověřit čtení]" : ""}`;
}
function questionText(p) {
  const e = edOf("q", p.file);
  if (e) return e.text;
  return p.explicit ? p.question : `Výslovná otázka ${GAP_F}.`;
}
const briefPlain = () => edText("brief", (BRIEF_CS || "").replace(/\s*\[\d+\]/g, ""), CASE.file);
function patientHeader(p, extraActions = "", withQuestion = false) {
  return `<div class="card"><div class="phead">
      <div><div class="row"><span class="label">${p.id}</span>${statusChip(p)}</div>
        <h1 style="margin-top:4px">${esc(surnameFirst(p))}<span class="idp">RČ: ${p.rc ? esc(p.rc) : DASH}</span><span class="idp">Věk: ${ageNum(p) ? esc(ageNum(p)) : DASH}</span></h1>
        ${p.warn ? `<div class="question missing" style="margin:8px 0 0;padding:6px 10px"><b>Ověřit identitu:</b> ${esc(p.warn)}</div>` : ""}
        <div class="facts">
          <span>Vlastník: <b>${esc(p.owner)}</b></span><span>Pracoviště: <b>${esc(p.dept)}</b></span><span>Příští MDT: <b>${esc(slotText(p))}</b></span></div></div>
      <div class="row">${extraActions}</div>
    </div>
    ${withQuestion ? questionBox(p) : ""}
  </div>`;
}
/* The MDT question can be filled in by a doctor when the documents do not state one (Soňa, round 2). */
/* Reason (why now) and the question in one box (Soňa, round 7). */
function reasonQuestionBox(p, reg) {
  const e = edOf("q", p.file), filled = p.explicit || e;
  return `<div class="question ${filled ? "" : "missing"}"><span class="bh">Důvod a otázka pro MDT</span>
    ${EXTRA.mdt_reason_v3_cs ? `<p>${reasonHtml(reg)}</p>` : ""}
    <p style="margin-top:6px"><b>Otázka:</b> ${e ? `${esc(e.text)}<span class="edtag" title="Doplnil(a) ${esc(e.by)}, ${esc(e.when)}">doplněno lékařem</span>` : p.explicit ? esc(p.question) : DASH}
    ${isDoctor(S.user) ? `<button class="edbtn" style="opacity:1" data-edit="${esc(EK("q", p.file))}" data-orig="${esc(p.explicit ? p.question : "")}" title="${filled ? "Upravit otázku" : "Doplnit otázku"}">✎ ${filled ? "" : "doplnit"}</button>` : ""}</p></div>`;
}
/* Missing and unclear data: present but not shouting; a count on a toggle, details on demand (round 7). */
/* One count scheme for alerts everywhere (brief toggle, tab label, alerts tab): "k dotazu N · vše M", so the
   alerts for the MDT question read as a subset of all alerts. The brief's data gaps are a separate list
   (they overlap the alerts only in part), so they are counted under their own name, never added to "vše". */
const alertCount = () => { const { top, all } = topAlerts(); return { q: top.length, all: all.length }; };
const alertLabel = () => { const c = alertCount(); return `k dotazu ${c.q} · vše ${c.all}`; };
function gapsToggle() {
  const n = (EXTRA.data_gaps_v3 || []).length;
  return `<button class="btn small gapsbtn" data-act="gaps" aria-expanded="${!!S.gapsOpen}" style="border-color:var(--missing);color:var(--missing)">⚠ Upozornění ${alertLabel()}${n ? ` · chybějící údaje ${n}` : ""} ${S.gapsOpen ? "▴" : "▾"}</button>`;
}
function questionBox(p) {
  const e = edOf("q", p.file);
  const filled = p.explicit || e;
  return `<div class="question ${filled ? "" : "missing"}"><span class="label">Otázka pro MDT</span>
    <p>${e ? `${esc(e.text)}<span class="edtag" title="Doplnil(a) ${esc(e.by)}, ${esc(e.when)}">doplněno lékařem</span>` : p.explicit ? esc(p.question) : `<b>Výslovná otázka ${GAP_F}.</b> ${p.purpose ? `Účel dle dokumentu: „${esc(p.purpose)}“` : ""}`}
    ${isDoctor(S.user) ? `<button class="edbtn" data-edit="${esc(EK("q", p.file))}" data-orig="${esc(p.explicit ? p.question : "")}" title="${filled ? "Upravit otázku" : "Doplnit otázku"}">✎ ${filled ? "" : "doplnit"}</button>` : ""}</p></div>`;
}
function conclusionBox(p) {
  const dec = S.decisions.filter(d => d.pid === p.file);
  const last = dec[dec.length - 1];
  const pr = ensureProto(p), draftable = isDoctor(S.user) && pr.state !== "approved";
  /* The valid (approved) conclusion stays on top; a new draft that will supersede it sits below it, so a draft
     is never read as the decision. */
  return `<div class="concl ${last ? "valid" : ""}"><span class="bh">Závěr MDT</span>
    ${last ? `<p>${esc(last.text)}</p><div class="muted small">Platný závěr č. ${dec.length} · schválil(a) ${esc(last.by)}, ${esc(last.when)}</div>${dec.length > 1 ? `<details class="srcs"><summary>Předchozí závěry (${dec.length - 1})</summary><ul class="hist" style="margin-top:6px">${dec.slice(0, -1).reverse().map((x, i) => `<li class="old small"><b>Závěr č. ${dec.length - 1 - i}</b> · nahrazen · ${esc(x.when)} · ${esc(x.by)}<br>${esc(x.text)}${x.reportSnap ? `<details class="srcs"><summary>Schválený report</summary><div style="margin-top:6px">${x.reportSnap}</div></details>` : ""}</li>`).join("")}</ul></details>` : ""}`
      : draftable ? "" : `<p class="muted" style="font-size:14px">Zatím neprojednáno.</p>`}
    ${draftable ? `${last ? `<span class="label" style="display:block;margin-top:10px">Koncept nového závěru (nahradí platný až po schválení)</span>` : ""}<textarea class="input" id="concl" placeholder="Závěr a další postup, píše lékař (koncept, schvaluje se níže v části Projednání na MDT)" style="min-height:70px;margin-top:4px">${esc(pr.concl)}</textarea>${pr.concl.trim() ? `<p class="muted small" style="margin:4px 0 0">Koncept, zatím neschváleno. Schvaluje se níže v části Projednání na MDT.</p>` : ""}` : ""}</div>`;
}
function topAlerts() {
  const all = CASE.flags.map((f, i) => ({ ...f, i }));
  return { top: all.filter(f => f.relevant), all };
}
function briefHtml(reg) {
  if (edOf("brief")) return ed("brief", briefPlain());
  const html = linkProse(BRIEF_CS || "", BRIEF_REFS, reg).replace(/\n/g, "<br><br>");
  return ed("brief", (BRIEF_CS || "").replace(/\s*\[\d+\]/g, ""), { html });
}
const srcList = (reg, label = "Zdroje") => reg.list.length ? `<details class="srcs"><summary>${label} (${reg.list.length})</summary>${reg.html()}</details>` : "";
/* Overview order (Soňa, round 2): MDT brief, then the question, then the conclusion; details below. */
function reasonHtml(reg) {
  if (!EXTRA.mdt_reason_v3_cs) return "";
  const html = linkProse(EXTRA.mdt_reason_v3_cs, EXTRA.mdt_reason_v3_refs, reg);
  return ed("reason", EXTRA.mdt_reason_v3_cs.replace(/\s*\[\d+\]/g, ""), { html: edOf("reason") ? null : html });
}
function proposalBox(p) {
  const e = edOf("proposal", p.file);
  return `<div class="concl"><span class="bh">Navrhovaný další postup</span>
    <p style="font-size:14px">${e ? `${esc(e.text)}<span class="edtag" title="Zapsal(a) ${esc(e.by)}, ${esc(e.when)}">návrh lékaře, ne rozhodnutí MDT</span>` : `${DASH} <span class="muted small">Co dál navrhuje odesílající lékař k rozhodnutí na tomto MDT; asistent postup nenavrhuje.</span>`}
    ${isDoctor(S.user) ? `<button class="edbtn" style="opacity:1" data-edit="${esc(EK("proposal", p.file))}" data-orig="">✎ ${e ? "" : "doplnit"}</button>` : ""}</p>
    </div>`;
}
const fieldOf = st => GL(st.guideline_id).field || "oncology";
/* Compact line per statement (round 10): quote, short source, a link; the full citation and the reason sit in the viewer. */
const shortCite = st => { const g = GL(st.guideline_id); return `${(g.society || "").replace(/\s*\(.*?\)/g, "")} ${g.year || ""}, ${st.pdf_page ? "s. " + (st.printed_page || st.pdf_page) : "abstrakt"}`; };
/* A quote is never cut: a shortened guideline sentence can say the opposite (review of the layer). */
const typeChip = x => x.type === "guideline_text" ? `<span class="chip plain st-new">text kapitoly, bez stupně</span>` : `<span class="chip plain st-ready">${esc(x.evidence_cs || "doporučení")}</span>`;
function stmtHtml(x) {
  return `<li>${x.section ? `<span class="cite">${esc(String(x.section).split(/[;:]/).slice(-1)[0].trim())}</span>` : ""}<q>${esc(x.quote)}</q> ${typeChip(x)}
    <span class="cite">${esc(shortCite(x))} · <button class="linkbtn small" data-guide="${esc(x.id)}" title="${esc(citeOf(x))}">otevřít</button></span>
    <span class="cite">Vztah k pacientovi: ${esc(x.applies_because_cs || "")}</span></li>`;

function guideBox() {
  const head = `<div class="row spread"><span class="label">Citace z doporučených postupů a literatura · pozorování asistenta, pořadí neznamená preferenci</span>
    <label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-act-toggle="guide" ${S.guideOn ? "checked" : ""}> vrstva doporučení</label></div>`;
  if (!S.guideOn) return `<div class="gl">${head}<p class="muted small" style="margin:6px 0 0">Vypnuto.</p></div>`;
  if (GUIDE.loading) return `<div class="gl">${head}<p class="muted small" style="margin:6px 0 0">Načítám doporučení ze serveru…</p></div>`;
  const st = STMTS();
  if (!st.length && !(GUIDE.literature || []).length) return "";
  const onc = st.filter(x => /oncology/.test(fieldOf(x)));

function labChart(t, draws) {
  const pts = t.values.map((v, i) => [i, num(v)]).filter(x => x[1] != null);
  if (pts.length < 2) return `<p class="muted small">Pro graf jsou potřeba alespoň dvě hodnoty.</p>`;
  const rg = rangeOf(t.reference_range);
  const vals = pts.map(x => x[1]).concat(rg || []);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .15 || 1; lo -= pad; hi += pad;
  const W = 640, H = 220, L = 46, Rr = 16, T = 14, B = 34;
  const x = i => L + (W - L - Rr) * (draws.length === 1 ? .5 : i / (draws.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const band = rg ? `<rect x="${L}" y="${y(rg[1])}" width="${W - L - Rr}" height="${Math.max(0, y(rg[0]) - y(rg[1]))}" fill="var(--ok-soft)"/><text x="${W - Rr}" y="${y(rg[1]) - 4}" text-anchor="end" font-size="11" fill="var(--ok)">ref. ${esc(t.reference_range)}</text>` : "";
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad].map(v => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${(+v.toFixed(2)).toLocaleString("cs-CZ")}</text><line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join("");
  const xl = draws.map((d, i) => `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(fmtDate(d.datetime.slice(0, 10)))}</text>`).join("");
  const path = pts.map((p, k) => `${k ? "L" : "M"}${x(p[0])},${y(p[1])}`).join(" ");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Syntetická data, vývoj ${esc(t.name_cs)}"><text x="${L + 6}" y="${T + 12}" font-size="12" font-weight="700" fill="var(--missing)">syntetická data, ne z dokumentace</text>${band}${ticks}${xl}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg>`;
}

      if (on.some(x => x.k === "vm")) piece = `<span class="vm" title="Poznámka přepisu, není tištěný text">${piece}</span>`;

  const engine = d.engine === "vision" ? "Přepis: jazykový model, kontrola: Tesseract" : "Přepis: Tesseract";

  const body = red

    : tab === "text"
    ? `${empty}${d.empty ? "" : pageTextHtml(d)}${nv ? `<p class="muted small" style="margin:14px 0 0">${legend}</p>` : ""}`

/* Zoom: "fit" follows the drawer width; a number is a percentage of the page image's native size. */
const ZOOM_STEPS = [25, 50, 75, 100, 125, 150, 200, 300, 400];
function currentZoomPct(o) {
  if (typeof o.zoom === "number") return o.zoom;
  // At fit width the effective percentage depends on the drawer, so read it from the rendered image.
  const img = document.querySelector("#vbody .pgimg img");
  return img && img.naturalWidth ? Math.round(img.clientWidth / img.naturalWidth * 100) : 100;
}
function zoomStep(o, dir) {
  const cur = currentZoomPct(o);
  const next = dir > 0 ? ZOOM_STEPS.find(z => z > cur + 1) : [...ZOOM_STEPS].reverse().find(z => z < cur - 1);
  if (next) { o.zoom = next; renderOverlay(); }
}
function zoomCtl(o) {
  const fit = typeof o.zoom !== "number";
  return `<div class="zoomctl" role="group" aria-label="Zvětšení stránky">
    <button data-zoomstep="-1" title="Oddálit (−)" aria-label="Oddálit" ${!fit && o.zoom <= ZOOM_STEPS[0] ? "disabled" : ""}>−</button>
    <span class="zlvl" aria-live="polite">${fit ? "Na šířku" : `${o.zoom} %`}</span>
    <button data-zoomstep="1" title="Přiblížit (+)" aria-label="Přiblížit" ${!fit && o.zoom >= ZOOM_STEPS.at(-1) ? "disabled" : ""}>+</button>
    <button data-zoom="fit" title="Obnovit: na šířku (0)" aria-label="Obnovit zvětšení" ${fit ? "disabled" : ""}>⟲</button>
  </div>`;
}

/* ---------- render and events ---------- */
function render() {
  const bar = document.querySelector(".tlbar"); if (bar) S.tlScroll = bar.scrollLeft;
  renderNav();
  const v = { patients: viewPatients, calendar: viewCalendar, patient: viewPatient, tasks: viewTasks, admin: viewAdmin }[S.view];
  document.getElementById("app").innerHTML = v();
  const nb = document.querySelector(".tlbar"); if (nb) nb.scrollLeft = S.tlScroll || 0;
  measureTop();
  /* The current case's pill is scrolled into the middle of the agenda, so it is visible on narrow screens. */
  const ag = document.querySelector(".sesbar .agenda"), cur = ag?.querySelector('[aria-current="true"]');
  if (cur) ag.scrollLeft = cur.offsetLeft - ag.offsetLeft - (ag.clientWidth - cur.offsetWidth) / 2;
  renderOverlay();

}
/* The session bar sticks under the top bar, whose height changes when it wraps on narrow screens. */
function measureTop() { const t = document.querySelector(".top"); if (t) document.documentElement.style.setProperty("--toph", t.offsetHeight + "px"); }
window.addEventListener("resize", measureTop);
/* Hash-based history so the browser's back and forward buttons work inside the single-file mock (round 2). */
const hashOf = () => "#" + [S.view, S.view === "patient" ? nr(S.pid) : S.view === "calendar" ? S.week : "", S.view === "patient" ? S.tab : ""].filter(Boolean).join("/");
function writeHash() { const h = hashOf(); if (location.hash !== h) { S.hashSet = h; location.hash = h; } }
function readHash() {
  let [view, id, tab] = location.hash.slice(1).split("/");
  /* #present/<id> and #protocol/<id> links open the patient view, which holds the case and its MDT discussion. */
  const legacy = view === "present" || view === "protocol";
  if (legacy) { view = "patient"; tab = "overview"; }
  if (!view || !{ patients: 1, calendar: 1, patient: 1, tasks: 1, admin: 1 }[view]) return false;
  const before = S.pid + S.view;
  S.view = view;
  if (view === "calendar" && /^\d{4}-\d\d-\d\d$/.test(id || "")) { S.week = mondayOf(id); S.miniMonth = id.slice(0, 7); }
  else if (id) { const f = S.patients.find(p => nr(p.file) === id)?.file; if (f && f !== S.pid) { S.pid = f; S.selTl = null; S.tlScroll = 0; } }
  /* Opening a case by link or by back/forward is an access too and goes to the log. */
  if (view === "patient" && before !== S.pid + view) logAccess(S.pid, "otevřel(a) případ (odkazem nebo historií prohlížeče)");
  if (tab) S.tab = tab;
  S.overlay = null; S.colOpen = null;
  if (legacy) history.replaceState(null, "", hashOf());
  return true;
}
/* hashSet marks the one hashchange event that our own writeHash caused; it is cleared on first use so later back/forward to the same hash still works. */
window.addEventListener("hashchange", () => { if (S.hashSet && location.hash === S.hashSet) { S.hashSet = null; return; } S.hashSet = null; if (readHash()) render(); });
/* keepTab: moving between cases during an MDT keeps the tab the team is looking at. */
function openPatient(file, keepTab = false, what = "otevřel(a) případ") {
  S.pid = file; S.view = "patient"; if (!keepTab) S.tab = "overview"; S.selTl = null; S.calPop = null; S.tlScroll = 0;
  logAccess(file, what);
  render(); window.scrollTo(0, 0);
}

/* A page image that fails to load says so, instead of leaving an empty frame. */

  img.replaceWith(Object.assign(document.createElement("p"), { className: "synth", textContent: "Obrázek stránky se nepodařilo načíst. Přepis je v záložce „Přepis stránky“." }));

/* Tooltips for info and certainty icons: the title moves to data-tip so the browser does not show a second one. */
const TIP_SEL = ".info, .mk, .edtag, .gapq, .chip[title], .chip[data-tip], .vf, .vbox";
let tipEl = null;
function showTip(el) {
  if (el.title) { el.dataset.tip = el.title; el.removeAttribute("title"); }
  if (!el.dataset.tip) return;
  hideTip(); tipEl = document.createElement("div"); tipEl.className = "tip"; tipEl.textContent = el.dataset.tip; document.body.appendChild(tipEl);
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
  const top = r.bottom + 6 + h > window.innerHeight ? r.top - h - 6 : r.bottom + 6;
  tipEl.style.left = left + "px"; tipEl.style.top = top + "px"; tipEl.dataset.for = el.dataset.tip;
}
function hideTip() { if (tipEl) { tipEl.remove(); tipEl = null; } }
document.addEventListener("mouseover", e => { const el = e.target.closest(TIP_SEL); if (el) showTip(el); });
document.addEventListener("mouseout", e => { const el = e.target.closest(TIP_SEL); if (el && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest(TIP_SEL); if (el) showTip(el); });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, true);
document.addEventListener("click", e => {
  if (S.resizedAt && Date.now() - S.resizedAt < 300) { e.stopPropagation(); return; }
  const mk = e.target.closest(TIP_SEL);
  if (mk && !mk.closest("[data-src],[data-edit],[data-act],[data-tab],[data-open]")) { e.preventDefault(); showTip(mk); return; }
  hideTip();
  if (S.colOpen && !e.target.closest(".fpop,[data-colopen]")) { S.colOpen = null; render(); return; }
  const t = e.target.closest("[data-dbpage],[data-guide],[data-colopen],[data-colclose],[data-colall],[data-wk],[data-jump],[data-mm],[data-calclose],[data-labmode],[data-labsel],[data-edit],[data-scope],[data-addatt],[data-startday],[data-startgo],[data-sesgo],[data-nav],[data-open],[data-tab],[data-src],[data-close],[data-page],[data-vtab],[data-zoom],[data-zoomstep],[data-zoomhit],[data-tl],[data-ack],[data-sched],[data-pick],[data-free],[data-slot],[data-unsched],[data-act],[data-mode],[data-delstep],[data-done]");
  if (!t) return;
  const d = t.dataset;
  if (d.colopen) { S.colOpen = S.colOpen === d.colopen ? null : d.colopen; render(); }
