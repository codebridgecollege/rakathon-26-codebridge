<title>MDT Workspace v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Mock v3: v2 plus Soňa's second feedback round (docs/design/PRODUCT.md, "Feedback round 2").
   Soňa's brief: a GLIDE-inspired clinical workspace in a white version only.
   Light ground, dark type, fine dividing lines, minimal shadow; colour only where it carries meaning.
   Layout: a top bar with the three main areas (patients, calendar, tasks); each screen is a full-width working page. */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --sunk: #f0f2ef;
  --fg: #1c2726;
  --muted: #5b6866;
  --faint: #8a9593;
  --line: #e1e4e0;
  --line-strong: #cdd3cf;
  --accent: #3d7a6f;
  --accent-ink: #2c5c53;
  --accent-soft: #e3ece8;
  --missing: #8f5a06; --missing-soft: #fbf0dc;
  --conflict: #a8323f; --conflict-soft: #fbe6e8;
  --change: #2b5aa8; --change-soft: #e5ecf8;
  --unclear: #6a5b8a; --unclear-soft: #eeeaf5;
  --ok: #2d7650; --ok-soft: #e1f1e7;
  --mark: #fff0a8;
  --font-head: "Manrope", "DM Sans", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14.5px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-head); letter-spacing: -.005em; text-wrap: balance; }
h1 { font-size: 22px; margin: 0; line-height: 1.25; }
h2 { font-size: 16px; margin: 0; }
h3 { font-size: 14px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 800 15px/1 var(--font-head); display: flex; align-items: center; gap: 8px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav button:hover { background: var(--sunk); }
.nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.nav .count { font-size: 11px; background: var(--accent); color: #fff; border-radius: 99px; padding: 0 6px; margin-left: 4px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.who select { border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 6px; background: var(--surface); }
.demo { font-size: 11.5px; font-weight: 600; color: var(--missing); background: var(--missing-soft); border-radius: 99px; padding: 2px 8px; }

.page { padding-block: 22px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card > .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { justify-content: space-between; }

.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 7px 13px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.st-new { background: var(--sunk); color: var(--muted); }
.st-scheduled { background: var(--change-soft); color: var(--change); }
.st-attention { background: var(--missing-soft); color: var(--missing); }
.st-ready { background: var(--ok-soft); color: var(--ok); }
.st-done { background: var(--accent-soft); color: var(--accent-ink); }
.k-missing { background: var(--missing-soft); color: var(--missing); }
.k-contradiction { background: var(--conflict-soft); color: var(--conflict); }
.k-change { background: var(--change-soft); color: var(--change); }
.k-unclear { background: var(--unclear-soft); color: var(--unclear); }

/* Toolbar and tables */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.search { flex: 1 1 220px; max-width: 340px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 10px; background: var(--surface); }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.filter[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
select.input, input.input, textarea.input { border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; background: var(--surface); width: 100%; }
textarea.input { min-height: 96px; resize: vertical; }
.scroll { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--sunk); }
.tbl .id { font-weight: 700; font-variant-numeric: tabular-nums; }
.ex { font-size: 10.5px; color: var(--faint); margin-left: 3px; vertical-align: super; }

/* Calendar */
.calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.cal { display: grid; grid-template-columns: 56px repeat(5, minmax(120px, 1fr)); min-width: 720px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.cal .dh { padding: 8px 10px; border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.cal .dh small { display: block; color: var(--muted); font-weight: 500; }
.cal .dh .startmdt { margin-top: 6px; }
/* Selected patient (round 17): the chosen slot and list row stand out, so the user sees what the card and actions refer to. */
.slotbtn.taken[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft, #e3efec); box-shadow: 0 0 0 2px var(--accent) inset; font-weight: 700; }
.dragrow.sel { border-color: var(--accent); background: var(--accent-soft, #e3efec); box-shadow: 0 0 0 1px var(--accent) inset; }
.minicard .row .btn { padding: 4px 10px; font-size: 13px; }
.cal .tm { font-size: 11.5px; color: var(--faint); padding: 0 6px; text-align: right; border-top: 1px solid var(--line); height: 34px; line-height: 34px; font-variant-numeric: tabular-nums; }
.cal .cell { border-top: 1px solid var(--line); border-left: 1px solid var(--line); height: 34px; padding: 2px 4px; position: relative; }
.cal .cell { background: #eceeeb; }
.cal .cell.sem { background: var(--surface); }
.slotbtn { width: 100%; height: 100%; border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer; font-size: 12.5px; text-align: left; padding: 0 6px; display: flex; align-items: center; gap: 6px; }
.slotbtn.free { color: var(--faint); }
.slotbtn.drop { border-color: var(--accent); background: var(--accent-soft, #e3efec); color: var(--accent-ink); }
.slotbtn.taken[draggable="true"], [data-drag] { cursor: grab; }
.dragrow { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.dragrow:hover { border-color: var(--line-strong); }
.dragrow { flex-wrap: nowrap; min-width: 0; max-width: 100%; }
.tasklist { min-width: 0; }
.tasklist > * { min-width: 0; }
.dragrow > span:first-child { min-width: 0; flex: 1; }
.dragrow > span:first-child > span[style*="block"] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dragrow.dragging { opacity: .5; }
.tbl th { position: relative; }
.colrs { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 1; touch-action: none; }
.colrs:hover, .colrs.on { background: linear-gradient(var(--accent), var(--accent)) center / 2px 100% no-repeat; }
.slotbtn.free:hover, .slotbtn.target { border-color: var(--accent); color: var(--accent-ink); background: #fff; }
.slotbtn.taken { background: var(--surface); border-color: var(--line-strong); font-weight: 700; }
.slotbtn.taken .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.popover { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 14px 16px; box-shadow: 0 6px 24px rgba(28,39,38,.08); }

/* Patient header */
.phead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: start; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.facts b { color: var(--fg); font-weight: 600; }
.question { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r) var(--r) 0; padding: 10px 14px; }
.question.missing { border-left-color: var(--missing); background: var(--missing-soft); }
.question p { margin: 2px 0 0; font-size: 15.5px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 9px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.tab .n { font-size: 11px; background: var(--sunk); border-radius: 99px; padding: 0 6px; margin-left: 4px; }

/* Summary with paper-style references */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 99px; padding: 2px; background: var(--sunk); }
.seg button { border: 0; background: none; border-radius: 99px; padding: 3px 12px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.prose { font-size: 15px; line-height: 1.65; max-width: 78ch; margin: 0; }
.ref { margin-top: -2px; transform: translateY(4px); font-size: 11px; vertical-align: super; line-height: 1; min-width: 18px; min-height: 18px; background: none; border: 0; padding: 0 1px; color: var(--accent-ink); cursor: pointer; font-weight: 700; }
.ref:hover { text-decoration: underline; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14.5px; max-width: 86ch; }
.dl dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.dl dd { margin: 0; }
.refs { margin: 12px 0 0; padding: 10px 0 0 22px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }
.refs li { padding-left: 2px; }
.refs button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; }
.refs button:hover { color: var(--accent-ink); text-decoration: underline; }
details.more > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.disclaim { font-size: 12px; color: var(--faint); margin-top: 8px; }

/* Alerts strip */
.alerts { display: grid; gap: 6px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 6px; background: var(--sunk); }
.alert.ack { opacity: .55; }
.alert .why { display: block; color: var(--muted); font-size: 12.5px; }

/* Horizontal labelled timeline */
.tlbar { position: relative; overflow-x: auto; padding: 6px 2px 4px; }
.tltrack { position: relative; display: flex; align-items: flex-start; gap: 0; min-width: max-content; padding: 0 8px; }
.tltrack::before { content: ""; position: absolute; left: 0; right: 0; top: 39px; height: 2px; background: var(--line-strong); }
.tlyear { position: relative; min-width: 56px; padding-inline: 4px; flex: none; text-align: center; padding-top: 30px; }
.tlyear span { position: relative; display: inline-block; font: 700 12px/1 var(--font-head); color: var(--muted); background: var(--surface); padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 99px; }
.ev { position: relative; flex: none; width: 196px; padding: 0 8px; background: none; border: 0; text-align: left; cursor: pointer; }
.ev .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; height: 18px; display: block; white-space: nowrap; }
.ev .pin { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid currentColor; margin: 4px 0 8px; }
.ev .pin svg { width: 15px; height: 15px; }
.ev.planned .pin { border-style: dashed; }
.ev .t { display: block; font-weight: 700; font-size: 13.5px; line-height: 1.3; color: var(--fg); }
.ev .d { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.ev[aria-pressed="true"] .pin { box-shadow: 0 0 0 4px var(--accent-soft); }
.ev[aria-pressed="true"] .t { color: var(--accent-ink); }
.evdetail { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.kind-diagnosis { color: #7a3f8f; } .kind-imaging { color: #2b5aa8; } .kind-surgery { color: #8f5a06; }
.kind-pathology { color: #a8323f; } .kind-systemic { color: #2d7650; } .kind-radiotherapy { color: #b5521b; }
.kind-mdt { color: #3d7a6f; } .kind-visit { color: #5b6866; }

/* Anamnesis and documents */
.anam { display: grid; grid-template-columns: 220px minmax(0, 1fr); border-top: 1px solid var(--line); }
.anam > div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.anam > div:nth-child(odd) { font-weight: 600; padding-right: 12px; }
.anam ul { margin: 0; padding-left: 18px; }
.gap { color: var(--faint); font-style: italic; }
.tag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; margin-left: 4px; white-space: nowrap; }
.tag.neg { background: var(--sunk); color: var(--fg); border: 1px solid var(--line-strong); }
.tag.obs { background: var(--unclear-soft); color: var(--unclear); }
.tag.ocr { background: var(--missing-soft); color: var(--missing); }
.note { display: block; color: var(--muted); font-size: 12.5px; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.pipeline li { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pipeline li.wait { background: var(--sunk); color: var(--muted); }
.pipeline li.run { background: var(--change-soft); color: var(--change); }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); background: var(--sunk); }

/* Findings (presentation) */
.find { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.find + .find { margin-top: 8px; }
.find > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.find > summary::-webkit-details-marker { display: none; }
.find > summary::before { content: "›"; font-size: 18px; color: var(--muted); transition: transform .15s; width: 10px; }
.find[open] > summary::before { transform: rotate(90deg); }
.find .ttl { font: 700 15px/1.3 var(--font-head); }
.find .cnt { color: var(--muted); font-size: 12.5px; }
.find .pick { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.find ul { margin: 0; padding: 0 16px 14px 36px; display: grid; gap: 6px; }
.find li .dt { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }

.present { background: var(--surface); }
.present .page { max-width: 1400px; }
.present .prose { font-size: 17px; }
.present .question p { font-size: 18px; }
.agenda { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; min-width: 0; flex: 1 1 320px; }
.agenda button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.agenda button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }

/* Protocol */
.att { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.att .dept { font-weight: 600; font-size: 13.5px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 3px; }
.seg2 button { border: 0; background: none; border-radius: 6px; padding: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.rec { text-align: center; padding: 18px 10px; display: grid; gap: 6px; justify-items: center; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.steps .s { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.steps .s.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.task { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 150px auto; gap: 8px; align-items: center; }
.tasklist { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.trow input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.trow.done .tt { text-decoration: line-through; color: var(--muted); }
.mail { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 12px 14px; background: var(--surface); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hist li { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.hist li.old { opacity: .6; }

/* Report sheet */
.sheet { background: #fff; color: #111; max-width: 760px; margin: 0 auto; padding: 40px 46px; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.06); font-size: 13px; line-height: 1.5; }
.sheet h4 { font: 700 12px/1.3 var(--font-head); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 6px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
.sheet p, .sheet li { margin: 2px 0; }
.sheet .hdr { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #111; padding-bottom: 10px; }
.sheet .src { color: #666; font-size: 11px; }

/* Source drawer */
.scrim { position: fixed; inset: 0; background: rgba(28,39,38,.25); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 31; box-shadow: -8px 0 30px rgba(0,0,0,.12); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { padding: 16px 20px 8px; display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.drawer .pages { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 20px 10px; border-bottom: 1px solid var(--line); }
.drawer .pages button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: 12.5px; }

/* =====================================================================================

  /* Fictional staff, configured per department (Soňa's attendance design). */

    ["Klinická onkologie", ["MUDr. Svobodová", "MUDr. Malá"]],

    ["Patologie", ["MUDr. Králová", "MUDr. Němcová"]],

  const ADMIN = "Ing. Kovář (správce systému)";

      /* Database format (Soňa, round 3): histology and TNM; the second line says the TNM is from diagnosis and why the case is here now. */

  const citeOf = st => { const g = (GUIDANCE.guidelines || []).find(x => x.id === st.guideline_id) || {}; return `${g.name || ""}, ${g.society || ""} ${g.year || ""}${g.version ? ", " + g.version : ""}; ${st.section || ""}; ${st.pdf_page ? "s. " + (st.printed_page || st.pdf_page) : "abstrakt"}`; };
  const devRows = dev => (GUIDANCE.statements || []).filter(st => dev[st.id]?.s).map(st => ({ id: st.id, quote: st.quote, cite: citeOf(st), s: dev[st.id].s, why: dev[st.id].why }));
  route("POST", "/api/patients/:id/decisions", ({ params, body, user }) => {
    const p = byRid(params.id), pr = proto(p.file);
    if (pr.state === "approved") fail(409, "Závěr je už schválen; nejdřív založte nový závěr.");
    mustDoctor(user);
    if (body.version !== pr.version) fail(409, "Protokol se mezitím změnil; zkontrolujte ho a schvalte znovu.");
    const text = String(body?.text ?? "").trim();
    if (!text) fail(422, "Chybí text závěru.");
    const steps = (Array.isArray(body.steps) ? body.steps : []).map(s => ({ text: String(s.text || "").trim(), who: String(s.who || COORD), due: String(s.due || "") })).filter(s => s.text);
    const present = presentOn(attDay(p));
    if (!present.includes(user)) fail(403, "Závěr schvaluje lékař označený jako přítomný.");
    const when = clock();
    const snap = {
      patient: pub(p), present, concl: text, steps, approver: user, when,
      edits: structuredClone(db.edits[p.file] || {}),
      picked: (Array.isArray(body.picked) ? body.picked : []).filter(k => REPORT_FIELDS.includes(k)),
      dev: cleanDev(body.dev),
      /* Whether the deviations section was in the report the doctor approved (the guideline layer was on). */
      guide_on: body.guide_on !== false && !!p.full && (GUIDANCE.statements || []).length > 0,
    };
    snap.dev_rows = devRows(snap.dev);
    Object.assign(pr, { concl: text, steps, dev: snap.dev, state: "approved", approver: user, when, attSnap: present, snap, version: pr.version + 1 });
    p.status = "done"; p.updated = TODAY;
    const dec = { pid: p.file, n: db.decisions.filter(d => d.pid === p.file).length + 1, text, by: user, when, attSnap: present, snap };
    db.decisions.push(dec);
    let id = Math.max(0, ...db.tasks.map(x => x.id));
    steps.forEach(s => db.tasks.push({ id: ++id, pid: p.file, text: s.text, who: s.who, due: s.due, done: false }));
    /* The e-mail carries only the case ID, the count and a link, never medical data. */
    if (steps.length) db.mails.unshift({ pid: p.file, id: p.id, n: steps.length, to: COORD });
    audit(user, p.file, "schválil(a) závěr MDT");
    return { decision: dec, protocol: pr, tasks_created: steps.length };
  });
  route("GET", "/api/seminars/:day/attendance", ({ params }) => attendance(params.day));
  route("PUT", "/api/seminars/:day/attendance", ({ params, body, user }) => {
    const next = {};
    for (const [d, docs] of DEPTS) {
      const list = Array.isArray(body?.[d]) ? body[d].map(String) : [""];
      if (list.some(x => x && !docs.includes(x))) fail(422, `Neznámý lékař v oddělení ${d}`);
      next[d] = list.length ? list : [""];
    }
    db.attendance[params.day] = next;
    audit(user, null, `upravil(a) přítomnost na semináři ${params.day}`);
    return next;
  });
  /* Tasks: ?assignee= gives the tasks assigned to that person; &owner= adds the tasks on cases they own. */
  route("GET", "/api/tasks", ({ query }) => {
    const a = query.get("assignee"), o = query.get("owner");
    return db.tasks.filter(t => (!a && !o) || t.who === a || (o && byFile(t.pid)?.owner === o)).map(t => ({ ...t, case_id: byFile(t.pid)?.id || t.pid }));
  });
  route("PATCH", "/api/tasks/:id", ({ params, body, user }) => {
    const t = db.tasks.find(x => x.id === +params.id) || fail(404, "Úloha nenalezena");
    if (typeof body?.done === "boolean") t.done = body.done;
    audit(user, t.pid, `označil(a) úlohu jako ${t.done ? "hotovou" : "nehotovou"}`);
    return { ...t, case_id: byFile(t.pid)?.id || t.pid };
  });
  route("GET", "/api/mails", () => db.mails);
  /* Doctors' edits across all cases, for the administrator (round 4: the edit log moved to Administrace). */
  route("GET", "/api/edits", ({ user }) => roleOf(user) === "admin"
    ? Object.entries(db.editLog).flatMap(([pid, log]) => log.map(e => ({ ...e, pid, case_id: byFile(pid)?.id || pid })))
    : fail(403, "Záznam úprav vidí jen správce systému."));
  route("GET", "/api/audit", ({ user }) => roleOf(user) === "admin" ? db.audit : fail(403, "Záznam přístupů vidí jen správce systému."));
  route("GET", "/api/documents/:file", ({ params }) => {
    const doc = PAGES[params.file] || fail(404, "Dokument nenalezen");
    return { file: params.file, case_id: byFile(params.file)?.id || null, pages: doc.pages.map(p => ({ n: p.n, empty: /^\s*\[prázdná stránka\]\s*$/.test(p.text) })) };
  });
  const pageOf = params => {
    const doc = PAGES[params.file] || fail(404, "Dokument nenalezen");
    return [doc, doc.pages.find(p => p.n === +params.n) || fail(404, "Strana nenalezena")];
  };
  /* Where a quote sits on the page image (word boxes) and in the vision text (character range). The quote
     travels in the request body, not the URL: quotes can contain names, and URLs end up in logs. */
  route("POST", "/api/documents/:file/pages/:n/locate", ({ params, body }) => {
    const [, pg] = pageOf(params), quote = String(body?.quote || "");
    if (!quote) fail(422, "Chybí citace.");
    return { image: matchImage(quote, pg.words), text: matchText(quote, pg.text) };
  });
  /* One page for the source view: the image, the vision text, Tesseract's words and the "ověřit" items. */
  route("GET", "/api/documents/:file/pages/:n", ({ params, user }) => {
    const [doc, pg] = pageOf(params);
    const owner = byFile(params.file);
    audit(user, owner ? owner.file : null, `zobrazil(a) zdroj s. ${pg.n}`);
    return {
      file: params.file, n: pg.n, of: doc.pages.length, doc_title: docTitle(params.file, pg.n),
      image: pg.image, size: pg.size, text: pg.text, engine: pg.engine,
      empty: /^\s*\[prázdná stránka\]\s*$/.test(pg.text),
      mean_conf: pg.mean_conf, low_conf_words: pg.low_conf_words,
      words: pg.words, verify: verifyOf(pg),
      /* Local redaction demo (DATA-PROTECTION.md, option B): the image that would go to a cloud model. */
      redacted: pg.redacted || null,
    };
  });

  function dispatch(method, url, body, headers) {
    const [path, qs = ""] = url.split("?");
    const parts = path.split("/");
    for (const r of routes) {
      if (r.method !== method || r.parts.length !== parts.length) continue;
      const params = {};
      const hit = r.parts.every((seg, i) => seg.startsWith(":") ? ((params[seg.slice(1)] = decodeURIComponent(parts[i])), true) : seg === parts[i]);
      if (!hit) continue;
      const user = headers["X-User"] || null;
      if (path !== "/api/config" && !roleOf(user)) fail(401, "Neznámý uživatel (hlavička X-User)");
      return r.fn({ params, query: new URLSearchParams(qs), body: body || {}, headers, user });
    }
    fail(404, `Neznámá cesta ${method} ${path}`);
  }
  /* Every call resolves asynchronously, as a network call would. With ?latency=<ms> in the page URL each request
     waits a random 0 to <ms> milliseconds before the server handles it, so requests can overtake each other as
     over a real network; the test uses it to check the client copes. */
  const LATENCY = Math.max(0, +new URLSearchParams(location.search).get("latency") || 0);
  const later = fn => LATENCY ? setTimeout(fn, Math.random() * LATENCY) : queueMicrotask(fn);
  /* The body is copied when the request is made, as fetch() serializes it then; later changes do not travel. */
  const call = (method, path, body, headers = {}) => { const sent = body === undefined ? undefined : structuredClone(body); return new Promise((resolve, reject) => later(() => {
    try { resolve(structuredClone(dispatch(method, path, sent, { ...headers }) ?? null)); }
    catch (err) {
      if (err && err.status) reject({ status: err.status, error: err.error });
      else { console.error(err); reject({ status: 500, error: String(err?.message || err) }); }
    }
  })); };
  return {
    get: (path, headers) => call("GET", path, undefined, headers),
    post: (path, body, headers) => call("POST", path, body, headers),
    put: (path, body, headers) => call("PUT", path, body, headers),
    patch: (path, body, headers) => call("PATCH", path, body, headers),
    del: (path, headers) => call("DELETE", path, undefined, headers),
  };
})();
</script>

<script>
"use strict";
/* =====================================================================================
   CLIENT: screens, UI state and a cache of server responses.

   The client never reads the embedded JSON or the server's records. Each screen change runs
   load(), which awaits the api calls the screen needs and keeps the responses in C; render()
   then draws synchronously from C. A change goes to the server (post, put, patch, del), the
   cache is dropped, and the screen loads and renders again.

   To move to a real backend, replace the `api` object of the server block with fetch() calls
   to the same routes, for example:
     const api = {
       get: (p, h) => fetch(p, { headers: h }).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject({ status: r.status, ...e }))),
       post: (p, b, h) => fetch(p, { method: "POST", headers: { "Content-Type": "application/json", ...h }, body: JSON.stringify(b) }).then(...),
       ...
     };
   and send a session token instead of the X-User header. Nothing below needs to change.
   ===================================================================================== */
/* The template has no <html> tag of its own (the publisher wraps it), so the language is set here: Czech date
   inputs and screen readers read the page as Czech. */
document.documentElement.lang = "cs";
/* Guideline layer (F-27, team decision 2026-10-16): verbatim statements with full citation; never invented.
   GUIDE is the cached GET /api/patients/:id/guidance response of the case on screen, bound in load(). */
let GUIDE = {};
const GL = id => (GUIDE.guidelines || []).find(g => g.id === id) || {};
const STMTS = () => GUIDE.statements || [];
const PAST = () => GUIDE.past_statements || [];
const anyStmt = id => STMTS().find(x => x.id === id) || PAST().find(x => x.id === id);
const citeOf = st => { const g = GL(st.guideline_id); return `${g.name || ""}, ${g.society || ""} ${g.year || ""}${g.version ? ", " + g.version : ""}; ${st.section || ""}; ${st.pdf_page ? "s. " + (st.printed_page || st.pdf_page) : "abstrakt"}`; };

const GAP = "neuvedeno v dostupné dokumentaci";
const GAP_F = "neuvedena v dostupné dokumentaci";
/* A missing value shows as "-" (team decision, round 14); the fixed wording stays in the tooltip. */
const DASH = `<span class="gapq" title="neuvedeno v dostupné dokumentaci">-</span>`;
/* Certainty labels used everywhere a fact is shown: a recorded negative, a value the OCR may have misread, an assistant inference. */
const tags = f => (f.negated ? '<span class="tag neg">zápor v dokumentu</span>' : "")
  + (f.certainty === "unclear_ocr" ? '<span class="tag ocr">ověřit čtení</span>' : "")
  + (f.certainty === "inferred" ? '<span class="tag obs">pozorování asistenta</span>' : "");
const tagsText = f => (f.negated ? " [zápor v dokumentu]" : "") + (f.certainty === "unclear_ocr" ? " [ověřit čtení]" : "") + (f.certainty === "inferred" ? " [pozorování asistenta]" : "");
const plural = (n, one, few, many) => `${n} ${n === 1 ? one : n >= 2 && n <= 4 ? few : many}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = iso => { if (!iso) return GAP; const [y, m, d] = iso.split("-"); return `${+d}. ${+m}. ${y}`; };

/* Staff, roles and the seminar schedule are server data (GET /api/config), set once at start-up. */
let DEPTS = [], COORD = "", ADMIN = "", USERS = [], ROLES = {};
const STATUS = {
  new: ["Nový", "st-new"], scheduled: ["Naplánován", "st-scheduled"], attention: ["Vyžaduje pozornost", "st-attention"],
  ready: ["Připraven", "st-ready"], done: ["Projednán", "st-done"],
};
const ALERT = { missing: ["Chybí", "k-missing"], contradiction: ["Rozpor", "k-contradiction"], change: ["Změna", "k-change"], unclear: ["Nejasné", "k-unclear"] };

/* Calendar: seminars repeat every week (example schedule), 10-minute slots (Soňa, feedback round 2).
   Dates are handled as ISO strings at noon UTC so no time zone can shift a day. */
const WD = ["Ne", "Po", "Út", "St", "Čt", "Pá", "So"];
const MONTHS = ["leden", "únor", "březen", "duben", "květen", "červen", "červenec", "srpen", "září", "říjen", "listopad", "prosinec"];
const dObj = iso => new Date(iso + "T12:00:00Z");
const isoOf = d => d.toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = dObj(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const mondayOf = iso => { const d = dObj(iso); return addDays(iso, -((d.getUTCDay() + 6) % 7)); };
const dayLabel = iso => { const d = dObj(iso); return `${WD[d.getUTCDay()]} ${d.getUTCDate()}. ${d.getUTCMonth() + 1}.`; };
/* One neuro-oncology MDT a week (example: Thursday 14:00-16:00) in 10-minute slots; every other slot is greyed
   out (Soňa, round 3). The schedule comes from GET /api/config at start-up. */
let TODAY = "2026-10-16", SLOT_MIN = 10, TIMES = [];
const seminarOn = iso => { const s = C.cfg.schedule.weekly[dObj(iso).getUTCDay()]; return s ? [s.from, s.to, s.title] : null; };
const slotEnd = t => { const [h, m] = t.split(":").map(Number), x = h * 60 + m + SLOT_MIN; return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; };

/* UI state only: what is shown, filters, selection, open panels. Records live on the server. */
const S = {
  view: "patients", pid: null, tab: "overview", brief: "brief", user: null,
  q: "", colf: {}, colOpen: null, subFrom: "", subTo: "", dbPage: 0, dbAll: false,
  week: mondayOf("2026-10-22"), miniMonth: "2026-10", labMode: "doc", guideOn: true, labSel: null,
  selTl: null, picked: new Set(["summary", "imaging", "histology", "past_treatment"]),
  schedPick: null, calPop: null, overlay: null, tlScroll: 0, openFind: new Set(), taskScope: "mine", srcTab: "image",
};

/* ---------- api access and the response cache ---------- */
/* The stubbed login: every request names the current user, as a session token would. */
const enc = encodeURIComponent;
const withUser = (h = {}) => ({ "X-User": S.user, ...h });
const http = {
  get: (p, h) => api.get(p, withUser(h)),
  post: (p, b, h) => api.post(p, b, withUser(h)),
  put: (p, b, h) => api.put(p, b, withUser(h)),
  patch: (p, b, h) => api.patch(p, b, withUser(h)),
  del: (p, h) => api.del(p, withUser(h)),
};
/* Stale entries are refetched on the next load but stay readable until the reply arrives, so an event that
   fires mid-reload (a keystroke while a request is under way) still finds the data it needs. */
const C = { cfg: null, r: {}, stale: new Set() };
async function need(path) {
  if (!(path in C.r) || C.stale.has(path)) { const v = await http.get(path); C.r[path] = v; C.stale.delete(path); }
  return C.r[path];
}
const got = path => C.r[path];
/* After any change, drop everything that can change; the case content, the guidance and the document
   pages never change in the mock, so they stay cached. */
function dropMutable() {
  for (const k of Object.keys(C.r)) {
    if (/\/case$|\/guidance$|^\/api\/documents\//.test(k)) continue;
    /* A protocol draft is the doctor's typing in progress (UI state); a reload must not replace it with an older
       server copy. Approval, a new version and a refused save drop it explicitly (dropProto). */
    if (/\/protocol$/.test(k) && C.r[k]?.state === "draft") continue;
    C.stale.add(k);
  }
}
const dropProto = pid => { C.stale.add(`${PT(pid)}/protocol`); };
const pats = () => got("/api/patients") || [];
const P = file => pats().find(p => p.file === file);
const PT = file => `/api/patients/${enc(P(file)?.rid ?? String(file).replace("_pacient.pdf", ""))}`;
const role = u => ROLES[u] || (DEPTS.some(([, d]) => d.includes(u)) ? "doctor" : null);
const isDoctor = u => role(u) === "doctor";
/* "Moje" tasks: assigned to the user, or (for a doctor) on a case they own. The nav badge and the task list
   use the same request, so the badge counts exactly what the list shows. */
const myTasksPath = () => role(S.user) === "coordinator" ? `/api/tasks?assignee=${enc(S.user)}` : `/api/tasks?assignee=${enc(S.user)}&owner=${enc(S.user)}`;
const taskListPath = () => S.taskScope === "all" ? "/api/tasks" : myTasksPath();
const editsOf = (pid = S.pid) => got(`${PT(pid)}/edits`) || { current: {}, log: [] };
const decs = (pid = S.pid) => got(`${PT(pid)}/decisions`) || [];
const alertsOf = (pid = S.pid) => got(`${PT(pid)}/alerts`) || [];
/* The render functions read the case on screen through CASE and EXTRA; load() points them at the cached
   GET /api/patients/:id/case response of the patient being shown. */
let CASE = null, EXTRA = {}, BRIEF_CS = null, BRIEF_REFS = null;
async function load() {
  await need("/api/patients");
  await need(myTasksPath());
  const focus = S.view === "calendar" ? S.calPop : ["patient", "present", "protocol"].includes(S.view) ? S.pid : null;
  if (focus && P(focus)) {
    const cs = await need(`${PT(focus)}/case`);
    /* The conclusion draft is written in the patient overview and the attendance counts on every case screen,
       so the protocol and the seminar attendance load with the case. */
    const caseScreen = S.view !== "calendar";
    await Promise.all([need(`${PT(focus)}/edits`), need(`${PT(focus)}/decisions`), cs.full ? need(`${PT(focus)}/alerts`) : null,
      caseScreen ? need(`${PT(focus)}/protocol`) : null, caseScreen ? need(attPath(P(focus).att_day)) : null, caseScreen ? need("/api/mails") : null]);
    /* The guideline layer is a separate server call, made only while the layer is switched on. */
    const guide = cs.full && S.guideOn ? await need(`${PT(focus)}/guidance`) : null;
    CASE = cs.full ? cs.case : null; EXTRA = cs.full ? cs.extra : {}; GUIDE = guide || {};
  } else { CASE = null; EXTRA = {}; GUIDE = {}; }
  /* v3 brief in the clinicians' own compact style, staging first (round 4); v2 keeps its own brief. */
  BRIEF_CS = EXTRA.onco_summary_v3_cs || EXTRA.onco_brief_v3_cs || EXTRA.onco_brief_cs;
  BRIEF_REFS = EXTRA.onco_summary_v3_refs || EXTRA.onco_brief_v3_refs || EXTRA.onco_brief_refs;
  if (S.overlay?.kind === "start") await need(attPath(S.overlay.day));
  if (S.view === "tasks") await Promise.all([need(taskListPath()), need("/api/mails")]);
  /* The audit log grows with every request, so the admin screen always reads it fresh. */
  if (S.view === "admin") {
    const admin = role(S.user) === "admin";
    C.r["/api/audit"] = admin ? await http.get("/api/audit").catch(e => ({ error: e.error })) : null;
    C.r["/api/edits"] = admin ? await http.get("/api/edits").catch(() => []) : null;
  }
}
async function show() { await flushProto(); await load(); render(); }
async function mutated() { await flushProto(); dropMutable(); await show(); }
const fail = err => { console.warn(err); toast(err?.error || "Požadavek se nezdařil"); };

/* ---------- small UI helpers ---------- */
/* Identity as the MDT team reads it (Soňa, round 3): surname first, then the birth number. No FNO document
   in the challenge data contains a birth number, so it shows as not stated; never invented. */
const surnameFirst = p => p.nameAsWritten || (p.name.includes(" ") ? p.name.split(" ").slice(-1)[0] + " " + p.name.split(" ").slice(0, -1).join(" ") : p.name);
const rcText = p => p.rc || "-";
/* Age as a bare number (round 4); from a stated age, or computed from a stated birth date. */
const ageNum = p => { const t = ageText(p); return t ? t.replace(/\s*let$/, "") : null; };
const ageText = p => p.age ? p.age : p.birth ? (() => { const [d, m, y] = p.birth.split(".").map(Number); const t = dObj(TODAY); let a = t.getUTCFullYear() - y; if (t.getUTCMonth() + 1 < m || (t.getUTCMonth() + 1 === m && t.getUTCDate() < d)) a--; return `${a} let`; })() : null;
const statusChip = p => `<span class="chip ${STATUS[p.status][1]}">${STATUS[p.status][0]}</span>`;
const slotText = p => p.slot ? `${dayLabel(p.slot.day)} ${p.slot.day.slice(0, 4)} · ${p.slot.time}-${slotEnd(p.slot.time)}` : "nenaplánováno";

/* Doctor edits (Soňa: "everything editable"). An edit never changes the source document or the
   extracted value; the server stores it next to it with who and when, and the UI marks it as edited. */
/* Edits are keyed per patient, so one patient's correction can never show up on another's case. */
const EK = (key, pid = S.pid) => `${pid}|${key}`;
/* While a frozen report is rendered, edits come from the approval snapshot, so later edits never change it. */
let SNAP = null;
const edOf = (key, pid = S.pid) => SNAP && SNAP.patient.file === pid ? SNAP.edits[key] : editsOf(pid).current[key];
/* The edit dialog carries the full key "<patient file>|<field key>". */
const splitKey = k => { const [pid, ...rest] = k.split("|"); return [pid, rest.join("|")]; };
function ed(key, orig, opts = {}) {
  const e = edOf(key);
  const text = e ? e.text : orig;
  const shown = opts.html && !e ? opts.html : esc(text ?? "");
  const tag = e ? `<span class="edtag" title="Upravil(a) ${esc(e.by)}, ${esc(e.when)}. Původně: ${esc(orig || GAP)}">upraveno</span>` : "";
  const btn = isDoctor(S.user) ? `<button class="edbtn" data-edit="${esc(EK(key))}" data-orig="${esc(orig ?? "")}" aria-label="Upravit" title="Upravit">✎</button>` : "";
  return `<span class="${e ? "edited" : ""}">${shown}</span>${tag}${btn}`;
}
function edLink(key, orig) {
  const e = edOf(key), text = esc(e ? e.text : orig ?? "");
  const tag = e ? `<span class="edtag" title="Upravil(a) ${esc(e.by)}, ${esc(e.when)}. Původně: ${esc(orig || GAP)}">upraveno</span>` : "";
  return (isDoctor(S.user) ? `<span class="edl ${e ? "edited" : ""}" data-edit="${esc(EK(key))}" data-orig="${esc(orig ?? "")}" title="Upravit">${text}</span>` : `<span class="${e ? "edited" : ""}">${text}</span>`) + tag;
}
const edText = (key, orig, pid = S.pid) => edOf(key, pid) ? edOf(key, pid).text : orig;
/* In the report an edited value is marked, so it is never read as if the cited source said it. */
const edRep = (key, orig, pid = S.pid) => edOf(key, pid) ? `${edOf(key, pid).text} [upraveno lékařem]` : orig;

/* Quiet certainty markers: an icon with a tooltip instead of a grey comment line (Soňa, round 2).
   The meaning is still shown on every fact, as CLAUDE.md requires; only the wording moved into the tooltip. */
function marks(f) {
  let h = "";
  if (f.negated) h += `<span class="mk neg" title="Zápor zapsaný v dokumentu">-</span>`;
  if (f.certainty === "unclear_ocr" || f.ocr_note_cs) h += `<span class="mk ocr" title="Ověřit čtení: ${esc(f.ocr_note_cs || f.note || "text mohl být špatně přečten")}">!</span>`;
  if (f.certainty === "inferred") h += `<span class="mk obs" title="Pozorování asistenta, v dokumentu výslovně není">i</span>`;
  if (f.certainty === "planned" || f.change_status === "planned_unconfirmed" || /plánováno/i.test(f.change_cs || "")) h += `<span class="mk plan" title="Plánováno, dokument neuvádí, že se stalo${f.note_cs ? ": " + esc(f.note_cs) : ""}">?</span>`;
  /* Any other assistant note (source discrepancy, unclear exam) stays reachable as an icon, not as row text (round 5). */
  if (f.note_cs && f.certainty !== "conflicting" && f.change_status !== "planned_unconfirmed" && f.certainty !== "planned") h += `<span class="mk obs" title="Poznámka asistenta: ${esc(f.note_cs)}">i</span>`;
  if (f.certainty === "conflicting") h += `<span class="mk ocr" style="background:var(--conflict-soft);color:var(--conflict)" title="Rozpor mezi dokumenty${f.note_cs ? ": " + esc(f.note_cs) : ""}">≠</span>`;
  return h;
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* Paper-style references: each view numbers its sources [1], [2] in order of first use. */
function refRegistry() {
  const list = [];
  const key = r => `${r.file}|${r.page}|${r.quote}`;
  return {
    list,
    /* No [n] markers in the text (Soňa, round 14): sources are registered for the list, and the text opens them. */
    n(r) { if (!r) return ""; if (list.findIndex(x => key(x) === key(r)) < 0) list.push(r); return ""; },
    /* Numbered marker for blocks where the text itself opens the edit dialog (round 15). */
    mark(r) { if (!r) return ""; this.n(r); const k = list.findIndex(x => key(x) === key(r)) + 1; return `<button class="ref" data-src='${esc(JSON.stringify(r))}' title="Otevřít zdroj">[${k}]</button>`; },
    wrap(html, r) { if (!r) return html; this.n(r); return `<span class="srcl" role="button" tabindex="0" data-src='${esc(JSON.stringify(r))}' title="Otevřít zdroj">${html}</span>`; },
    html() { return list.length ? `<ol class="refs">${list.map(r => `<li><button data-src='${esc(JSON.stringify(r))}'>${esc(docTitle(r))}, s. ${esc(r.page)}: „${esc(r.quote.length > 90 ? r.quote.slice(0, 90) + "…" : r.quote)}“</button></li>`).join("")}</ol>` : ""; },
  };
}
/* Prose with [n] markers: each clause before a marker becomes a link to that source. */
function linkProse(text, refs, reg) {
  const parts = String(text || "").split(/\s*\[(\d+)\]/);
  let out = "", carry = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { carry += parts[i]; continue; }
    const r = (refs || [])[+parts[i] - 1];
    if (carry.trim()) { const lead = carry.match(/^[\s;,.:]*/)[0]; out += esc(lead) + reg.wrap(esc(carry.slice(lead.length)), r); carry = ""; } else reg.n(r);
  }
  return out + esc(carry);
}
function docTitle(r) {
  const d = (EXTRA.documents || []).find(d => (d.pages || []).includes(r.page));
  return d ? d.title_cs : r.file;
}

  ["owner", "Vlastník", p => p.owner],

/* One filter mechanism for every table: [key, title, getter] plus the rows it filters. */

/* ---------- 2. MDT calendar ---------- */
/* Google-calendar-like navigation (Soňa, round 2): week arrows, a month grid to jump anywhere, a year picker. */
function miniMonth() {
  const [y, m] = S.miniMonth.split("-").map(Number);
  const first = `${S.miniMonth}-01`, start = mondayOf(first);
  const weekEnd = addDays(S.week, 6);
  let cells = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"].map(d => `<span class="wd">${d}</span>`).join("");
  for (let i = 0; i < 42; i++) {
    const iso = addDays(start, i), d = dObj(iso);
    if (i >= 35 && d.getUTCMonth() + 1 !== m) break;
    cells += `<button data-jump="${iso}" class="${d.getUTCMonth() + 1 !== m ? "out" : ""} ${iso >= S.week && iso <= weekEnd ? "wk" : ""} ${seminarOn(iso) ? "sem" : ""}" aria-label="${iso}">${d.getUTCDate()}</button>`;
  }
  const years = [2024, 2025, 2026, 2027, 2028];
  return `<div class="card"><div class="row spread" style="margin-bottom:8px"><button class="btn small" data-mm="-1" aria-label="Předchozí měsíc">‹</button>
      <span class="row"><b>${MONTHS[m - 1]}</b><select class="input" id="mmyear" style="width:auto;padding:3px 6px" aria-label="Rok">${years.map(v => `<option ${v === y ? "selected" : ""}>${v}</option>`).join("")}</select></span>
      <button class="btn small" data-mm="1" aria-label="Další měsíc">›</button></div>
    <div class="mini">${cells}</div></div>`;
}
const dayAgenda = day => pats().filter(x => x.slot && x.slot.day === day).sort((a, b) => a.slot.time.localeCompare(b.slot.time));

  const days = [0, 1, 2, 3, 4].map(i => addDays(S.week, i));
  const unscheduled = pats().filter(p => !p.slot || p.file === S.schedPick);
  const byslot = {}; pats().forEach(p => { if (p.slot) byslot[`${p.slot.day} ${p.slot.time}`] = p; });
  const inSem = (day, t) => { const s = seminarOn(day); return s && t >= s[0] && t < s[1]; };
  let cells = `<div></div>${days.map(d => `<div class="dh">${dayLabel(d)}${d === TODAY ? " · dnes" : ""}<small>${seminarOn(d) ? esc(seminarOn(d)[2]) + " " + seminarOn(d)[0] + "-" + seminarOn(d)[1] : "&nbsp;"}</small>${dayAgenda(d).length ? `<button class="btn small primary startmdt" data-startday="${d}">Zahájit MDT ▸</button>` : ""}</div>`).join("")}`;
  /* By default the grid shows seminar hours with 30 minutes either side, so the first seminar row is in view
     without scrolling; "Zobrazit celý den" shows every slot. A week without a seminar, or a booking outside
     that range, always shows the whole day so no booked slot is hidden. */
  const sems = days.map(seminarOn).filter(Boolean);
  const shift = (t, n) => { const [h, m] = t.split(":").map(Number), x = h * 60 + m + n; return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; };
  const from = sems.length ? shift(sems.map(s => s[0]).sort()[0], -30) : null, to = sems.length ? shift(sems.map(s => s[1]).sort().slice(-1)[0], 30) : null;

      else if (sem) inner = `<button class="slotbtn free ${S.schedPick ? "target" : ""}" data-free="${d} ${t}" aria-label="Volný termín ${t}"><span class="tt2">${t}-${slotEnd(t)}</span>${S.schedPick ? " · Naplánovat sem" : ""}</button>`;

      <div><span class="label">Diagnóza</span><p style="margin:2px 0 0;font-weight:700">${esc(pop.full ? dxHeadlineText() : pop.diagnosis)}</p></div>
      <div class="question ${pop.explicit || edOf("q", pop.file) ? "" : "missing"}" style="padding:8px 12px"><span class="label">Otázka pro MDT</span><p style="font-size:14px">${esc(questionText(pop))}</p></div>
      ${pop.full ? `<p class="small" style="margin:0">${esc(briefPlain().slice(0, 260))}…${edOf("brief", CASE.file) ? " (upraveno lékařem)" : ""}</p>` : `<p class="small" style="margin:0">${esc(pop.summary || "")}</p>`}
      <div class="row" style="gap:6px"><button class="btn primary" data-open="${esc(pop.file)}">Otevřít případ</button><button class="btn" data-pick="${esc(pop.file)}">Změnit termín</button><button class="btn" data-unsched="${esc(pop.file)}">Uvolnit termín</button><button class="btn" data-calclose="1" aria-label="Zavřít kartu" style="margin-left:auto">✕</button></div></div>` : "";
  const end = addDays(S.week, 4);
  return `<div class="page">
    <div class="pagehead"><div><h1>Kalendář MDT</h1><div class="muted small">${dObj(S.week).getUTCDate()}. ${dObj(S.week).getUTCMonth() + 1}. až ${dObj(end).getUTCDate()}. ${dObj(end).getUTCMonth() + 1}. ${end.slice(0, 4)}</div></div>
      <div class="row"><button class="btn small" data-wk="-1">‹ Předchozí týden</button><button class="btn small" data-act="today">Dnes</button><button class="btn small" data-wk="1">Další týden ›</button></div></div>
    <div class="calwrap3">

        ${canTrim ? `<div class="row small muted"><span>${S.calFullDay ? "Zobrazen celý den" : `Zobrazeny hodiny semináře ${esc(from)}-${esc(to)}`}</span><button class="linkbtn small" data-act="calfull">${S.calFullDay ? "Jen hodiny semináře" : "Zobrazit celý den"}</button></div>` : ""}</div>
      <div class="stack">
        ${miniMonth()}

/* ---------- 5. MDT protocol ---------- */
/* One protocol per patient, kept on the server; attendance belongs to the whole seminar day, so it is entered once. */
const protoOf = p => got(`${PT(p.file)}/protocol`);
const curProto = () => protoOf(P(S.pid));
/* Attendance is entered once per seminar day and applies to every case that day (Soňa, rounds 1 and 2); the
   server names the day of a patient without a slot, whose attendance is their own. */
const attDay = () => P(S.pid)?.att_day;
const attPath = (day = attDay()) => `/api/seminars/${enc(day)}/attendance`;
const attFor = (day = attDay()) => got(attPath(day)) || {};
/* Typing changes the cached draft at once; the server gets it after a short pause (debounced), one save at a
   time (serialized), each carrying the version it is based on. Over a real network requests can arrive out of
   order; serializing keeps a late save from overwriting newer text, and the version lets the server refuse a
   stale one. flushProto() sends what is pending and waits, before approval or any reload. */
const SAVE_MS = 400;
const saving = { timer: null, chain: Promise.resolve(), pid: null };
function sendProto(pid) {
  saving.chain = saving.chain.then(async () => {
    const pr = protoOf(P(pid));
    if (!pr || pr.state === "approved") return;
    const res = await http.put(`${PT(pid)}/protocol`, { version: pr.version, mode: pr.mode, notes: pr.notes, concl: pr.concl, steps: pr.steps, dev: pr.dev || {} });
    /* Only the version is taken from the reply; the text on screen may already be newer than what was sent. */
    const cur = protoOf(P(pid)); if (cur) cur.version = res.version;
  }).catch(err => {
    fail(err);
    /* A refused (stale) save means the server has a newer protocol: show that one instead of retrying. */
    if (err?.status === 409) { dropProto(pid); show().catch(fail); }
  });
  return saving.chain;
}
function saveProto() {
  /* A pending save for another patient goes first, so switching cases never drops typing. */
  if (saving.timer && saving.pid !== S.pid) { clearTimeout(saving.timer); sendProto(saving.pid); }
  clearTimeout(saving.timer); saving.pid = S.pid;
  saving.timer = setTimeout(() => { saving.timer = null; sendProto(saving.pid); }, SAVE_MS);
}
async function flushProto() {
  if (saving.timer) { clearTimeout(saving.timer); saving.timer = null; sendProto(saving.pid); }
  await saving.chain;
}

}
async function action(a) {
  const pr = S.view === "protocol" ? curProto() : null;
  if (a === "newpatient") { S.overlay = { kind: "new", step: 0, uploaded: false, progress: 0 }; renderOverlay(); }
  else if (a === "newnext") {
    const o = S.overlay;
    if (o.step === 0 && !document.getElementById("nfg").checked) { toast("Potvrďte souhlas se zpracováním údajů."); return; }
    o.step++; renderOverlay();
    /* The processing steps are an animation only; nothing is processed in the mock. It stops when the dialog closes. */
    if (o.step === 2) { const tick = () => { if (S.overlay !== o) return; o.progress++; renderOverlay(); if (o.progress < 4) setTimeout(tick, 550); }; setTimeout(tick, 450); }
  }
  else if (a === "newback") { S.overlay.step--; renderOverlay(); }
  else if (a === "fakeupload") { S.overlay.uploaded = true; renderOverlay(); }
  else if (a === "newdone") {
    const p = await http.post("/api/patients", {});
    S.overlay = null; S.view = "patients"; S.colf = {}; toast(`Pacient ${p.id} přidán do databáze`); await mutated();
  }
  else if (a === "cancelsched") { S.schedPick = null; render(); }
  else if (a === "dball") { S.dbAll = true; render(); }
  else if (a === "dbpaged") { S.dbAll = false; S.dbPage = 0; render(); }
  else if (a === "clearcolf") { COLS.forEach(c => delete S.colf[c[0]]); render(); }
  else if (a === "cleardcolf") { DCOLS.forEach(c => delete S.colf[c[0]]); S.dq = ""; render(); }
  else if (a === "gaps") { S.gapsOpen = !S.gapsOpen; render(); }
  else if (a === "kebab") { S.kebab = !S.kebab; render(); }
  else if (a === "download") {
    /* The browser's print dialog saves the report as PDF; no PDF library is needed in the mock. */
    S.kebab = false; const p = P(S.pid), pr = protoOf(p);
    const html = pr.state === "approved" && pr.snap ? frozenReport(pr.snap) : reportHtml(p, pr, presentList());
    const w = window.open("", "_blank");
    if (w) { w.document.write(`<!doctype html><meta charset="utf-8"><title>Protokol MDT ${p.id}</title><style>body{font:13px/1.5 system-ui,sans-serif;margin:30px}h4{margin:16px 0 4px;text-transform:uppercase;font-size:12px;border-bottom:1px solid #ccc}.src{color:#666;font-size:11px}</style>${html}`); w.document.close(); w.focus(); w.print(); }
    else toast("Prohlížeč zablokoval nové okno");
    render();
  }
  else if (a === "calfull") { S.calFullDay = !S.calFullDay; render(); }
  else if (a === "editconcl") {
    /* The conclusion is written in the patient overview (doctors' decision); jump there and put the cursor in it. */
    S.view = "patient"; S.tab = "overview"; await show();
    const c = document.getElementById("concl"); if (c) { c.scrollIntoView({ block: "center" }); c.focus(); }
  }
  else if (a === "today") { S.week = mondayOf(TODAY); S.miniMonth = TODAY.slice(0, 7); render(); }
  else if (a === "upload") { S.overlay = { kind: "upload" }; renderOverlay(); }
  else if (a === "fakeupload2") { S.overlay.done = true; renderOverlay(); }
  else if (a === "saveedit" || a === "revertedit") {
    const o = S.overlay, txt = document.getElementById("edtext")?.value.trim();
    const [pid, key] = splitKey(o.key);
    /* Saving the original text, or nothing, is a revert: the server keeps both in the edit log, which only grows. */
    const revert = a === "revertedit" || !txt || txt === o.orig;
    if (revert) { if (edOf(key, pid)) await http.del(`${PT(pid)}/edits/${enc(key)}`); }
    else await http.post(`${PT(pid)}/edits`, { key, text: txt, orig: o.orig });
    S.overlay = null; await mutated(); toast(revert ? "Vrácen původní údaj" : "Úprava uložena");
  }
  else if (a === "addstep") { pr.steps.push({ text: "", who: COORD, due: "2026-10-30" }); saveProto(); render(); }
  else if (a === "copyatt") { copyText((pr?.state === "approved" ? pr.attSnap : presentList()).join(", ") || "nezadáno", "Seznam přítomných"); }
  else if (a === "copytasks") { copyText(pr.steps.filter(x => x.text.trim()).map(x => `${x.text} (${x.who}, do ${fmtDate(x.due)})`).join("\n"), "Úlohy"); }
  else if (a === "newversion") { await http.post(`${PT(S.pid)}/protocol/new-version`, {}); dropProto(S.pid); await mutated(); }
  else if (a === "approve") {
    if (!pr.concl.trim() || !isDoctor(S.user) || !presentList().includes(S.user)) return;
    /* Pending saves go first; the approval then sends exactly what is on screen, with the version it is based on.
       The server freezes a structured snapshot, so later attendance changes or edits never alter the approved report. */
    await flushProto();
    const cur = curProto();
    const res = await http.post(`${PT(S.pid)}/decisions`, { version: cur.version, text: cur.concl, steps: cur.steps, picked: [...S.picked], dev: cur.dev || {}, guide_on: S.guideOn });
    dropProto(S.pid);
    const n = res.tasks_created;
    toast(`Závěr schválen${n ? `, koordinátorce ${n === 1 ? "odeslána 1 úloha" : n <= 4 ? `odeslány ${n} úlohy` : `odesláno ${n} úloh`}` : ""}`);
    await mutated();
  }
}
document.addEventListener("input", e => {

  else if (t.id === "q") { S.q = t.value; const pos = t.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }

/* The server books the slot; it refuses one outside a seminar (422) or already taken (409). */
async function scheduleAt(file, slot) {
  const [day, time] = slot.split(" ");
  const p = await http.put(`${PT(file)}/slot`, { day, time });
  toast(`${surnameFirst(p)} naplánován(a) na ${slotText(p)}`); S.schedPick = null; S.calPop = p.file; await mutated();
}
/* Drag and drop in the calendar (round 16): a patient from the unscheduled list, or a booked slot, onto a free slot.
   Clicking a patient and then a slot still works for keyboards and touch screens. */
/* Enter or Space on a text source link acts like a click, as on a button. */
document.addEventListener("keydown", e => { const el = e.target.closest?.(".srcl[role=button], .edl"); if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); el.click(); } });
document.addEventListener("dragstart", e => {
  const el = e.target.closest?.("[data-drag]"); if (!el) return;
  e.dataTransfer.setData("text/plain", el.dataset.drag); e.dataTransfer.effectAllowed = "move"; S.dragFile = el.dataset.drag;
  requestAnimationFrame(() => el.classList.add("dragging"));
});
document.addEventListener("dragend", e => { e.target.closest?.("[data-drag]")?.classList.remove("dragging"); document.querySelectorAll(".slotbtn.drop").forEach(x => x.classList.remove("drop")); S.dragFile = null; });
document.addEventListener("dragover", e => { const f = e.target.closest?.("[data-free]"); if (f && S.dragFile) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; f.classList.add("drop"); } });
document.addEventListener("dragleave", e => { const f = e.target.closest?.("[data-free]"); if (f && !f.contains(e.relatedTarget)) f.classList.remove("drop"); });
document.addEventListener("drop", e => {
  const f = e.target.closest?.("[data-free]"); if (!f) return;
  e.preventDefault(); const file = e.dataTransfer.getData("text/plain") || S.dragFile; S.dragFile = null;
  if (file && P(file)) scheduleAt(file, f.dataset.free).catch(fail);
});
/* Column resizing in the patients table (round 16): the first drag freezes the current widths, then only the
   dragged column changes; widths live in S.colW for the session. */
document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".colrs"); if (!h) return;
  e.preventDefault(); e.stopPropagation();
  const table = h.closest("table"), ths = [...table.querySelectorAll("thead th")];
  if (!S.colW) S.colW = ths.map(th => Math.round(th.getBoundingClientRect().width));
  const i = ths.indexOf(h.closest("th")), x0 = e.clientX, w0 = S.colW[i];
  if (!table.querySelector("colgroup")) { table.insertAdjacentHTML("afterbegin", `<colgroup>${S.colW.map(w => `<col style="width:${w}px">`).join("")}</colgroup>`); table.style.tableLayout = "fixed"; }
  const col = table.querySelectorAll("col")[i]; h.classList.add("on");
  const move = ev => { S.colW[i] = Math.max(48, w0 + ev.clientX - x0); col.style.width = S.colW[i] + "px"; table.style.width = S.colW.reduce((a, b) => a + b, 0) + "px"; };
  const up = () => { h.classList.remove("on"); S.resizedAt = Date.now(); document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); };
  document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
}, true);

async function onChange(e) {
  const t = e.target;
  if (t.id === "user") { S.user = t.value; if (S.view === "admin" && role(t.value) !== "admin") S.view = "patients"; await mutated(); }
  else if (t.dataset.actToggle === "guide") { S.guideOn = t.checked; await show(); }
  else if (t.dataset.dev) { const pr = curProto(); pr.dev = pr.dev || {}; pr.dev[t.dataset.dev] = { ...(pr.dev[t.dataset.dev] || {}), s: t.value }; saveProto(); render(); }
  else if (t.id === "subfrom" || t.id === "subto") { S[t.id === "subfrom" ? "subFrom" : "subTo"] = t.value; S.dbPage = 0; render(); }
  else if (t.id === "mmyear") { S.miniMonth = `${t.value}-${S.miniMonth.slice(5)}`; S.week = mondayOf(`${S.miniMonth}-15`); render(); }
  else if (t.dataset.colall) { if (t.checked) delete S.colf[t.dataset.colall]; else S.colf[t.dataset.colall] = []; render(); }
  else if (t.dataset.colv) {
    const k = t.dataset.colv, col = colDef(k);
    const all = [...new Set(col.items.map(col.get))];
    let cur = S.colf[k] ? [...S.colf[k]] : all;
    cur = t.checked ? [...new Set([...cur, t.value])] : cur.filter(v => v !== t.value);
    if (cur.length === all.length) delete S.colf[k]; else S.colf[k] = cur;
    render();
  }
  else if (t.dataset.att) {
    const day = t.dataset.day || attDay(), att = attFor(day), arr = (att[t.dataset.att] ||= [""]), k = +t.dataset.k;
    if (!t.value && k > 0) arr.splice(k, 1); else arr[k] = t.value;
    await http.put(attPath(day), att); await mutated();
  }
  else if (t.dataset.redact) { S.overlay.redacted = t.checked; renderOverlay(); }
  else if (t.dataset.pickrep) { t.checked ? S.picked.add(t.dataset.pickrep) : S.picked.delete(t.dataset.pickrep); }
  /* A typed step was saved on input already; re-rendering on blur would swallow the click that caused the blur
     (for example on "Schválit"). Only the assignee and the date need a fresh render. */
  else if (t.dataset.step !== undefined && t.dataset.f !== "text") { curProto().steps[+t.dataset.step][t.dataset.f] = t.value; saveProto(); render(); }
}
