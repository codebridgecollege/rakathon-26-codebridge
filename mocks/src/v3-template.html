<title>MDT Workspace v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Mock v3: v2 plus Soňa's second feedback round (docs/design/PRODUCT.md, "Feedback round 2").
   Soňa's brief: a GLIDE-inspired clinical workspace in a white version only.
   Light ground, dark type, fine dividing lines, minimal shadow; colour only where it carries meaning.
   Layout: a top bar with the three main areas (patients, calendar, tasks); each screen is a full-width working page. */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --sunk: #f0f2ef;
  --fg: #1c2726;
  --muted: #5b6866;
  --faint: #8a9593;
  --line: #e1e4e0;
  --line-strong: #cdd3cf;
  --accent: #3d7a6f;
  --accent-ink: #2c5c53;
  --accent-soft: #e3ece8;
  --missing: #8f5a06; --missing-soft: #fbf0dc;
  --conflict: #a8323f; --conflict-soft: #fbe6e8;
  --change: #2b5aa8; --change-soft: #e5ecf8;
  --unclear: #6a5b8a; --unclear-soft: #eeeaf5;
  --ok: #2d7650; --ok-soft: #e1f1e7;
  --mark: #fff0a8;
  --font-head: "Manrope", "DM Sans", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14.5px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-head); letter-spacing: -.005em; text-wrap: balance; }
h1 { font-size: 22px; margin: 0; line-height: 1.25; }
h2 { font-size: 16px; margin: 0; }
h3 { font-size: 14px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 800 15px/1 var(--font-head); display: flex; align-items: center; gap: 8px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav button:hover { background: var(--sunk); }
.nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.nav .count { font-size: 11px; background: var(--accent); color: #fff; border-radius: 99px; padding: 0 6px; margin-left: 4px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.who select { border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 6px; background: var(--surface); }
.demo { font-size: 11.5px; font-weight: 600; color: var(--missing); background: var(--missing-soft); border-radius: 99px; padding: 2px 8px; }

.page { padding-block: 22px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card > .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { justify-content: space-between; }

.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 7px 13px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.st-new { background: var(--sunk); color: var(--muted); }
.st-scheduled { background: var(--change-soft); color: var(--change); }
.st-attention { background: var(--missing-soft); color: var(--missing); }
.st-ready { background: var(--ok-soft); color: var(--ok); }
.st-done { background: var(--accent-soft); color: var(--accent-ink); }
.k-missing { background: var(--missing-soft); color: var(--missing); }
.k-contradiction { background: var(--conflict-soft); color: var(--conflict); }
.k-change { background: var(--change-soft); color: var(--change); }
.k-unclear { background: var(--unclear-soft); color: var(--unclear); }

/* Toolbar and tables */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.search { flex: 1 1 220px; max-width: 340px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 10px; background: var(--surface); }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.filter[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
select.input, input.input, textarea.input { border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; background: var(--surface); width: 100%; }
textarea.input { min-height: 96px; resize: vertical; }
.scroll { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--sunk); }
.tbl .id { font-weight: 700; font-variant-numeric: tabular-nums; }
.ex { font-size: 10.5px; color: var(--faint); margin-left: 3px; vertical-align: super; }

/* Calendar */
.calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.cal { display: grid; grid-template-columns: 56px repeat(5, minmax(120px, 1fr)); min-width: 720px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.cal .dh { padding: 8px 10px; border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.cal .dh small { display: block; color: var(--muted); font-weight: 500; }
.cal .tm { font-size: 11.5px; color: var(--faint); padding: 0 6px; text-align: right; border-top: 1px solid var(--line); height: 34px; line-height: 34px; font-variant-numeric: tabular-nums; }
.cal .cell { border-top: 1px solid var(--line); border-left: 1px solid var(--line); height: 34px; padding: 2px 4px; position: relative; }
.cal .cell { background: #eceeeb; }
.cal .cell.sem { background: var(--surface); }
.slotbtn { width: 100%; height: 100%; border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer; font-size: 12.5px; text-align: left; padding: 0 6px; display: flex; align-items: center; gap: 6px; }
.slotbtn.free { color: var(--faint); }
.slotbtn.free:hover, .slotbtn.target { border-color: var(--accent); color: var(--accent-ink); background: #fff; }
.slotbtn.taken { background: var(--surface); border-color: var(--line-strong); font-weight: 700; }
.slotbtn.taken .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.popover { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 14px 16px; box-shadow: 0 6px 24px rgba(28,39,38,.08); }

/* Patient header */
.phead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: start; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.facts b { color: var(--fg); font-weight: 600; }
.question { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r) var(--r) 0; padding: 10px 14px; }
.question.missing { border-left-color: var(--missing); background: var(--missing-soft); }
.question p { margin: 2px 0 0; font-size: 15.5px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 9px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.tab .n { font-size: 11px; background: var(--sunk); border-radius: 99px; padding: 0 6px; margin-left: 4px; }

/* Summary with paper-style references */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 99px; padding: 2px; background: var(--sunk); }
.seg button { border: 0; background: none; border-radius: 99px; padding: 3px 12px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.prose { font-size: 15px; line-height: 1.65; max-width: 78ch; margin: 0; }
.ref { margin-top: -2px; transform: translateY(4px); font-size: 11px; vertical-align: super; line-height: 1; min-width: 18px; min-height: 18px; background: none; border: 0; padding: 0 1px; color: var(--accent-ink); cursor: pointer; font-weight: 700; }
.ref:hover { text-decoration: underline; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14.5px; max-width: 86ch; }
.dl dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.dl dd { margin: 0; }
.refs { margin: 12px 0 0; padding: 10px 0 0 22px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }
.refs li { padding-left: 2px; }
.refs button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; }
.refs button:hover { color: var(--accent-ink); text-decoration: underline; }
details.more > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.disclaim { font-size: 12px; color: var(--faint); margin-top: 8px; }

/* Alerts strip */
.alerts { display: grid; gap: 6px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 6px; background: var(--sunk); }
.alert.ack { opacity: .55; }
.alert .why { display: block; color: var(--muted); font-size: 12.5px; }

/* Horizontal labelled timeline */
.tlbar { position: relative; overflow-x: auto; padding: 6px 2px 4px; }
.tltrack { position: relative; display: flex; align-items: flex-start; gap: 0; min-width: max-content; padding: 0 8px; }
.tltrack::before { content: ""; position: absolute; left: 0; right: 0; top: 39px; height: 2px; background: var(--line-strong); }
.tlyear { position: relative; min-width: 56px; padding-inline: 4px; flex: none; text-align: center; padding-top: 30px; }
.tlyear span { position: relative; display: inline-block; font: 700 12px/1 var(--font-head); color: var(--muted); background: var(--surface); padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 99px; }
.ev { position: relative; flex: none; width: 196px; padding: 0 8px; background: none; border: 0; text-align: left; cursor: pointer; }
.ev .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; height: 18px; display: block; white-space: nowrap; }
.ev .pin { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid currentColor; margin: 4px 0 8px; }
.ev .pin svg { width: 15px; height: 15px; }
.ev.planned .pin { border-style: dashed; }
.ev .t { display: block; font-weight: 700; font-size: 13.5px; line-height: 1.3; color: var(--fg); }
.ev .d { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.ev[aria-pressed="true"] .pin { box-shadow: 0 0 0 4px var(--accent-soft); }
.ev[aria-pressed="true"] .t { color: var(--accent-ink); }
.evdetail { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.kind-diagnosis { color: #7a3f8f; } .kind-imaging { color: #2b5aa8; } .kind-surgery { color: #8f5a06; }
.kind-pathology { color: #a8323f; } .kind-systemic { color: #2d7650; } .kind-radiotherapy { color: #b5521b; }
.kind-mdt { color: #3d7a6f; } .kind-visit { color: #5b6866; }

/* Anamnesis and documents */
.anam { display: grid; grid-template-columns: 220px minmax(0, 1fr); border-top: 1px solid var(--line); }
.anam > div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.anam > div:nth-child(odd) { font-weight: 600; padding-right: 12px; }
.anam ul { margin: 0; padding-left: 18px; }
.gap { color: var(--faint); font-style: italic; }
.tag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; margin-left: 4px; white-space: nowrap; }
.tag.neg { background: var(--sunk); color: var(--fg); border: 1px solid var(--line-strong); }
.tag.obs { background: var(--unclear-soft); color: var(--unclear); }
.tag.ocr { background: var(--missing-soft); color: var(--missing); }
.note { display: block; color: var(--muted); font-size: 12.5px; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.pipeline li { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pipeline li.wait { background: var(--sunk); color: var(--muted); }
.pipeline li.run { background: var(--change-soft); color: var(--change); }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); background: var(--sunk); }

/* Findings (presentation) */
.find { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.find + .find { margin-top: 8px; }
.find > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.find > summary::-webkit-details-marker { display: none; }
.find > summary::before { content: "›"; font-size: 18px; color: var(--muted); transition: transform .15s; width: 10px; }
.find[open] > summary::before { transform: rotate(90deg); }
.find .ttl { font: 700 15px/1.3 var(--font-head); }
.find .cnt { color: var(--muted); font-size: 12.5px; }
.find .pick { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.find ul { margin: 0; padding: 0 16px 14px 36px; display: grid; gap: 6px; }
.find li .dt { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }

.present { background: var(--surface); }
.present .page { max-width: 1400px; }
.present .prose { font-size: 17px; }
.present .question p { font-size: 18px; }
.agenda { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; min-width: 0; flex: 1 1 320px; }
.agenda button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.agenda button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }

/* Protocol */
.att { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.att .dept { font-weight: 600; font-size: 13.5px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 3px; }
.seg2 button { border: 0; background: none; border-radius: 6px; padding: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.rec { text-align: center; padding: 18px 10px; display: grid; gap: 6px; justify-items: center; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.steps .s { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.steps .s.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.task { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 150px auto; gap: 8px; align-items: center; }
.tasklist { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.trow input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.trow.done .tt { text-decoration: line-through; color: var(--muted); }
.mail { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 12px 14px; background: var(--surface); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hist li { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.hist li.old { opacity: .6; }

/* Report sheet */
.sheet { background: #fff; color: #111; max-width: 760px; margin: 0 auto; padding: 40px 46px; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.06); font-size: 13px; line-height: 1.5; }
.sheet h4 { font: 700 12px/1.3 var(--font-head); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 6px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
.sheet p, .sheet li { margin: 2px 0; }
.sheet .hdr { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #111; padding-bottom: 10px; }
.sheet .src { color: #666; font-size: 11px; }

/* Source drawer */
.scrim { position: fixed; inset: 0; background: rgba(28,39,38,.25); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 31; box-shadow: -8px 0 30px rgba(0,0,0,.12); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { padding: 16px 20px 8px; display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.drawer .pages { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 20px 10px; border-bottom: 1px solid var(--line); }
.drawer .pages button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: 12.5px; }
.drawer .pages button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.drawer .text { overflow-wrap: anywhere; overflow: auto; padding: 16px 20px 40px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.65; }
.drawer mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* Modal */
.modal { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: var(--surface); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.18); padding: 22px 24px; display: grid; gap: 14px; }
.stepper { display: flex; gap: 6px; flex-wrap: wrap; }
.stepper span { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-weight: 600; }
.stepper span.on { background: var(--accent); color: #fff; }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.formgrid .full { grid-column: 1 / -1; }
.formgrid label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.toast { position: fixed; z-index: 40; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

/* v3: Excel-style column filters */

<header class="top">

<script id="case-data" type="application/json">/*CASE*/</script>
<script id="list-data" type="application/json">/*LIST*/</script>
<script id="extra-data" type="application/json">/*EXTRA*/</script>
<script id="guide-data" type="application/json">/*GUIDE*/</script>
<script>
"use strict";
const CASE = JSON.parse(document.getElementById("case-data").textContent);
const OTHERS = JSON.parse(document.getElementById("list-data").textContent);
const EXTRA = JSON.parse(document.getElementById("extra-data").textContent || "{}");
/* Guideline layer (F-27, team decision 2026-10-16): verbatim statements with full citation; never invented. */
/* What the server would hold. The page never reads it directly: it goes through api.guidance(), so swapping
   the stub for fetch(`/api/cases/${id}/guidance`) is the only change a real backend needs. */
const SERVER_GUIDANCE = JSON.parse(document.getElementById("guide-data").textContent || "{}");
const api = {
  async guidance(caseId) {
    await new Promise(r => setTimeout(r, 350));
    return caseId === "NO-010" ? SERVER_GUIDANCE : { guidelines: [], statements: [], pages: [], literature: [], queries: [], not_retrieved: [] };
  },
};
let GUIDE = {};
async function loadGuidance(p) {
  if (S.guideFor === p.id) return;
  S.guideFor = p.id; GUIDE = { loading: true };
  const res = await api.guidance(p.id);
  if (S.guideFor === p.id) { GUIDE = res; render(); }
}
const GL = id => (GUIDE.guidelines || []).find(g => g.id === id) || {};
const STMTS = () => GUIDE.statements || [];
const PAST = () => GUIDE.past_statements || [];
const anyStmt = id => STMTS().find(x => x.id === id) || PAST().find(x => x.id === id);
const citeOf = st => { const g = GL(st.guideline_id); return `${g.name || ""}, ${g.society || ""} ${g.year || ""}${g.version ? ", " + g.version : ""}; ${st.section || ""}; ${st.pdf_page ? "s. " + (st.printed_page || st.pdf_page) : "abstrakt"}`; };

const GAP = "neuvedeno v dostupné dokumentaci";
const GAP_F = "neuvedena v dostupné dokumentaci";
/* A missing value shows as "-" (team decision, round 14); the fixed wording stays in the tooltip. */
const DASH = `<span class="gapq" title="neuvedeno v dostupné dokumentaci">-</span>`;
/* Certainty labels used everywhere a fact is shown: a recorded negative, a value the OCR may have misread, an assistant inference. */
const tags = f => (f.negated ? '<span class="tag neg">zápor v dokumentu</span>' : "")
  + (f.certainty === "unclear_ocr" ? '<span class="tag ocr">ověřit čtení</span>' : "")
  + (f.certainty === "inferred" ? '<span class="tag obs">pozorování asistenta</span>' : "");
const tagsText = f => (f.negated ? " [zápor v dokumentu]" : "") + (f.certainty === "unclear_ocr" ? " [ověřit čtení]" : "") + (f.certainty === "inferred" ? " [pozorování asistenta]" : "");
const plural = (n, one, few, many) => `${n} ${n === 1 ? one : n >= 2 && n <= 4 ? few : many}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = iso => { if (!iso) return GAP; const [y, m, d] = iso.split("-"); return `${+d}. ${+m}. ${y}`; };

/* Fictional staff, configured per department (Soňa's attendance design). */
const DEPTS = [
  ["Neurochirurgie", ["MUDr. Novák", "MUDr. Dvořák"]],
  ["Klinická onkologie", ["MUDr. Svobodová", "MUDr. Malá"]],
  ["Radiační onkologie", ["MUDr. Černý", "MUDr. Horáková"]],
  ["Radiologie", ["MUDr. Procházka", "MUDr. Veselá"]],
  ["Neurologie", ["MUDr. Beneš", "MUDr. Pokorná"]],
  ["Patologie", ["MUDr. Králová", "MUDr. Němcová"]],
];
const COORD = "Bc. Marková (koordinátorka MDT)";
const ADMIN = "Ing. Kovář (správce systému)";
const USERS = ["MUDr. Svobodová", "MUDr. Novák", "MUDr. Procházka", COORD, ADMIN];

const STATUS = {
  new: ["Nový", "st-new"], scheduled: ["Naplánován", "st-scheduled"], attention: ["Vyžaduje pozornost", "st-attention"],
  ready: ["Připraven", "st-ready"], done: ["Projednán", "st-done"],
};
const ALERT = { missing: ["Chybí", "k-missing"], contradiction: ["Rozpor", "k-contradiction"], change: ["Změna", "k-change"], unclear: ["Nejasné", "k-unclear"] };

/* Calendar: seminars repeat every week (example schedule), 10-minute slots (Soňa, feedback round 2).
   Dates are handled as ISO strings at noon UTC so no time zone can shift a day. */
const WD = ["Ne", "Po", "Út", "St", "Čt", "Pá", "So"];
const MONTHS = ["leden", "únor", "březen", "duben", "květen", "červen", "červenec", "srpen", "září", "říjen", "listopad", "prosinec"];
/* One neuro-oncology MDT a week (example: Thursday 14:00-16:00); every other slot is greyed out (Soňa, round 3). */
const SEM_BY_WEEKDAY = { 4: ["14:00", "16:00", "Neuroonkologický seminář"] };
const dObj = iso => new Date(iso + "T12:00:00Z");
const isoOf = d => d.toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = dObj(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const mondayOf = iso => { const d = dObj(iso); return addDays(iso, -((d.getUTCDay() + 6) % 7)); };
const dayLabel = iso => { const d = dObj(iso); return `${WD[d.getUTCDay()]} ${d.getUTCDate()}. ${d.getUTCMonth() + 1}.`; };
const seminarOn = iso => SEM_BY_WEEKDAY[dObj(iso).getUTCDay()] || null;
const TODAY = "2026-10-16";
const TIMES = []; for (let h = 12; h < 17; h++) for (let m = 0; m < 60; m += 10) TIMES.push(`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`);
const SLOT_MIN = 10;
const slotEnd = t => { const [h, m] = t.split(":").map(Number), x = h * 60 + m + SLOT_MIN; return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; };

/* Patients: identity from the documents; owner, department and slot are example values where the documents are silent. */
const extraOthers = Object.fromEntries((EXTRA.others || []).map(o => [o.file, o]));
const nr = file => String(file).replace("_pacient.pdf", "");
const caseId = file => `NO-${nr(file).padStart(3, "0")}`;
const ownerFor = i => DEPTS[i % 2 === 0 ? 1 : 0][1][i % 2];
function initialPatients() {
  const p10 = {
    file: CASE.file, name: CASE.patient.name, nameAsWritten: CASE.patient.name_as_written, rc: CASE.patient.birth_number || null, birth: CASE.patient.birth_date || null, age: CASE.patient.age || null,
    /* Database format (Soňa, round 3): histology and TNM; the second line says the TNM is from diagnosis and why the case is here now. */
    diagnosis: EXTRA.diagnosis_headline ? `${EXTRA.diagnosis_headline.histology_cs}, ${EXTRA.diagnosis_headline.tnm_cs.replace("(", " (")}` : "Světlobuněčný karcinom ledviny",
    diagnosisNote: "pTNM při diagnóze 6/2022 · nyní susp. MTS v mozečku", mkn10: CASE.diagnosis?.code || null,
    question: CASE.mdt_question.text_cs, purpose: CASE.mdt_question.closest_source?.quote, explicit: !!CASE.mdt_question.text_cs,
    status: "ready", slot: { day: "2026-10-22", time: "14:00" }, updated: "2026-10-16", full: true,
  };
  const slots = [["2026-10-22", "14:10"], ["2026-10-22", "14:20"], ["2026-10-22", "14:30"], ["2026-10-22", "14:40"], null, ["2026-10-22", "14:50"], null, ["2026-10-22", "15:00"], null];
  const others = OTHERS.map((o, i) => {
    const ex = extraOthers[o.file] || {};
    const slot = slots[i] ? { day: slots[i][0], time: slots[i][1] } : null;
    const hasQ = o.mdt_question_cs && o.mdt_question_explicit !== false;
    return {
      file: o.file, name: o.name,
      birth: /\d{1,2}\.\d{1,2}\.\d{4}/.test(o.age_or_birth || "") ? o.age_or_birth.replace(/^nar\.\s*/, "") : null,
      age: /let/.test(o.age_or_birth || "") ? o.age_or_birth : null,
      warn: /ověřit identitu|prohozen/i.test(o.note || "") ? o.note : null,
      diagnosis: ex.diagnosis_cs || o.main_problem_cs, mkn10: ex.mkn10 || null,
      question: hasQ ? o.mdt_question_cs : null, purpose: o.mdt_question_cs, explicit: !!hasQ,
      summary: o.one_line_summary_cs, pages: o.page_count,
      referrer: ex.referring_doctor || null, dept: ex.referring_department || null,
      status: !slot ? "new" : /ověřit identitu|useknut/i.test(o.note || "") ? "attention" : "scheduled", slot, updated: "2026-10-15",
    };
  });
  return [p10, ...others].map((p, i) => ({
    ...p, id: caseId(p.file),
    owner: p.referrer || ownerFor(i), ownerExample: !p.referrer,
    /* Date the case was submitted to the MDT; the documents do not state it, so it is an example value. */
    submitted: addDays("2026-10-15", -[1, 3, 5, 8, 12, 15, 19, 26, 33, 40][i % 10]), submittedExample: true,
    dept: p.dept || ["Nemocnice Havířov, neurologie", "Slezská nemocnice v Opavě, onkologie", "Nemocnice Karviná-Ráj, neurochirurgie", "FN Ostrava, Klinika onkologická"][i % 4], deptExample: !p.dept,
  }));
}

const S = {
  view: "patients", pid: CASE.file, tab: "overview", brief: "brief", user: USERS[0],
  patients: initialPatients(), q: "", colf: {}, colOpen: null, editLog: [], subFrom: "", subTo: "", dbPage: 0, dbAll: false,
  week: mondayOf("2026-10-22"), miniMonth: "2026-10", labMode: "doc", guideOn: true, labSel: null, edits: {},
  selTl: null, picked: new Set(["summary", "imaging", "histology", "past_treatment"]),
  acks: {}, access: [], decisions: [], tasks: [
    { id: 1, pid: "2_pacient.pdf", text: "doplnit pooperační MR do podkladů", who: COORD, due: "2026-10-21", done: false },
    { id: 2, pid: "13_pacient.pdf", text: "vyžádat snímky MR 8/2025 ke srovnání", who: COORD, due: "2026-10-21", done: true },
  ],
  mails: [], protos: {}, attByDay: {}, schedPick: null, calPop: null, overlay: null, tlScroll: 0, openFind: new Set(), taskScope: "mine",
};
const P = id => S.patients.find(p => p.file === id);

/* ---------- small UI helpers ---------- */
/* Identity as the MDT team reads it (Soňa, round 3): surname first, then the birth number. No FNO document
   in the challenge data contains a birth number, so it shows as not stated; never invented. */
const lastMdt = p => { const d = S.decisions.filter(x => x.pid === p.file); return d.length ? d[d.length - 1].when.split(",")[0] : null; };
const surnameFirst = p => p.nameAsWritten || (p.name.includes(" ") ? p.name.split(" ").slice(-1)[0] + " " + p.name.split(" ").slice(0, -1).join(" ") : p.name);
const rcText = p => p.rc || "-";
/* Age as a bare number (round 4); from a stated age, or computed from a stated birth date. */
const ageNum = p => { const t = ageText(p); return t ? t.replace(/\s*let$/, "") : null; };
const ageText = p => p.age ? p.age : p.birth ? (() => { const [d, m, y] = p.birth.split(".").map(Number); const t = dObj(TODAY); let a = t.getUTCFullYear() - y; if (t.getUTCMonth() + 1 < m || (t.getUTCMonth() + 1 === m && t.getUTCDate() < d)) a--; return `${a} let`; })() : null;
const statusChip = p => `<span class="chip ${STATUS[p.status][1]}">${STATUS[p.status][0]}</span>`;
const slotText = p => p.slot ? `${dayLabel(p.slot.day)} ${p.slot.day.slice(0, 4)} · ${p.slot.time}-${slotEnd(p.slot.time)}` : "nenaplánováno";

/* Doctor edits (Soňa: "everything editable"). An edit never changes the source document or the
   extracted value; it is stored next to it with who and when, and the UI marks it as edited. */
/* Edits are keyed per patient, so one patient's correction can never show up on another's case. */
const EK = (key, pid = S.pid) => `${pid}|${key}`;
const edOf = (key, pid = S.pid) => S.edits[EK(key, pid)];
function ed(key, orig, opts = {}) {
  const e = edOf(key);
  const text = e ? e.text : orig;
  const shown = opts.html && !e ? opts.html : esc(text ?? "");
  const tag = e ? `<span class="edtag" title="Upravil(a) ${esc(e.by)}, ${esc(e.when)}. Původně: ${esc(orig || GAP)}">upraveno</span>` : "";
  const btn = isDoctor(S.user) ? `<button class="edbtn" data-edit="${esc(EK(key))}" data-orig="${esc(orig ?? "")}" aria-label="Upravit" title="Upravit">✎</button>` : "";
  return `<span class="${e ? "edited" : ""}">${shown}</span>${tag}${btn}`;
}
const edText = (key, orig, pid = S.pid) => edOf(key, pid) ? edOf(key, pid).text : orig;
/* In the report an edited value is marked, so it is never read as if the cited source said it. */
const edRep = (key, orig, pid = S.pid) => edOf(key, pid) ? `${edOf(key, pid).text} [upraveno lékařem]` : orig;

/* Quiet certainty markers: an icon with a tooltip instead of a grey comment line (Soňa, round 2).
   The meaning is still shown on every fact, as CLAUDE.md requires; only the wording moved into the tooltip. */
function marks(f) {
  let h = "";
  if (f.negated) h += `<span class="mk neg" title="Zápor zapsaný v dokumentu">-</span>`;
  if (f.certainty === "unclear_ocr" || f.ocr_note_cs) h += `<span class="mk ocr" title="Ověřit čtení: ${esc(f.ocr_note_cs || f.note || "text mohl být špatně přečten")}">!</span>`;
  if (f.certainty === "inferred") h += `<span class="mk obs" title="Pozorování asistenta, v dokumentu výslovně není">i</span>`;
  if (f.certainty === "planned" || f.change_status === "planned_unconfirmed" || /plánováno/i.test(f.change_cs || "")) h += `<span class="mk plan" title="Plánováno, dokument neuvádí, že se stalo${f.note_cs ? ": " + esc(f.note_cs) : ""}">?</span>`;
  /* Any other assistant note (source discrepancy, unclear exam) stays reachable as an icon, not as row text (round 5). */
  if (f.note_cs && f.certainty !== "conflicting" && f.change_status !== "planned_unconfirmed" && f.certainty !== "planned") h += `<span class="mk obs" title="Poznámka asistenta: ${esc(f.note_cs)}">i</span>`;
  if (f.certainty === "conflicting") h += `<span class="mk ocr" style="background:var(--conflict-soft);color:var(--conflict)" title="Rozpor mezi dokumenty${f.note_cs ? ": " + esc(f.note_cs) : ""}">≠</span>`;
  return h;
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function logAccess(pid, what) { S.access.unshift({ pid, what, who: S.user, when: new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) }); }

/* Paper-style references: each view numbers its sources [1], [2] in order of first use. */
function refRegistry() {
  const list = [];
  const key = r => `${r.file}|${r.page}|${r.quote}`;
  return {
    list,
    /* No [n] markers in the text (Soňa, round 14): sources are registered for the list, and the text opens them. */
    n(r) { if (!r) return ""; if (list.findIndex(x => key(x) === key(r)) < 0) list.push(r); return ""; },
    wrap(html, r) { if (!r) return html; this.n(r); return `<span class="srcl" data-src='${esc(JSON.stringify(r))}' title="Otevřít zdroj">${html}</span>`; },
    html() { return list.length ? `<ol class="refs">${list.map(r => `<li><button data-src='${esc(JSON.stringify(r))}'>${esc(docTitle(r))}, s. ${esc(r.page)}: „${esc(r.quote.length > 90 ? r.quote.slice(0, 90) + "…" : r.quote)}“</button></li>`).join("")}</ol>` : ""; },
  };
}
/* Prose with [n] markers: each clause before a marker becomes a link to that source. */
function linkProse(text, refs, reg) {
  const parts = String(text || "").split(/\s*\[(\d+)\]/);
  let out = "", carry = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { carry += parts[i]; continue; }
    const r = (refs || [])[+parts[i] - 1];
    if (carry.trim()) { const lead = carry.match(/^[\s;,.:]*/)[0]; out += esc(lead) + reg.wrap(esc(carry.slice(lead.length)), r); carry = ""; } else reg.n(r);
  }
  return out + esc(carry);
}
function docTitle(r) {
  const d = (EXTRA.documents || []).find(d => (d.pages || []).includes(r.page));
  return d ? d.title_cs : r.file;
}

/* Excel-style filters: each filterable column header opens a list of its values (Soňa, round 2). */
const READ_CS = { good: "Dobře čitelné", fair: "Částečně čitelné", poor: "Špatně čitelné" };
const COLS = [
  ["owner", "Vlastník", p => p.owner],
  ["dept", "Odesílající pracoviště", p => p.dept],
  ["slot", "Příští MDT", p => p.slot ? `${dayLabel(p.slot.day)} ${p.slot.day.slice(0, 4)}` : "nenaplánováno"],
  ["status", "Stav", p => STATUS[p.status][0]],
];
const DCOLS = [
  ["dtype", "Typ", d => d.type],
  ["dyear", "Rok", d => (String(d.date || "").match(/\d{4}/) || ["bez data"])[0]],
  ["dread", "Čitelnost", d => READ_CS[d.readability] || d.readability],

/* One filter mechanism for every table: [key, title, getter] plus the rows it filters. */
const colDef = key => { const c = COLS.find(x => x[0] === key); if (c) return { get: c[2], items: S.patients }; const dc = DCOLS.find(x => x[0] === key); return { get: dc[2], items: EXTRA.documents || [] }; };
const passes = (defs, row) => defs.every(([k, , get]) => !S.colf[k] || S.colf[k].includes(get(row)));
function colHead(key, title) {
  const col = colDef(key), f = S.colf[key];
  const values = [...new Set(col.items.map(col.get))].sort((a, b) => String(a).localeCompare(String(b), "cs"));
  const pop = S.colOpen === key ? `<div class="fpop" role="dialog" aria-label="Filtr ${esc(title)}">
      <label><input type="checkbox" data-colall="${key}" ${!f ? "checked" : ""}> <b>(Vše)</b></label>
      ${values.map(v => `<label><input type="checkbox" data-colv="${key}" value="${esc(v)}" ${!f || f.includes(v) ? "checked" : ""}> ${esc(v)}</label>`).join("")}
      <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn small" data-colclose="1">Hotovo</button></div></div>` : "";
  return `<th class="th-wrap"><button class="th-f ${f ? "on" : ""}" data-colopen="${key}" aria-expanded="${S.colOpen === key}">${title}<span class="fi" aria-hidden="true">▼</span></button>${pop}</th>`;
}
function viewPatients() {

  const rows = S.dbAll ? all : all.slice(S.dbPage * PER, S.dbPage * PER + PER);

    </div>
    <div class="card" style="padding:0"><div class="scroll" style="min-height:${S.colOpen ? 360 : 0}px"><table class="tbl">
      <thead><tr><th>ID</th><th>Pacient</th><th>RČ</th><th>Věk</th><th>Diagnóza</th>${colHead("owner", "Vlastník")}${colHead("dept", "Odesílající pracoviště")}${colHead("slot", "Příští MDT")}<th>Předchozí MDT</th>${colHead("status", "Stav")}<th>Podáno</th></tr></thead>
      <tbody>${rows.map(p => `<tr class="click" data-open="${esc(p.file)}">

        <td class="num ${p.rc ? "" : "muted"}" title="${p.rc ? "" : "Rodné číslo " + GAP}">${esc(rcText(p))}</td><td class="num ${ageNum(p) ? "" : "muted"}" ${!p.age && p.birth ? 'title="vypočteno z data narození"' : ""}>${esc(ageNum(p) || "-")}</td>
        <td><b style="font-weight:600">${esc(p.diagnosis)}</b>${p.diagnosisNote || p.mkn10 ? `<div class="muted small">${esc([p.diagnosisNote, p.mkn10].filter(Boolean).join(" · "))}</div>` : ""}</td>
        <td>${esc(p.owner)}</td>
        <td>${esc(p.dept)}</td>
        <td class="num">${p.slot ? esc(slotText(p)) : `<button class="linkbtn" data-sched="${esc(p.file)}">Naplánovat</button>`}</td>
        <td class="num ${lastMdt(p) ? "" : "muted"}" title="${lastMdt(p) ? "" : "Předchozí MDT " + GAP}">${esc(lastMdt(p) || "-")}</td>
        <td>${statusChip(p)}</td><td class="num">${fmtDate(p.submitted)}</td></tr>`).join("") || `<tr><td colspan="12" class="muted">Žádný pacient neodpovídá filtru.</td></tr>`}</tbody>

      <span class="row">${S.dbAll ? `<button class="btn small" data-act="dbpaged">Stránkovat</button>` : `<button class="btn small" data-dbpage="${S.dbPage - 1}" ${S.dbPage ? "" : "disabled"}>‹ Předchozí</button>${Array.from({ length: pages }, (_, i) => `<button class="btn small ${i === S.dbPage ? "primary" : ""}" data-dbpage="${i}">${i + 1}</button>`).join("")}<button class="btn small" data-dbpage="${S.dbPage + 1}" ${S.dbPage < pages - 1 ? "" : "disabled"}>Další ›</button>${all.length > PER ? `<button class="btn small" data-act="dball">Zobrazit vše (+${all.length - rows.length})</button>` : ""}`}</span></div></div>

  </div>`;
}

/* ---------- 2. MDT calendar ---------- */
/* Google-calendar-like navigation (Soňa, round 2): week arrows, a month grid to jump anywhere, a year picker. */
function miniMonth() {
  const [y, m] = S.miniMonth.split("-").map(Number);
  const first = `${S.miniMonth}-01`, start = mondayOf(first);
  const weekEnd = addDays(S.week, 6);
  let cells = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"].map(d => `<span class="wd">${d}</span>`).join("");
  for (let i = 0; i < 42; i++) {
    const iso = addDays(start, i), d = dObj(iso);
    if (i >= 35 && d.getUTCMonth() + 1 !== m) break;
    cells += `<button data-jump="${iso}" class="${d.getUTCMonth() + 1 !== m ? "out" : ""} ${iso >= S.week && iso <= weekEnd ? "wk" : ""} ${seminarOn(iso) ? "sem" : ""}" aria-label="${iso}">${d.getUTCDate()}</button>`;
  }
  const years = [2024, 2025, 2026, 2027, 2028];
  return `<div class="card"><div class="row spread" style="margin-bottom:8px"><button class="btn small" data-mm="-1" aria-label="Předchozí měsíc">‹</button>
      <span class="row"><b>${MONTHS[m - 1]}</b><select class="input" id="mmyear" style="width:auto;padding:3px 6px" aria-label="Rok">${years.map(v => `<option ${v === y ? "selected" : ""}>${v}</option>`).join("")}</select></span>
      <button class="btn small" data-mm="1" aria-label="Další měsíc">›</button></div>
    <div class="mini">${cells}</div>
    <p class="muted small" style="margin:8px 0 0">Tečka = den semináře. Kliknutím na den přejdete na jeho týden.</p></div>`;
}

      <div><span class="label">Diagnóza</span><p style="margin:2px 0 0;font-weight:700">${esc(pop.full ? dxHeadlineText() : pop.diagnosis)}</p></div>
      <div class="question ${pop.explicit || edOf("q", pop.file) ? "" : "missing"}" style="padding:8px 12px"><span class="label">Otázka pro MDT</span><p style="font-size:14px">${esc(questionText(pop))}</p></div>
      ${pop.full ? `<p class="small" style="margin:0">${esc(briefPlain().slice(0, 260))}…${edOf("brief", CASE.file) ? " (upraveno lékařem)" : ""}</p>` : `<p class="small" style="margin:0">${esc(pop.summary || "")}</p>`}

  const end = addDays(S.week, 4);

      <p class="prose">${esc(p.summary || "")}</p>
      <p class="muted small">Plně zpracovaný je v maketě případ NO-010. Zdroj: ${esc(p.file)}, ${p.pages || "?"} s.</p></section></div>`;
}

/* ---------- 4. MDT presentation (projector) ---------- */
const FIND = [["clinical_finding", "Klinický nález"], ["imaging", "Zobrazovací vyšetření"], ["histology", "Histologie"], ["past_treatment", "Prodělaná léčba"], ["current_state", "Aktuální stav"]];
/* Presentation keeps the brief/detailed switch: the brief for the room, the detail on demand. */
function presentSummary(reg) {
  const seg = `<span class="seg" role="group" aria-label="Úroveň detailu"><button data-brief="brief" aria-pressed="${S.brief === "brief"}">MDT brief</button><button data-brief="detailed" aria-pressed="${S.brief === "detailed"}">Detailní</button></span>`;
  if (S.brief === "detailed") return detailedCard(reg, true).replace('<div class="head"><h2>Onkologický souhrn</h2>', `<div class="head"><h2>Onkologický souhrn</h2>${seg}`);
  return `<section class="card"><div class="head"><h2>Shrnutí (30 až 60 s)</h2><label class="small muted"><input type="checkbox" data-pickrep="summary" ${S.picked.has("summary") ? "checked" : ""}> do reportu</label>${seg}</div>
    <p class="prose">${briefHtml(reg)}</p>${srcList(reg)}</section>`;
}
function viewPresent() {
  const p = P(S.pid);
  const agenda = S.patients.filter(x => x.slot && x.slot.day === (p.slot?.day || "2026-10-22")).sort((a, b) => a.slot.time.localeCompare(b.slot.time));
  const reg = refRegistry();
  const finds = FIND.map(([k, t]) => { const items = CASE.sections[k] || []; return `<details class="find" data-find="${k}" ${S.openFind.has(k) ? "open" : ""}><summary><span class="ttl">${t}</span><span class="cnt">${items.length || GAP}</span>
      <label class="pick" onclick="event.stopPropagation()"><input type="checkbox" data-pickrep="${k}" ${S.picked.has(k) ? "checked" : ""}> do reportu</label></summary>
      <ul>${items.map(f => `<li><span class="dt">${esc(f.date || "")}</span>${esc(f.text_cs)}${tags(f)}${reg.n(f.source)}${f.certainty !== "documented" && f.note ? `<span class="note">${esc(f.note)}</span>` : ""}</li>`).join("")}</ul></details>`; }).join("");
  return `<div class="present"><div class="page">
    <div class="row spread"><div class="agenda" aria-label="Pořadí na semináři">${agenda.map(a => `<button data-present="${esc(a.file)}" aria-current="${a.file === p.file}">${a.slot.time} · ${a.id}</button>`).join("")}</div>
      <div class="row"><button class="btn" data-go="patient">Zavřít prezentaci</button><button class="btn primary" data-go="protocol">Protokol MDT ›</button></div></div>
    ${p.full ? `${patientHeader(p, "", true)}
    <div class="grid2"><div class="stack">${presentSummary(reg)}</div>
      <div class="stack">${finds}</div></div>
    ${timelineCard()}` : `${patientHeader(p, "", true)}<section class="card"><p class="prose">${esc(p.summary || "")}</p><p class="muted small">V maketě nezpracováno.</p></section>`}
  </div></div>`;
}

/* ---------- 5. MDT protocol ---------- */
/* One protocol per patient; attendance belongs to the whole seminar, so it is entered once. */
function ensureProto(p) {
  if (!S.protos[p.file]) S.protos[p.file] = { pid: p.file, mode: "manual", notes: "", concl: "", steps: [], state: "draft" };
  return S.protos[p.file];
}
/* Attendance is entered once per seminar day and applies to every case that day (Soňa, rounds 1 and 2). */
const attDay = () => P(S.pid)?.slot?.day || `bez termínu: ${S.pid}`;
function attFor(day = attDay()) { if (!S.attByDay[day]) S.attByDay[day] = Object.fromEntries(DEPTS.map(([d]) => [d, [""]])); return S.attByDay[day]; }
const presentList = () => Object.values(attFor()).flat().filter(Boolean);
const isDoctor = u => u.startsWith("MUDr.");
function viewProtocol() {
  if (P(S.pid).full) loadGuidance(P(S.pid));
  const p = P(S.pid), pr = ensureProto(p);
  const present = presentList();
  const locked = pr.state === "approved";
  const named = pr.steps.filter(x => x.text.trim());
  const stepsDone = [!!pr.concl.trim(), named.length > 0, locked];
  const assignees = [COORD, p.owner, ...present].filter((v, i, a) => a.indexOf(v) === i);
  const canApprove = isDoctor(S.user) && present.includes(S.user);
  const versions = S.decisions.filter(d => d.pid === p.file).length;
  return `<div class="page">
    <div class="row spread"><button class="linkbtn" data-go="patient">‹ ${esc(p.id)} · ${esc(p.name)}</button>
      <span class="chip ${locked ? "st-done" : "st-scheduled"}">${locked ? "Schváleno" : versions ? `Koncept nového závěru (předchozí: č. ${versions})` : "Probíhá · koncept"}</span></div>
    <div class="pagehead"><div><h1>Protokol MDT</h1><div class="muted small">${esc(slotText(p))} · Neuroonkologický seminář</div></div>
      <div class="row"><button class="btn" data-go="present">‹ Zpět do prezentace</button>${locked ? `<button class="btn" data-act="newversion">Nový závěr (nahradí platný)</button>` : ""}</div></div>
    <div class="grid2"><div class="stack">
      <section class="card"><div class="head"><h2>Přítomní na semináři</h2><span class="row"><span class="muted small">${plural(locked ? (pr.attSnap || []).length : present.length, "lékař", "lékaři", "lékařů")}</span><button class="btn small" data-act="copyatt">Kopírovat</button></span></div>
        ${locked ? `<p style="margin:0">${esc((pr.attSnap || []).join(", ") || "nezadáno")}</p><p class="muted small" style="margin:6px 0 0">Uzamčeno schválením závěru ${esc(pr.when)}.</p>` : `<div class="att">${DEPTS.map(([d, docs]) => attFor()[d].map((v, k) => `<span class="dept">${k === 0 ? d : ""}</span>
          <select class="input" data-att="${esc(d)}" data-k="${k}" aria-label="${esc(d)}"><option value="">${k === 0 ? "nepřítomen" : "odebrat"}</option>${docs.map(x => `<option ${v === x ? "selected" : ""} ${attFor()[d].includes(x) && v !== x ? "disabled" : ""}>${esc(x)}</option>`).join("")}</select>
          ${k === 0 ? `<button class="btn small" data-addatt="${esc(d)}" ${attFor()[d].length >= docs.length ? "disabled" : ""}>+ další</button>` : "<span></span>"}`).join("")).join("")}</div>`}
        <p class="muted small" style="margin:10px 0 0">${p.slot ? `Platí pro celý den (${esc(dayLabel(p.slot.day) + " " + p.slot.day.slice(0, 4))}), pro všechny případy semináře.` : "Pacient nemá termín; přítomnost platí jen pro tento případ."} Jména jsou smyšlená; v reálné aplikaci se personál spravuje v nastavení pracoviště.</p></section>
      <section class="card"><div class="head"><h2>Záznam diskuse</h2></div>
        <div class="seg2" role="group"><button data-mode="manual" aria-pressed="${pr.mode === "manual"}">Ruční poznámky</button><button data-mode="ai" aria-pressed="${pr.mode === "ai"}">AI záznam</button></div>
        ${pr.mode === "manual" ? `<label class="label" for="notes" style="display:block;margin:12px 0 6px">Průběžné poznámky</label>
          <textarea class="input" id="notes" placeholder="Poznámky z diskuse" ${locked ? "disabled" : ""}>${esc(pr.notes)}</textarea>`
        : `<div class="rec"><b>AI záznam diskuse</b><span class="small muted">Se souhlasem účastníků systém zaznamená zvuk a připraví návrh závěru a dalších kroků k potvrzení lékařem. Vyžaduje souhlas FNO se službou přepisu.</span>
          <span class="chip plain st-new">Plánovaná funkce</span><span class="small muted">Zvuk se nezaznamenává.</span></div>`}
      </section>
      <section class="card" style="display:none"><div class="head"><h2>Závěr MDT</h2><span class="muted small">Píše lékař; asistent závěr nenavrhuje</span></div>
        <textarea class="input" id="concl" placeholder="Závěr a další postup" ${locked ? "disabled" : ""}>${esc(pr.concl)}</textarea></section>
      <section class="card"><div class="head"><h2>Další kroky</h2><span class="row"><span class="muted small">${plural(named.length, "úloha", "úlohy", "úloh")}</span><button class="btn small" data-act="copytasks" ${named.length ? "" : "disabled"}>Kopírovat úlohy</button></span></div>
        <div class="tasklist">${pr.steps.map((x, i) => `<div class="task"><input class="input" data-step="${i}" data-f="text" value="${esc(x.text)}" placeholder="Úloha" ${locked ? "disabled" : ""}>
          <select class="input" data-step="${i}" data-f="who" ${locked ? "disabled" : ""}>${assignees.map(a => `<option ${x.who === a ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
          <input class="input" type="date" data-step="${i}" data-f="due" value="${esc(x.due)}" ${locked ? "disabled" : ""}>
          ${locked ? "" : `<button class="btn small" data-delstep="${i}" aria-label="Odebrat úlohu">✕</button>`}</div>`).join("")}</div>
        ${locked ? "" : `<button class="btn small" data-act="addstep" style="margin-top:10px">+ Přidat úlohu</button>`}</section>
    </div><div class="stack">
      <section class="card"><div class="head"><h2>Po diskusi</h2></div>
        <ol class="steps">
          <li><span class="s ${stepsDone[0] ? "done" : ""}">1</span><span><b>Závěr MDT</b><br><span class="muted small">Zapsaný lékařem</span></span></li>
          <li><span class="s ${stepsDone[1] ? "done" : ""}">2</span><span><b>Další kroky a odpovědnosti</b><br><span class="muted small">Úlohy s odpovědnou osobou a termínem</span></span></li>
          <li><span class="s ${stepsDone[2] ? "done" : ""}">3</span><span><b>Kontrola a schválení lékařem</b><br><span class="muted small">Až po schválení vzniknou úlohy a report</span></span></li></ol>
        ${locked ? `<p class="small" style="margin:12px 0 0">Schválil(a) <b>${esc(pr.approver)}</b> · ${esc(pr.when)}</p>` : `
        <p class="small" style="margin:14px 0 6px">Schvaluje přihlášený lékař, který je označen jako přítomný: <b>${esc(S.user)}</b></p>
        <button class="btn primary" data-act="approve" style="width:100%" ${stepsDone[0] && canApprove ? "" : "disabled"}>Schválit závěr jako ${esc(S.user)}</button>
        <p class="muted small" style="margin:8px 0 0">${!stepsDone[0] ? "Nejdřív zapište závěr. " : ""}${!isDoctor(S.user) ? "Závěr schvaluje lékař; koordinátorka schvalovat nemůže. " : !present.includes(S.user) ? "Označte se jako přítomný(á) v seznamu přítomných. " : ""}</p>`}
      </section>
      ${locked ? `<section class="card"><div class="head"><h2>Odeslané upozornění</h2></div>${S.mails.filter(m => m.pid === p.file).map(mailHtml).join("") || `<p class="muted small">Bez úloh, upozornění se neodesílá.</p>`}</section>` : ""}
      <section class="card"><div class="head"><h2>Report (PDF)</h2></div><p style="margin:0"><button class="btn primary" data-act="download">Stáhnout report (PDF)</button></p>
      <details class="srcs"><summary>Náhled reportu</summary><div id="report">${locked && pr.reportSnap ? pr.reportSnap : reportHtml(p, pr, present)}</div></details>${locked ? `<p class="muted small" style="margin:8px 0 0">Report je uzamčen ve stavu při schválení. Pozdější úpravy se do něj nepromítnou; změna vyžaduje nový závěr.</p>` : ""}</section>
    </div></div></div>`;
}
/* Deviations from the quoted statements: the doctors record them; the assistant does not judge the plan (F-27). */
const DEV = { "": "nevyplněno", follows: "v souladu", deviates: "záměrná odchylka", na: "neuplatňuje se" };
function devTable(p, pr, locked) {
  pr.dev = pr.dev || {};
  return `<section class="card"><div class="head"><h2>Odchylky od doporučení</h2><span class="muted small">Vyplňuje MDT; asistent plán nehodnotí</span></div>
    <div class="scroll"><table class="tbl devt"><thead><tr><th>Doporučení</th><th style="width:160px">Postup MDT</th><th style="width:34%">Důvod odchylky</th></tr></thead><tbody>
    ${STMTS().filter(st => st.type !== "guideline_text").map(st => { const d = pr.dev[st.id] || {}; return `<tr><td><span class="small"><q>${esc(st.quote)}</q></span><span class="note">${esc(citeOf(st))}</span></td>
      <td><select class="input" data-dev="${esc(st.id)}" ${locked ? "disabled" : ""}>${Object.entries(DEV).map(([k, t]) => `<option value="${k}" ${(d.s || "") === k ? "selected" : ""}>${t}</option>`).join("")}</select></td>
      <td>${d.s === "deviates" ? `<input class="input" data-devwhy="${esc(st.id)}" value="${esc(d.why || "")}" placeholder="Proč se MDT odchyluje" ${locked ? "disabled" : ""}>${!locked && !(d.why || "").trim() ? '<span class="note" style="color:var(--missing)">Uveďte důvod.</span>' : ""}` : '<span class="muted small">-</span>'}</td></tr>`; }).join("")}</tbody></table></div></section>`;
}
function mailHtml(m) {
  return `<div class="mail"><div class="row"><b>✉ MDT - nové úlohy ke zpracování</b></div><p class="small" style="margin:6px 0">Komu: ${esc(COORD)}</p>
    <p style="margin:0">K případu ${esc(m.id)} ${m.n === 1 ? "byla přiřazena 1 nová úloha" : m.n <= 4 ? `byly přiřazeny ${m.n} nové úlohy` : `bylo přiřazeno ${m.n} nových úloh`}. Otevřete zabezpečenou aplikaci MDT Workspace a potvrďte převzetí.</p>
    <p style="margin:6px 0 0">Odkaz: <span class="num">https://mdt.fno.local/pripad/${esc(m.id)}</span> <span class="muted small">(ukázková interní adresa)</span></p>
    <p class="muted small" style="margin:6px 0 0">E-mail obsahuje jen ID případu a odkaz, žádné zdravotní údaje.</p></div>`;
}
function reportHtml(p, pr, present) {
  const reg = refRegistry();
  const refTxt = r => r ? ` [${reg.n(r).replace(/<[^>]+>/g, "").replace(/[\[\]]/g, "")}]` : "";
  const line = f => `<li>${f.date ? esc(f.date) + ": " : ""}${esc(f.text_cs)}${esc(tagsText(f))}<span class="src">${refTxt(f.source)}</span></li>`;
  /* Report anamnesis (Soňa, round 2): diagnoses stand out in bold, qualifiers stay plain text. */
  const A = A3();
  const mt = f => (f.negated ? " [zápor v dokumentu]" : "") + (f.ocr_note_cs || f.certainty === "unclear_ocr" ? " [ověřit čtení]" : "") + (f.certainty === "inferred" ? " [pozorování asistenta]" : "")
    + (f.certainty === "conflicting" ? ` [rozpor mezi dokumenty${f.note_cs ? ": " + f.note_cs : ""}]` : "") + (f.change_status === "planned_unconfirmed" ? " [plánováno, neověřeno]" : "");
  const rf = f => (f.refs || []).map(j => `<span class="src">${refTxt(R3(j))}</span>`).join("");
  const anyEd = keys => keys.some(k => edOf(k, p.file));
  const anamItem = (k, f, i) => k === "FA"
    ? `${esc(edRep(`fa:${i}:line`, drugLine(f), p.file))}${drugNote(f) || edOf(`fa:${i}:note`, p.file) ? ` (${esc(edRep(`fa:${i}:note`, drugNote(f), p.file))})` : ""}${esc(mt(f))}${rf(f)}`
    : `${f.term_cs ? `<b>${esc(edRep(`${k}:${i}:t`, f.term_cs, p.file))}</b>` : ""}${f.comment_cs ? `${f.term_cs ? ", " : ""}${esc(edRep(`${k}:${i}:c`, f.comment_cs, p.file))}` : ""}${esc(mt(f))}${rf(f)}`;
  /* Every section is listed; an empty one prints the gap wording (allergies must never just vanish). */
  const anamLines = ANAM.map(([k, t]) => `<li><span style="text-decoration:underline">${t}:</span> ${(A[k] || []).length ? A[k].map((f, i) => anamItem(k, f, i)).join("; ") : GAP}${k === "FA" && (A.FA_warnings || []).length ? `<br><b>Pozor:</b> ${A.FA_warnings.map((f, i) => anamItem("faw", f, i)).join("; ")}` : ""}</li>`).join("");
  const brief = edOf("brief", p.file) ? esc(briefPlain()) + " [upraveno lékařem]" : BRIEF_CS ? esc(BRIEF_CS).replace(/\[(\d+)\]/g, (m, n) => `<span class="src">${refTxt((BRIEF_REFS || [])[n - 1])}</span>`) : esc(CASE.summary.map(x => x.text_cs).join(" "));
  return `<article class="sheet">
    <div class="hdr"><div><b>Fakultní nemocnice Ostrava</b><br>Protokol neuroonkologického MDT (maketa)</div><div>${esc(slotText(p))}</div></div>
    <h4>Pacient</h4><p>${esc(surnameFirst(p))} · RČ: ${esc(p.rc || GAP)} · věk: ${esc(ageNum(p) || GAP)} · ID ${esc(p.id)}</p>
    <h4>Anamnéza</h4>${anamLines ? `<ul>${anamLines}</ul>` : `<p>${GAP}</p>`}
    ${S.picked.has("summary") ? `<h4>Onkologický souhrn (sestavil asistent)</h4><p>${brief}</p>` : ""}
    ${FIND.filter(([k]) => S.picked.has(k)).map(([k, t]) => `<h4>${t}</h4><ul>${(CASE.sections[k] || []).map(line).join("") || `<li>${GAP}</li>`}</ul>`).join("")}
    <h4>Přítomní</h4><p>${esc(present.join(", ") || "nezadáno")}</p>
    <h4>Diagnóza</h4><p><b>${esc(p.full ? dxHeadlineText(true) : p.diagnosis)}</b>${p.full && DXH()?.mkn_cs ? `<br>${esc(DXH().mkn_cs)}` : ""}</p>
    <h4>Dotaz</h4><p>${esc(edOf("q", p.file) ? questionText(p) + (p.explicit ? " [upraveno lékařem]" : " [doplněno lékařem]") : p.explicit ? p.question : `Výslovná otázka ${GAP_F}. Účel dle dokumentu: ${p.purpose || ""}`)}</p>
    <h4>Závěr</h4><p id="rep-concl">${esc(pr.concl || "Zatím nezapsán.")}</p>
    <h4>Další kroky</h4>${pr.steps.filter(x => x.text.trim()).length ? `<ul>${pr.steps.filter(x => x.text.trim()).map(x => `<li>${esc(x.text)} · ${esc(x.who)} · do ${esc(fmtDate(x.due))}</li>`).join("")}</ul>` : "<p>Žádné.</p>"}
    ${p.full && S.guideOn && STMTS().length ? `<h4>Odchylky od doporučení</h4>${STMTS().filter(st => (pr.dev || {})[st.id]?.s).length ? `<ul>${STMTS().filter(st => (pr.dev || {})[st.id]?.s).map(st => { const d = pr.dev[st.id]; return `<li>${esc(st.quote)} <span class="src">(${esc(citeOf(st))})</span>: <b>${DEV[d.s]}</b>${d.s === "deviates" ? `, důvod: ${esc(d.why || "neuveden")}` : ""}</li>`; }).join("")}</ul>` : "<p>Nevyplněno.</p>"}` : ""}
    <h4>Schválení</h4><p>${pr.state === "approved" ? `${esc(pr.approver)}, ${esc(pr.when)}` : "Koncept, zatím neschváleno."}</p>
    ${reg.list.length ? `<h4>Zdroje</h4><ol class="src">${reg.list.map(r => `<li>${esc(docTitle(r))}, s. ${esc(r.page)}${r.quote ? `: „${esc(r.quote.length > 70 ? r.quote.slice(0, 70) + "…" : r.quote)}“` : ""}</li>`).join("")}</ol>` : ""}
    <p class="src" style="margin-top:14px">Údaje sestavil asistent z uvedených dokumentů; čísla v hranatých závorkách odkazují na zdroje. [zápor v dokumentu] = zápor zapsaný lékařem; [ověřit čtení] = text, který mohl být špatně přečten; [pozorování asistenta] = odvozeno asistentem, v dokumentu výslovně není; [upraveno lékařem] = hodnotu změnil lékař, zdroj ji v této podobě neuvádí.</p></article>`;
}
function refreshReport() {
  const el = document.getElementById("report"); if (!el) return;
  const p = P(S.pid), pr = ensureProto(p);
  if (pr.state === "approved") return;
  el.innerHTML = reportHtml(p, pr, presentList());
}

/* ---------- 6. My tasks (coordinator) ---------- */

      <span class="seg" role="group"><button data-scope="mine" aria-pressed="${S.taskScope === "mine"}">Moje</button><button data-scope="all" aria-pressed="${S.taskScope === "all"}">Všechny</button></span></div>
    <div class="grid2"><section class="card"><div class="head"><h2>Úlohy</h2><span class="muted small">${list.length - open} / ${list.length} hotovo</span></div>
      ${list.map(t => { const p = P(t.pid); return `<div class="trow ${t.done ? "done" : ""}"><input type="checkbox" data-done="${t.id}" ${t.done ? "checked" : ""} aria-label="Hotovo">
        <div><div class="tt"><b>${esc(t.text)}</b></div><div class="muted small">${esc(p.id)} · ${esc(t.who)} · do ${esc(fmtDate(t.due))}</div></div>
        <button class="btn small" data-open="${esc(t.pid)}">Otevřít případ</button></div>`; }).join("") || `<p class="muted">${S.taskScope === "mine" ? "Žádné úlohy pro tohoto uživatele. Přepněte na „Všechny“ nebo na koordinátorku." : "Žádné úlohy."}</p>`}</section>
      <section class="card"><div class="head"><h2>Upozornění e-mailem</h2></div>${S.mails.map(mailHtml).join("") || `<p class="muted small">Po schválení závěru MDT se koordinátorce odešle e-mail jen s ID případu a odkazem.</p>`}</section></div></div>`;

  else if (a === "newversion") { S.protos[pr.pid] = { pid: pr.pid, mode: "manual", notes: "", concl: "", steps: [], state: "draft" }; P(pr.pid).status = "scheduled"; render(); }
  else if (a === "approve") {
    if (!pr.concl.trim() || !isDoctor(S.user) || !presentList().includes(S.user)) return;
    pr.approver = S.user;
    pr.state = "approved"; pr.when = new Date().toLocaleString("cs-CZ");
    /* Freeze what the doctor confirmed: later attendance changes or edits must not alter an approved protocol. */
    pr.attSnap = presentList().slice();
    pr.reportSnap = reportHtml(P(pr.pid), pr, pr.attSnap);
    const p = P(pr.pid); p.status = "done"; p.updated = "2026-10-16";
    S.decisions.push({ pid: p.file, text: pr.concl, by: pr.approver, when: pr.when, reportSnap: pr.reportSnap, attSnap: pr.attSnap });
    let id = Math.max(0, ...S.tasks.map(x => x.id));
    pr.steps.filter(s => s.text.trim()).forEach(s => S.tasks.push({ id: ++id, pid: p.file, text: s.text, who: s.who, due: s.due, done: false }));
    const n = pr.steps.filter(s => s.text.trim()).length;
    if (n) S.mails.unshift({ pid: p.file, id: p.id, n });
    logAccess(p.file, "schválil(a) závěr MDT");
    toast(`Závěr schválen${n ? `, koordinátorce ${n === 1 ? "odeslána 1 úloha" : n <= 4 ? `odeslány ${n} úlohy` : `odesláno ${n} úloh`}` : ""}`); render();
  }
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "dq") { S.dq = t.value; const pos = t.selectionStart; render(); const q = document.getElementById("dq"); q.focus(); q.setSelectionRange(pos, pos); }
  else if (t.id === "q") { S.q = t.value; const pos = t.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
  else if (t.dataset.step !== undefined) { curProto().steps[+t.dataset.step][t.dataset.f] = t.value; refreshReport(); }
  else if (t.dataset.devwhy) { const pr = curProto(); pr.dev[t.dataset.devwhy].why = t.value; refreshReport(); }
  else if (t.id === "notes") curProto().notes = t.value;
  else if (t.id === "concl") {
    const pr = curProto(), had = !!pr.concl.trim(); pr.concl = t.value;
    if (had !== !!t.value.trim()) { const pos = t.selectionStart; render(); const c = document.getElementById("concl"); c.focus(); c.setSelectionRange(pos, pos); }
    else refreshReport();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "user") { S.user = t.value; if (S.view === "admin" && t.value !== ADMIN) S.view = "patients"; render(); }
  else if (t.dataset.actToggle === "guide") { S.guideOn = t.checked; render(); }
  else if (t.dataset.dev) { const pr = curProto(); pr.dev = pr.dev || {}; pr.dev[t.dataset.dev] = { ...(pr.dev[t.dataset.dev] || {}), s: t.value }; render(); }
  else if (t.id === "subfrom" || t.id === "subto") { S[t.id === "subfrom" ? "subFrom" : "subTo"] = t.value; S.dbPage = 0; render(); }
  else if (t.id === "mmyear") { S.miniMonth = `${t.value}-${S.miniMonth.slice(5)}`; S.week = mondayOf(`${S.miniMonth}-15`); render(); }
  else if (t.dataset.colall) { if (t.checked) delete S.colf[t.dataset.colall]; else S.colf[t.dataset.colall] = []; render(); }
  else if (t.dataset.colv) {
    const k = t.dataset.colv, col = colDef(k);
    const all = [...new Set(col.items.map(col.get))];
    let cur = S.colf[k] ? [...S.colf[k]] : all;
    cur = t.checked ? [...new Set([...cur, t.value])] : cur.filter(v => v !== t.value);
    if (cur.length === all.length) delete S.colf[k]; else S.colf[k] = cur;
    render();
  }
  else if (t.dataset.att) { const arr = attFor()[t.dataset.att], k = +t.dataset.k; if (!t.value && k > 0) arr.splice(k, 1); else arr[k] = t.value; render(); }
  else if (t.dataset.pickrep) { t.checked ? S.picked.add(t.dataset.pickrep) : S.picked.delete(t.dataset.pickrep); }
  else if (t.dataset.step !== undefined) { curProto().steps[+t.dataset.step][t.dataset.f] = t.value; render(); }
});
document.addEventListener("toggle", e => { if (e.target.dataset?.guideopen) S.guideOpen = e.target.open; }, true);
document.addEventListener("toggle", e => { const d = e.target.dataset?.find; if (d) e.target.open ? S.openFind.add(d) : S.openFind.delete(d); }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.overlay) { S.overlay = null; renderOverlay(); } else if (e.key === "Escape" && S.colOpen) { S.colOpen = null; render(); } });

readHash();
render();
</script>
