<title>MDT Workspace maketa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Soňa's brief: a GLIDE-inspired clinical workspace in a white version only.
   Light ground, dark type, fine dividing lines, minimal shadow; colour only where it carries meaning.
   Layout: a top bar with the three main areas (patients, calendar, tasks); each screen is a full-width working page. */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --sunk: #f0f2ef;
  --fg: #1c2726;
  --muted: #5b6866;
  --faint: #8a9593;
  --line: #e1e4e0;
  --line-strong: #cdd3cf;
  --accent: #3d7a6f;
  --accent-ink: #2c5c53;
  --accent-soft: #e3ece8;
  --missing: #8f5a06; --missing-soft: #fbf0dc;
  --conflict: #a8323f; --conflict-soft: #fbe6e8;
  --change: #2b5aa8; --change-soft: #e5ecf8;
  --unclear: #6a5b8a; --unclear-soft: #eeeaf5;
  --ok: #2d7650; --ok-soft: #e1f1e7;
  --mark: #fff0a8;
  --font-head: "Manrope", "DM Sans", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14.5px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-head); letter-spacing: -.005em; text-wrap: balance; }
h1 { font-size: 22px; margin: 0; line-height: 1.25; }
h2 { font-size: 16px; margin: 0; }
h3 { font-size: 14px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 800 15px/1 var(--font-head); display: flex; align-items: center; gap: 8px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav button:hover { background: var(--sunk); }
.nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.nav .count { font-size: 11px; background: var(--accent); color: #fff; border-radius: 99px; padding: 0 6px; margin-left: 4px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.who select { border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 6px; background: var(--surface); }
.demo { font-size: 11.5px; font-weight: 600; color: var(--missing); background: var(--missing-soft); border-radius: 99px; padding: 2px 8px; }

.page { padding-block: 22px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card > .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { justify-content: space-between; }

.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 7px 13px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.st-new { background: var(--sunk); color: var(--muted); }
.st-scheduled { background: var(--change-soft); color: var(--change); }
.st-attention { background: var(--missing-soft); color: var(--missing); }
.st-ready { background: var(--ok-soft); color: var(--ok); }
.st-done { background: var(--accent-soft); color: var(--accent-ink); }
.k-missing { background: var(--missing-soft); color: var(--missing); }
.k-contradiction { background: var(--conflict-soft); color: var(--conflict); }
.k-change { background: var(--change-soft); color: var(--change); }
.k-unclear { background: var(--unclear-soft); color: var(--unclear); }

/* Toolbar and tables */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.search { flex: 1 1 220px; max-width: 340px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 10px; background: var(--surface); }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.filter[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
select.input, input.input, textarea.input { border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; background: var(--surface); width: 100%; }
textarea.input { min-height: 96px; resize: vertical; }
.scroll { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--sunk); }
.tbl .id { font-weight: 700; font-variant-numeric: tabular-nums; }
.ex { font-size: 10.5px; color: var(--faint); margin-left: 3px; vertical-align: super; }

/* Calendar */
.calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.cal { display: grid; grid-template-columns: 56px repeat(5, minmax(120px, 1fr)); min-width: 720px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.cal .dh { padding: 8px 10px; border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.cal .dh small { display: block; color: var(--muted); font-weight: 500; }
.cal .tm { font-size: 11.5px; color: var(--faint); padding: 0 6px; text-align: right; border-top: 1px solid var(--line); height: 34px; line-height: 34px; font-variant-numeric: tabular-nums; }
.cal .cell { border-top: 1px solid var(--line); border-left: 1px solid var(--line); height: 34px; padding: 2px 4px; position: relative; }
.cal .cell.sem { background: #f3f8f6; }
.slotbtn { width: 100%; height: 100%; border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer; font-size: 12.5px; text-align: left; padding: 0 6px; display: flex; align-items: center; gap: 6px; }
.slotbtn.free { color: var(--faint); }
.slotbtn.free:hover, .slotbtn.target { border-color: var(--accent); color: var(--accent-ink); background: #fff; }
.slotbtn.taken { background: var(--surface); border-color: var(--line-strong); font-weight: 700; }
.slotbtn.taken .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.popover { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 14px 16px; box-shadow: 0 6px 24px rgba(28,39,38,.08); }

/* Patient header */
.phead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: start; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.facts b { color: var(--fg); font-weight: 600; }
.question { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r) var(--r) 0; padding: 10px 14px; }
.question.missing { border-left-color: var(--missing); background: var(--missing-soft); }
.question p { margin: 2px 0 0; font-size: 15.5px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 9px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.tab .n { font-size: 11px; background: var(--sunk); border-radius: 99px; padding: 0 6px; margin-left: 4px; }

/* Summary with paper-style references */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 99px; padding: 2px; background: var(--sunk); }
.seg button { border: 0; background: none; border-radius: 99px; padding: 3px 12px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.prose { font-size: 15px; line-height: 1.65; max-width: 78ch; margin: 0; }
.ref { font-size: 11px; vertical-align: super; line-height: 1; min-width: 18px; min-height: 18px; background: none; border: 0; padding: 0 1px; color: var(--accent-ink); cursor: pointer; font-weight: 700; }
.ref:hover { text-decoration: underline; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14.5px; max-width: 86ch; }
.dl dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.dl dd { margin: 0; }
.refs { margin: 12px 0 0; padding: 10px 0 0 22px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }
.refs li { padding-left: 2px; }
.refs button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; }
.refs button:hover { color: var(--accent-ink); text-decoration: underline; }
details.more > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.disclaim { font-size: 12px; color: var(--faint); margin-top: 8px; }

/* Alerts strip */
.alerts { display: grid; gap: 6px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 6px; background: var(--sunk); }
.alert.ack { opacity: .55; }
.alert .why { display: block; color: var(--muted); font-size: 12.5px; }

/* Horizontal labelled timeline */
.tlbar { position: relative; overflow-x: auto; padding: 6px 2px 4px; }
.tltrack { position: relative; display: flex; align-items: flex-start; gap: 0; min-width: max-content; padding: 0 8px; }
.tltrack::before { content: ""; position: absolute; left: 0; right: 0; top: 39px; height: 2px; background: var(--line-strong); }
.tlyear { position: relative; min-width: 56px; padding-inline: 4px; flex: none; text-align: center; padding-top: 30px; }
.tlyear span { position: relative; display: inline-block; font: 700 12px/1 var(--font-head); color: var(--muted); background: var(--surface); padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 99px; }
.ev { position: relative; flex: none; width: 196px; padding: 0 8px; background: none; border: 0; text-align: left; cursor: pointer; }
.ev .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; height: 18px; display: block; white-space: nowrap; }
.ev .pin { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid currentColor; margin: 4px 0 8px; }
.ev .pin svg { width: 15px; height: 15px; }
.ev.planned .pin { border-style: dashed; }
.ev .t { display: block; font-weight: 700; font-size: 13.5px; line-height: 1.3; color: var(--fg); }
.ev .d { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.ev[aria-pressed="true"] .pin { box-shadow: 0 0 0 4px var(--accent-soft); }
.ev[aria-pressed="true"] .t { color: var(--accent-ink); }
.evdetail { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.kind-diagnosis { color: #7a3f8f; } .kind-imaging { color: #2b5aa8; } .kind-surgery { color: #8f5a06; }
.kind-pathology { color: #a8323f; } .kind-systemic { color: #2d7650; } .kind-radiotherapy { color: #b5521b; }
.kind-mdt { color: #3d7a6f; } .kind-visit { color: #5b6866; }

/* Anamnesis and documents */
.anam { display: grid; grid-template-columns: 220px minmax(0, 1fr); border-top: 1px solid var(--line); }
.anam > div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.anam > div:nth-child(odd) { font-weight: 600; padding-right: 12px; }
.anam ul { margin: 0; padding-left: 18px; }
.gap { color: var(--faint); font-style: italic; }
.tag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; margin-left: 4px; white-space: nowrap; }
.tag.neg { background: var(--sunk); color: var(--fg); border: 1px solid var(--line-strong); }
.tag.obs { background: var(--unclear-soft); color: var(--unclear); }
.tag.ocr { background: var(--missing-soft); color: var(--missing); }
.note { display: block; color: var(--muted); font-size: 12.5px; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.pipeline li { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pipeline li.wait { background: var(--sunk); color: var(--muted); }
.pipeline li.run { background: var(--change-soft); color: var(--change); }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); background: var(--sunk); }

/* Findings (presentation) */
.find { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.find + .find { margin-top: 8px; }
.find > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.find > summary::-webkit-details-marker { display: none; }
.find > summary::before { content: "›"; font-size: 18px; color: var(--muted); transition: transform .15s; width: 10px; }
.find[open] > summary::before { transform: rotate(90deg); }
.find .ttl { font: 700 15px/1.3 var(--font-head); }
.find .cnt { color: var(--muted); font-size: 12.5px; }
.find .pick { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.find ul { margin: 0; padding: 0 16px 14px 36px; display: grid; gap: 6px; }
.find li .dt { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }

.present { background: var(--surface); }
.present .page { max-width: 1400px; }
.present .prose { font-size: 17px; }
.present .question p { font-size: 18px; }
.agenda { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; min-width: 0; flex: 1 1 320px; }
.agenda button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.agenda button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }

/* Protocol */
.att { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.att .dept { font-weight: 600; font-size: 13.5px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 8px; padding: 3px; gap: 3px; }
.seg2 button { border: 0; background: none; border-radius: 6px; padding: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.rec { text-align: center; padding: 18px 10px; display: grid; gap: 6px; justify-items: center; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.steps .s { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.steps .s.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.task { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 150px auto; gap: 8px; align-items: center; }
.tasklist { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.trow input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.trow.done .tt { text-decoration: line-through; color: var(--muted); }
.mail { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 12px 14px; background: var(--surface); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hist li { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.hist li.old { opacity: .6; }

/* Report sheet */
.sheet { background: #fff; color: #111; max-width: 760px; margin: 0 auto; padding: 40px 46px; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.06); font-size: 13px; line-height: 1.5; }
.sheet h4 { font: 700 12px/1.3 var(--font-head); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 6px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
.sheet p, .sheet li { margin: 2px 0; }
.sheet .hdr { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #111; padding-bottom: 10px; }
.sheet .src { color: #666; font-size: 11px; }

/* Source drawer */
.scrim { position: fixed; inset: 0; background: rgba(28,39,38,.25); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 31; box-shadow: -8px 0 30px rgba(0,0,0,.12); display: grid; grid-template-rows: auto auto minmax(0, 1fr);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { padding: 16px 20px 8px; display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.drawer .pages { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 20px 10px; border-bottom: 1px solid var(--line); }
.drawer .pages button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: 12.5px; }
.drawer .pages button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.drawer .text { overflow: auto; padding: 16px 20px 40px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.65; }
.drawer mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* Modal */
.modal { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: var(--surface); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.18); padding: 22px 24px; display: grid; gap: 14px; }
.stepper { display: flex; gap: 6px; flex-wrap: wrap; }
.stepper span { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-weight: 600; }
.stepper span.on { background: var(--accent); color: #fff; }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.formgrid .full { grid-column: 1 / -1; }
.formgrid label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.toast { position: fixed; z-index: 40; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

@media (max-width: 980px) {
  .grid2, .calwrap { grid-template-columns: minmax(0, 1fr); }
  .phead { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .anam { grid-template-columns: minmax(0, 1fr); }
  .anam > div:nth-child(odd) { border-bottom: 0; padding-bottom: 0; }
  .att { grid-template-columns: minmax(0, 1fr) auto; }
  .att .dept { grid-column: 1 / -1; }
  .task { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .formgrid { grid-template-columns: minmax(0, 1fr); }
  .sheet { padding: 22px 16px; }
  .who .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <span class="brand"><i>M</i>MDT Workspace</span>
  <nav class="nav" aria-label="Hlavní oblasti" id="nav"></nav>
  <span class="who"><span class="demo">Maketa · fiktivní data</span><span class="lbl">Uživatel:</span>
    <select id="user" aria-label="Aktuální uživatel (maketa bez přihlášení)"></select></span>
</header>
<main id="app"></main>
<div id="overlay"></div>

<script id="case-data" type="application/json">/*CASE*/</script>
<script id="list-data" type="application/json">/*LIST*/</script>
<script id="extra-data" type="application/json">/*EXTRA*/</script>
<script>
"use strict";
const CASE = JSON.parse(document.getElementById("case-data").textContent);
const OTHERS = JSON.parse(document.getElementById("list-data").textContent);
const EXTRA = JSON.parse(document.getElementById("extra-data").textContent || "{}");

const GAP = "neuvedeno v dostupné dokumentaci";
const GAP_F = "neuvedena v dostupné dokumentaci";
/* Certainty labels used everywhere a fact is shown: a recorded negative, a value the OCR may have misread, an assistant inference. */
const tags = f => (f.negated ? '<span class="tag neg">zápor v dokumentu</span>' : "")
  + (f.certainty === "unclear_ocr" ? '<span class="tag ocr">ověřit čtení</span>' : "")
  + (f.certainty === "inferred" ? '<span class="tag obs">pozorování asistenta</span>' : "");
const tagsText = f => (f.negated ? " [zápor v dokumentu]" : "") + (f.certainty === "unclear_ocr" ? " [ověřit čtení]" : "") + (f.certainty === "inferred" ? " [pozorování asistenta]" : "");
const plural = (n, one, few, many) => `${n} ${n === 1 ? one : n >= 2 && n <= 4 ? few : many}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = iso => { if (!iso) return GAP; const [y, m, d] = iso.split("-"); return `${+d}. ${+m}. ${y}`; };

/* Fictional staff, configured per department (Soňa's attendance design). */
const DEPTS = [
  ["Neurochirurgie", ["MUDr. Novák", "MUDr. Dvořák"]],
  ["Klinická onkologie", ["MUDr. Svobodová", "MUDr. Malá"]],
  ["Radiační onkologie", ["MUDr. Černý", "MUDr. Horáková"]],
  ["Radiologie", ["MUDr. Šimek", "MUDr. Veselá"]],
  ["Neurologie", ["MUDr. Beneš", "MUDr. Pokorná"]],
  ["Patologie", ["MUDr. Králová", "MUDr. Němcová"]],
];
const COORD = "Bc. Marková (koordinátorka MDT)";
const USERS = ["MUDr. Svobodová", "MUDr. Novák", "MUDr. Šimek", COORD];

const STATUS = {
  new: ["Nový", "st-new"], scheduled: ["Naplánován", "st-scheduled"], attention: ["Vyžaduje pozornost", "st-attention"],
  ready: ["Připraven", "st-ready"], done: ["Projednán", "st-done"],
};
const ALERT = { missing: ["Chybí", "k-missing"], contradiction: ["Rozpor", "k-contradiction"], change: ["Změna", "k-change"], unclear: ["Nejasné", "k-unclear"] };

/* Seminar days in the example week: 15-minute slots. */
const DAYS = [["2026-10-19", "Po 19. 10."], ["2026-10-20", "Út 20. 10."], ["2026-10-21", "St 21. 10."], ["2026-10-22", "Čt 22. 10."], ["2026-10-23", "Pá 23. 10."]];
const SEMINARS = { "2026-10-20": ["08:00", "09:00", "Neuroonkologický seminář"], "2026-10-22": ["08:00", "10:00", "Neuroonkologický seminář"] };
const TIMES = []; for (let h = 7; h < 11; h++) for (const m of [0, 15, 30, 45]) TIMES.push(`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`);

/* Patients: identity from the documents; owner, department and slot are example values where the documents are silent. */
const extraOthers = Object.fromEntries((EXTRA.others || []).map(o => [o.file, o]));
const nr = file => String(file).replace("_pacient.pdf", "");
const caseId = file => `NO-${nr(file).padStart(3, "0")}`;
const ownerFor = i => DEPTS[i % 2 === 0 ? 1 : 0][1][i % 2];
function initialPatients() {
  const p10 = {
    file: CASE.file, name: CASE.patient.name, birth: CASE.patient.birth_date || null, age: CASE.patient.age || null,
    diagnosis: "Světlobuněčný karcinom ledviny, susp. MTS v mozečku", mkn10: CASE.diagnosis?.code || null,
    question: CASE.mdt_question.text_cs, purpose: CASE.mdt_question.closest_source?.quote, explicit: !!CASE.mdt_question.text_cs,
    status: "ready", slot: { day: "2026-10-22", time: "08:00" }, updated: "2026-10-16", full: true,
  };
  const slots = [["2026-10-22", "08:15"], ["2026-10-22", "08:30"], ["2026-10-20", "08:00"], ["2026-10-22", "08:45"], null, ["2026-10-20", "08:15"], null, ["2026-10-22", "09:00"], null];
  const others = OTHERS.map((o, i) => {
    const ex = extraOthers[o.file] || {};
    const slot = slots[i] ? { day: slots[i][0], time: slots[i][1] } : null;
    const hasQ = o.mdt_question_cs && o.mdt_question_explicit !== false;
    return {
      file: o.file, name: o.name,
      birth: /\d{1,2}\.\d{1,2}\.\d{4}/.test(o.age_or_birth || "") ? o.age_or_birth.replace(/^nar\.\s*/, "") : null,
      age: /let/.test(o.age_or_birth || "") ? o.age_or_birth : null,
      warn: /ověřit identitu/i.test(o.note || "") ? o.note : null,
      diagnosis: ex.diagnosis_cs || o.main_problem_cs, mkn10: ex.mkn10 || null,
      question: hasQ ? o.mdt_question_cs : null, purpose: o.mdt_question_cs, explicit: !!hasQ,
      summary: o.one_line_summary_cs, pages: o.page_count,
      referrer: ex.referring_doctor || null, dept: ex.referring_department || null,
      status: !slot ? "new" : /ověřit identitu|useknut/i.test(o.note || "") ? "attention" : "scheduled", slot, updated: "2026-10-15",
    };
  });
  return [p10, ...others].map((p, i) => ({
    ...p, id: caseId(p.file),
    owner: p.referrer || ownerFor(i), ownerExample: !p.referrer,
    dept: p.dept || ["Klinická onkologie", "Neurologie", "Neurochirurgie"][i % 3], deptExample: !p.dept,
  }));
}

const S = {
  view: "patients", pid: CASE.file, tab: "overview", brief: "brief", user: USERS[0],
  patients: initialPatients(), filter: "all", q: "", ownerFilter: "",
  selTl: null, picked: new Set(["summary", "imaging", "histology", "past_treatment"]),
  acks: {}, access: [], decisions: [], tasks: [
    { id: 1, pid: "2_pacient.pdf", text: "Ukázková úloha: doplnit pooperační MR do podkladů", who: COORD, due: "2026-10-21", done: false },
    { id: 2, pid: "13_pacient.pdf", text: "Ukázková úloha: vyžádat snímky MR 8/2025 ke srovnání", who: COORD, due: "2026-10-21", done: true },
  ],
  mails: [], protos: {}, att: Object.fromEntries(DEPTS.map(([d]) => [d, [""]])), schedPick: null, calPop: null, overlay: null, tlScroll: 0, openFind: new Set(), taskScope: "mine",
};
const P = id => S.patients.find(p => p.file === id);

/* ---------- small UI helpers ---------- */
const statusChip = p => `<span class="chip ${STATUS[p.status][1]}">${STATUS[p.status][0]}</span>`;
const slotText = p => p.slot ? `${DAYS.find(d => d[0] === p.slot.day)?.[1] || p.slot.day} · ${p.slot.time}` : "nenaplánováno";
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function logAccess(pid, what) { S.access.unshift({ pid, what, who: S.user, when: new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) }); }

/* Paper-style references: each view numbers its sources [1], [2] in order of first use. */
function refRegistry() {
  const list = [];
  const key = r => `${r.file}|${r.page}|${r.quote}`;
  return {
    list,
    n(r) { if (!r) return ""; let i = list.findIndex(x => key(x) === key(r)); if (i < 0) { list.push(r); i = list.length - 1; } return `<button class="ref" data-src='${esc(JSON.stringify(r))}' aria-label="Zdroj ${i + 1}">[${i + 1}]</button>`; },
    html() { return list.length ? `<ol class="refs">${list.map(r => `<li><button data-src='${esc(JSON.stringify(r))}'>${esc(docTitle(r))}, s. ${esc(r.page)}: „${esc(r.quote.length > 90 ? r.quote.slice(0, 90) + "…" : r.quote)}“</button></li>`).join("")}</ol>` : ""; },
  };
}
function docTitle(r) {
  const d = (EXTRA.documents || []).find(d => (d.pages || []).includes(r.page));
  return d ? d.title_cs : r.file;
}

/* ---------- icons for timeline kinds ---------- */
const ICON = {
  imaging: '<path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/>',
  surgery: '<path d="M3 13 13 3M6 3l7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  pathology: '<circle cx="8" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 9v4M4 14h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  systemic: '<rect x="2.5" y="5.5" width="11" height="5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 5.5v5" stroke="currentColor" stroke-width="1.6"/>',
  radiotherapy: '<circle cx="8" cy="8" r="2" fill="currentColor"/><path d="M8 1.5v2.5M8 12v2.5M1.5 8H4M12 8h2.5M3.4 3.4l1.8 1.8M10.8 10.8l1.8 1.8M3.4 12.6l1.8-1.8M10.8 5.2l1.8-1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  diagnosis: '<path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  mdt: '<circle cx="5" cy="6" r="2" fill="currentColor"/><circle cx="11" cy="6" r="2" fill="currentColor"/><path d="M1.5 13c.5-2.5 2-3.5 3.5-3.5S8 10.5 8.5 13M7.5 13c.5-2.5 2-3.5 3.5-3.5s3 1 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  visit: '<rect x="2" y="3" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.5"/>',
};
const KIND_CS = { diagnosis: "Diagnóza", imaging: "Zobrazení", surgery: "Operace", pathology: "Histologie", systemic: "Systémová léčba", radiotherapy: "Radioterapie", mdt: "MDT", visit: "Kontrola" };
const icon = k => `<svg viewBox="0 0 16 16" aria-hidden="true">${ICON[k] || ICON.visit}</svg>`;

/* ---------- navigation ---------- */
function renderNav() {
  const open = S.tasks.filter(t => !t.done && t.who === S.user).length;
  const items = [["patients", "Databáze pacientů"], ["calendar", "Kalendář MDT"], ["tasks", `Moje úlohy<span class="count">${open}</span>`]];
  document.getElementById("nav").innerHTML = items.map(([k, t]) => `<button data-nav="${k}" aria-current="${S.view === k || (k === "patients" && ["patient", "present", "protocol"].includes(S.view))}">${t}</button>`).join("");
  document.getElementById("user").innerHTML = USERS.map(u => `<option ${u === S.user ? "selected" : ""}>${esc(u)}</option>`).join("");
}

/* ---------- 1. Patient database ---------- */
function viewPatients() {
  const counts = Object.fromEntries(Object.keys(STATUS).map(k => [k, S.patients.filter(p => p.status === k).length]));
  const owners = [...new Set(S.patients.map(p => p.owner))];
  const rows = S.patients.filter(p => (S.filter === "all" || p.status === S.filter) && (!S.ownerFilter || p.owner === S.ownerFilter)
    && (!S.q || `${p.id} ${p.name} ${p.diagnosis} ${p.mkn10 || ""}`.toLowerCase().includes(S.q.toLowerCase())));
  return `<div class="page">
    <div class="pagehead"><div><h1>Databáze pacientů</h1><div class="muted small">Pacienti odeslaní k projednání na neuroonkologickém MDT</div></div>
      <button class="btn primary" data-act="newpatient">+ Nový pacient</button></div>
    <div class="toolbar">
      <input class="search" id="q" placeholder="Hledat ID, jméno, diagnózu" value="${esc(S.q)}" aria-label="Hledat">
      <button class="filter" data-filter="all" aria-pressed="${S.filter === "all"}">Vše ${S.patients.length}</button>
      ${Object.entries(STATUS).map(([k, [t]]) => `<button class="filter" data-filter="${k}" aria-pressed="${S.filter === k}">${t} ${counts[k]}</button>`).join("")}
      <select class="input" id="ownerf" style="width:auto" aria-label="Vlastník"><option value="">Všichni vlastníci</option>${owners.map(o => `<option ${o === S.ownerFilter ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>
    </div>
    <div class="card" style="padding:0"><div class="scroll"><table class="tbl">
      <thead><tr><th>ID</th><th>Pacient</th><th>Narozen / věk</th><th>Diagnóza</th><th>Vlastník</th><th>Odesílající pracoviště</th><th>Příští MDT</th><th>Stav</th><th>Aktualizace</th></tr></thead>
      <tbody>${rows.map(p => `<tr class="click" data-open="${esc(p.file)}">
        <td class="id">${p.id}</td><td><b>${esc(p.name)}</b>${p.warn ? ' <span class="tag ocr">ověřit identitu</span>' : ""}</td><td class="num">${esc(p.birth || (p.age ? "věk " + p.age : "–"))}</td>
        <td>${esc(p.diagnosis)}${p.mkn10 ? ` <span class="muted small">${esc(p.mkn10)}</span>` : ""}</td>
        <td>${esc(p.owner)}${p.ownerExample ? '<span class="ex">ukázka</span>' : ""}</td>
        <td>${esc(p.dept)}${p.deptExample ? '<span class="ex">ukázka</span>' : ""}</td>
        <td class="num">${p.slot ? esc(slotText(p)) : `<button class="linkbtn" data-sched="${esc(p.file)}">Naplánovat</button>`}</td>
        <td>${statusChip(p)}</td><td class="num muted">${fmtDate(p.updated)}</td></tr>`).join("") || `<tr><td colspan="9" class="muted">Žádný pacient neodpovídá filtru.</td></tr>`}</tbody>
    </table></div></div>
    <p class="muted small">Vlastník případu je odesílající lékař. Hodnoty označené „ukázka“ (vlastník, pracoviště, termín) v dokumentech nejsou a slouží jen pro maketu. „–“ u data narození: ${GAP}.</p>
  </div>`;
}

/* ---------- 2. MDT calendar ---------- */
function viewCalendar() {
  const unscheduled = S.patients.filter(p => !p.slot || p.file === S.schedPick);
  const byslot = {}; S.patients.forEach(p => { if (p.slot) byslot[`${p.slot.day} ${p.slot.time}`] = p; });
  const inSem = (day, t) => { const s = SEMINARS[day]; return s && t >= s[0] && t < s[1]; };
  let cells = `<div></div>${DAYS.map(([d, l]) => `<div class="dh">${l}<small>${SEMINARS[d] ? esc(SEMINARS[d][2]) : "&nbsp;"}</small></div>`).join("")}`;
  for (const t of TIMES) {
    cells += `<div class="tm">${t.endsWith(":00") ? t : ""}</div>`;
    for (const [d] of DAYS) {
      const p = byslot[`${d} ${t}`];
      const sem = inSem(d, t);
      let inner = "";
      if (p) inner = `<button class="slotbtn taken" data-slot="${d} ${t}" aria-label="${p.id}, ${t}"><span class="dot" style="background:var(--${{ new: "muted", scheduled: "change", attention: "missing", ready: "ok", done: "accent" }[p.status]})"></span>${p.id}</button>`;
      else if (sem) inner = `<button class="slotbtn free ${S.schedPick ? "target" : ""}" data-free="${d} ${t}" aria-label="Volný termín ${t}">${S.schedPick ? "+ sem" : ""}</button>`;
      cells += `<div class="cell ${sem ? "sem" : ""}">${inner}</div>`;
    }
  }
  const pop = S.calPop && P(S.calPop);
  return `<div class="page">
    <div class="pagehead"><div><h1>Kalendář MDT</h1><div class="muted small">Týden 19. až 23. 10. 2026 (ukázkový) · sloty po 15 minutách · ve slotu jen ID případu</div></div>
      <div class="row"><button class="btn small" disabled>‹ Předchozí týden</button><button class="btn small" disabled>Další týden ›</button></div></div>
    <div class="calwrap">
      <div class="scroll"><div class="cal">${cells}</div></div>
      <div class="stack">
        ${pop ? `<div class="popover"><div class="row spread"><span class="id" style="font-weight:800">${pop.id}</span>${statusChip(pop)}</div>
          <h2 style="margin-top:6px">${esc(pop.name)}</h2><div class="muted small">${esc(slotText(pop))} · ${esc(pop.owner)}${pop.ownerExample ? " (ukázka)" : ""}</div>
          <p class="small" style="margin:8px 0">${esc(pop.diagnosis)}</p>
          <div class="row"><button class="btn primary small" data-open="${esc(pop.file)}">Otevřít případ</button><button class="btn small" data-unsched="${esc(pop.file)}">Uvolnit termín</button></div></div>` : ""}
        <div class="card"><div class="head"><h2>Nenaplánovaní (${unscheduled.length})</h2></div>
          ${S.schedPick ? `<p class="small" style="margin:0 0 8px">Vyberte volný slot pro <b>${esc(P(S.schedPick).id)}</b> v kalendáři. <button class="linkbtn" data-act="cancelsched">Zrušit</button></p>` : `<p class="muted small" style="margin:0 0 8px">Vyberte pacienta a pak volný slot semináře.</p>`}
          <div class="tasklist">${unscheduled.map(p => `<div class="row spread"><span><b>${p.id}</b> <span class="muted small">${esc(p.diagnosis)}</span></span>
            <button class="btn small ${S.schedPick === p.file ? "primary" : ""}" data-pick="${esc(p.file)}">${S.schedPick === p.file ? "Vybráno" : p.slot ? "Přesunout" : "Naplánovat"}</button></div>`).join("") || `<span class="muted small">Všichni pacienti mají termín.</span>`}</div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- 3. Patient detail ---------- */
function patientHeader(p, extraActions = "") {
  return `<div class="card"><div class="phead">
      <div><div class="row"><span class="label">${p.id}</span>${statusChip(p)}</div>
        <h1 style="margin-top:4px">${esc(p.name)}</h1>
        ${p.warn ? `<div class="question missing" style="margin:8px 0 0;padding:6px 10px"><b>Ověřit identitu:</b> ${esc(p.warn)}</div>` : ""}
        <div class="facts"><span>${p.birth ? `Narozen: <b>${esc(p.birth)}</b>` : p.age ? `Věk: <b>${esc(p.age)}</b>` : `Narozen: <b>${GAP}</b>`}</span><span>Diagnóza: <b>${esc(p.diagnosis)}</b>${p.mkn10 ? ` (${esc(p.mkn10)})` : ""}</span>
          <span>Vlastník: <b>${esc(p.owner)}</b>${p.ownerExample ? '<span class="ex">ukázka</span>' : ""}</span><span>Pracoviště: <b>${esc(p.dept)}</b>${p.deptExample ? '<span class="ex">ukázka</span>' : ""}</span><span>Příští MDT: <b>${esc(slotText(p))}</b></span></div></div>
      <div class="row">${extraActions}</div>
    </div>
    <div class="question ${p.explicit ? "" : "missing"}" style="margin-top:14px"><span class="label">Otázka pro MDT</span>
      <p>${p.explicit ? esc(p.question) : `<b>Výslovná otázka ${GAP_F}.</b> ${p.purpose ? `Účel dle dokumentu: „${esc(p.purpose)}“` : ""}`}</p></div>
  </div>`;
}
function topAlerts() {
  const all = CASE.flags.map((f, i) => ({ ...f, i }));
  return { top: all.filter(f => f.relevant), all };
}
function summaryCard(reg, inPresent) {
  const brief = EXTRA.onco_brief_cs
    ? `<p class="prose">${esc(EXTRA.onco_brief_cs).replace(/\[(\d+)\]/g, (m, n) => reg.n((EXTRA.onco_brief_refs || [])[n - 1]))}</p>`
    : `<p class="prose">${CASE.summary.filter(s => (s.level || 3) <= 2).map(s => esc(s.text_cs) + (s.sources || []).slice(0, 2).map(r => reg.n(r)).join("")).join(" ")}</p>`;
  const detailed = EXTRA.onco_detailed
    ? `<dl class="dl">${EXTRA.onco_detailed.map(l => `<dt>${esc(l.label_cs)}:</dt><dd>${esc(l.text_cs)}${(l.refs || []).map(i => reg.n((EXTRA.refs || [])[i])).join("")}</dd>`).join("")}</dl>`
    : `<dl class="dl">${CASE.timeline.filter(e => e.date_sort).map(e => `<dt>${esc(e.date)}:</dt><dd>${esc(e.label_cs)}${reg.n(e.source)}</dd>`).join("")}</dl>`;
  return `<section class="card"><div class="head"><h2>${inPresent ? "Shrnutí (30 až 60 s)" : "Onkologický souhrn"}</h2>
      ${inPresent ? `<label class="small muted"><input type="checkbox" data-pickrep="summary" ${S.picked.has("summary") ? "checked" : ""}> do reportu</label>` : ""}
      <span class="seg" role="group" aria-label="Úroveň detailu"><button data-brief="brief" aria-pressed="${S.brief === "brief"}">MDT brief</button><button data-brief="detailed" aria-pressed="${S.brief === "detailed"}">Detailní</button></span></div>
    ${S.brief === "brief" ? brief : detailed}
    ${reg.html()}
    <div class="disclaim">Sestaveno asistentem jen z údajů v dokumentech; číslo v hranatých závorkách otevře původní text.</div></section>`;
}
function alertsStrip() {
  const { top, all } = topAlerts();
  const open = top.filter(f => !S.acks[f.i]);

          <li><span class="s ${stepsDone[2] ? "done" : ""}">3</span><span><b>Kontrola a schválení lékařem</b><br><span class="muted small">Až po schválení vzniknou úlohy a report</span></span></li></ol>
        ${locked ? `<p class="small" style="margin:12px 0 0">Schválil(a) <b>${esc(pr.approver)}</b> · ${esc(pr.when)}</p>` : `
        <p class="small" style="margin:14px 0 6px">Schvaluje přihlášený lékař, který je označen jako přítomný: <b>${esc(S.user)}</b></p>
        <button class="btn primary" data-act="approve" style="width:100%" ${stepsDone[0] && canApprove ? "" : "disabled"}>Schválit závěr jako ${esc(S.user)}</button>
        <p class="muted small" style="margin:8px 0 0">${!stepsDone[0] ? "Nejdřív zapište závěr. " : ""}${!isDoctor(S.user) ? "Závěr schvaluje lékař; koordinátorka schvalovat nemůže. " : !present.includes(S.user) ? "Označte se jako přítomný(á) v seznamu přítomných. " : ""}</p>`}
      </section>
      ${locked ? `<section class="card"><div class="head"><h2>Odeslané upozornění</h2></div>${S.mails.filter(m => m.pid === p.file).map(mailHtml).join("") || `<p class="muted small">Bez úloh, upozornění se neodesílá.</p>`}</section>` : ""}
      <section class="card"><div class="head"><h2>Report (PDF)</h2><button class="btn small" disabled title="V maketě není">Stáhnout PDF</button></div><div id="report">${reportHtml(p, pr, present)}</div></section>
    </div></div></div>`;
}
function mailHtml(m) {
  return `<div class="mail"><div class="row"><b>✉ MDT – nové úlohy ke zpracování</b></div><p class="small" style="margin:6px 0">Komu: ${esc(COORD)}</p>
    <p style="margin:0">K případu ${esc(m.id)} ${m.n === 1 ? "byla přiřazena 1 nová úloha" : m.n <= 4 ? `byly přiřazeny ${m.n} nové úlohy` : `bylo přiřazeno ${m.n} nových úloh`}. Otevřete zabezpečenou aplikaci MDT Workspace a potvrďte převzetí.</p>
    <p style="margin:6px 0 0">Odkaz: <span class="num">https://mdt.fno.local/pripad/${esc(m.id)}</span> <span class="muted small">(ukázková interní adresa)</span></p>
    <p class="muted small" style="margin:6px 0 0">E-mail obsahuje jen ID případu a odkaz, žádné zdravotní údaje.</p></div>`;
}
function reportHtml(p, pr, present) {
  const reg = refRegistry();
  const refTxt = r => r ? ` [${reg.n(r).replace(/<[^>]+>/g, "").replace(/[\[\]]/g, "")}]` : "";
  const line = f => `<li>${f.date ? esc(f.date) + ": " : ""}${esc(f.text_cs)}${esc(tagsText(f))}<span class="src">${refTxt(f.source)}</span></li>`;
  const A = EXTRA.anamnesis || {};
  const anamLines = ANAM.filter(([k]) => (A[k] || []).length).map(([k, t]) => `<li><b>${t}:</b> ${A[k].map(f => esc(f.text_cs) + esc(tagsText(f)) + `<span class="src">${refTxt(f.source)}</span>`).join("; ")}</li>`).join("");
  const brief = EXTRA.onco_brief_cs ? esc(EXTRA.onco_brief_cs).replace(/\[(\d+)\]/g, (m, n) => `<span class="src">${refTxt((EXTRA.onco_brief_refs || [])[n - 1])}</span>`) : esc(CASE.summary.map(x => x.text_cs).join(" "));
  return `<article class="sheet">
    <div class="hdr"><div><b>Fakultní nemocnice Ostrava</b><br>Protokol neuroonkologického MDT (maketa)</div><div>${esc(slotText(p))}</div></div>
    <h4>Pacient</h4><p>${esc(p.name)} · ${p.birth ? "narozen: " + esc(p.birth) : p.age ? "věk: " + esc(p.age) : "narozen: " + GAP} · ID ${esc(p.id)}</p>
    <h4>Anamnéza</h4>${anamLines ? `<ul>${anamLines}</ul>` : `<p>${GAP}</p>`}
    ${S.picked.has("summary") ? `<h4>Onkologický souhrn (sestavil asistent)</h4><p>${brief}</p>` : ""}
    ${FIND.filter(([k]) => S.picked.has(k)).map(([k, t]) => `<h4>${t}</h4><ul>${(CASE.sections[k] || []).map(line).join("") || `<li>${GAP}</li>`}</ul>`).join("")}
    <h4>Přítomní</h4><p>${esc(present.join(", ") || "nezadáno")}</p>
    <h4>Dotaz</h4><p>${esc(p.explicit ? p.question : `Výslovná otázka ${GAP_F}. Účel dle dokumentu: ${p.purpose || ""}`)}</p>
    <h4>Závěr</h4><p id="rep-concl">${esc(pr.concl || "Zatím nezapsán.")}</p>
    <h4>Další kroky</h4>${pr.steps.filter(x => x.text.trim()).length ? `<ul>${pr.steps.filter(x => x.text.trim()).map(x => `<li>${esc(x.text)} · ${esc(x.who)} · do ${esc(fmtDate(x.due))}</li>`).join("")}</ul>` : "<p>Žádné.</p>"}
    <h4>Schválení</h4><p>${pr.state === "approved" ? `${esc(pr.approver)}, ${esc(pr.when)}` : "Koncept, zatím neschváleno."}</p>
    ${reg.list.length ? `<h4>Zdroje</h4><ol class="src">${reg.list.map(r => `<li>${esc(docTitle(r))}, s. ${esc(r.page)}</li>`).join("")}</ol>` : ""}
    <p class="src" style="margin-top:14px">Údaje sestavil asistent z uvedených dokumentů; čísla v hranatých závorkách odkazují na zdroje. [zápor v dokumentu] = zápor zapsaný lékařem; [ověřit čtení] = text, který mohl být špatně přečten; [pozorování asistenta] = odvozeno asistentem, v dokumentu výslovně není.</p></article>`;
}
function refreshReport() {
  const el = document.getElementById("report"); if (!el) return;
  const p = P(S.pid); el.innerHTML = reportHtml(p, ensureProto(p), presentList());
}

/* ---------- 6. My tasks (coordinator) ---------- */
function viewTasks() {
  const list = S.tasks.filter(t => S.taskScope === "all" || t.who === S.user || (S.user !== COORD && P(t.pid).owner === S.user));
  const open = list.filter(t => !t.done).length;
  return `<div class="page"><div class="pagehead"><div><h1>Moje úlohy</h1><div class="muted small">Úlohy ze schválených závěrů MDT napříč pacienty · uživatel ${esc(S.user)}</div></div>
      <span class="seg" role="group"><button data-scope="mine" aria-pressed="${S.taskScope === "mine"}">Moje</button><button data-scope="all" aria-pressed="${S.taskScope === "all"}">Všechny</button></span></div>
    <div class="grid2"><section class="card"><div class="head"><h2>Úlohy</h2><span class="muted small">${list.length - open} / ${list.length} hotovo</span></div>
      ${list.map(t => { const p = P(t.pid); return `<div class="trow ${t.done ? "done" : ""}"><input type="checkbox" data-done="${t.id}" ${t.done ? "checked" : ""} aria-label="Hotovo">
        <div><div class="tt"><b>${esc(t.text)}</b></div><div class="muted small">${esc(p.id)} · ${esc(t.who)} · do ${esc(fmtDate(t.due))}</div></div>
        <button class="btn small" data-open="${esc(t.pid)}">Otevřít případ</button></div>`; }).join("") || `<p class="muted">${S.taskScope === "mine" ? "Žádné úlohy pro tohoto uživatele. Přepněte na „Všechny“ nebo na koordinátorku." : "Žádné úlohy."}</p>`}</section>
      <section class="card"><div class="head"><h2>Upozornění e-mailem</h2></div>${S.mails.map(mailHtml).join("") || `<p class="muted small">Po schválení závěru MDT se koordinátorce odešle e-mail jen s ID případu a odkazem.</p>`}</section></div></div>`;
}

/* ---------- overlays: source drawer and new-patient modal ---------- */
function openSource(r) { S.overlay = { kind: "source", r }; logAccess(S.pid, `zobrazil(a) zdroj s. ${r.page}`); renderOverlay(); }
function renderOverlay() {
  const o = S.overlay, el = document.getElementById("overlay");
  if (!o) { el.innerHTML = ""; return; }
  if (o.kind === "source") {
    const r = o.r, page = CASE.full_text_by_page.find(p => p.page === r.page);
    let text = esc(page ? page.text : "Text stránky není k dispozici.");
    if (r.quote && page) {
      const pat = r.quote.trim().split(/\s+/).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+");
      try { text = text.replace(new RegExp(pat), m => `<mark id="hit">${m}</mark>`); } catch (e) { /* quote with odd characters: show the page unmarked */ }
    }
    el.innerHTML = `<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="Původní dokument">
      <header><div><div class="label">Původní dokument · text z OCR</div><h2 style="margin-top:4px">${esc(docTitle(r))}</h2><div class="muted small">${esc(r.file)} · strana ${esc(r.page)} z ${CASE.page_count}</div></div>
        <button class="btn small" data-close="1">Zavřít</button></header>
      <div class="pages">${CASE.full_text_by_page.map(p => `<button data-page="${p.page}" aria-pressed="${p.page === r.page}">s. ${p.page}</button>`).join("")}</div>
      <div class="text">${text}</div></aside>`;
    document.getElementById("hit")?.scrollIntoView({ block: "center" });
  } else if (o.kind === "new") {
    const step = o.step;
    const fields = [["Jméno", "text"], ["Příjmení", "text"], ["Rodné číslo", "text"], ["Pojišťovna", "select"], ["Jméno lékaře (vlastník)", "text"], ["Odesílající pracoviště", "text"], ["Kontaktní e-mail", "email"], ["Kontaktní telefon", "text"]];
    const pipe = ["Kontrola čitelnosti", "Pseudonymizace", "Extrakce údajů", "Kontrola úplnosti"];
    el.innerHTML = `<div class="scrim" data-close="1"></div><div class="modal" role="dialog" aria-label="Nový pacient">
      <div class="row spread"><h2>Nový pacient</h2><button class="btn small" data-close="1">Zavřít</button></div>
      <div class="stepper">${["Žádost o konzultaci", "Dokumenty", "Zpracování"].map((t, i) => `<span class="${i === step ? "on" : ""}">${i + 1}. ${t}</span>`).join("")}</div>
      ${step === 0 ? `<p class="muted small" style="margin:0">Pole podle formuláře FNO „Konzultace pacienta“. Povinná pole jsou označena *.</p>
        <div class="formgrid">${fields.map(([l, t], i) => `<label>${l} *${t === "select" ? `<select class="input" id="nf${i}"><option>111</option><option>201</option><option>205</option><option>207</option><option>209</option><option>211</option><option>213</option></select>` : `<input class="input" id="nf${i}" type="${t}">`}</label>`).join("")}
          <label class="full">Anamnéza *<textarea class="input" id="nfa"></textarea></label>
          <label class="full">Otázka na NOCO (otázka pro MDT)<textarea class="input" id="nfq" style="min-height:60px"></textarea></label>
          <label class="full" style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="nfg"> Souhlasím, aby FNO použila uvedené osobní údaje ke zpracování požadavku, dle GDPR.</label></div>
        <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="newnext">Pokračovat</button></div>`
      : step === 1 ? `<div class="drop">Přetáhněte PDF, DOC/DOCX, XLS/XLSX, ODT nebo ZIP (nejvýše 20 MB)<br><button class="btn small" style="margin-top:8px" data-act="fakeupload">Vybrat soubory (ukázka)</button></div>
        ${o.uploaded ? `<p class="small" style="margin:0">Nahráno: <b>propousteci_zprava.pdf</b>, <b>MR_mozku_zaver.pdf</b> (ukázka)</p>` : ""}
        <div class="row" style="justify-content:flex-end"><button class="btn" data-act="newback">Zpět</button><button class="btn primary" data-act="newnext" ${o.uploaded ? "" : "disabled"}>Zpracovat</button></div>`
      : `<ul class="pipeline">${pipe.map((t, i) => `<li class="${i < o.progress ? "" : i === o.progress ? "run" : "wait"}">${i < o.progress ? "✓" : i === o.progress ? "…" : "○"} ${t}</li>`).join("")}</ul>
        <p class="small" style="margin:0">Před extrakcí se jméno a rodné číslo nahradí ID případu; jazykový model vidí jen pseudonymizovaný text. Převodní tabulka zůstává na serveru nemocnice.</p>
        ${o.progress >= pipe.length ? `<p class="small" style="margin:0"><b>Hotovo (ukázka).</b> Jedna strana je špatně čitelná; aplikace by odesílajícího lékaře požádala o lepší kopii (v maketě se nic neodesílá).</p>
          <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="newdone">Přidat do databáze</button></div>` : ""}`}
    </div>`;
  }
}

/* ---------- render and events ---------- */
function render() {
  const bar = document.querySelector(".tlbar"); if (bar) S.tlScroll = bar.scrollLeft;
  renderNav();
  const v = { patients: viewPatients, calendar: viewCalendar, patient: viewPatient, present: viewPresent, protocol: viewProtocol, tasks: viewTasks }[S.view];
  document.getElementById("app").innerHTML = v();
  const nb = document.querySelector(".tlbar"); if (nb) nb.scrollLeft = S.tlScroll || 0;
  renderOverlay();
}
function openPatient(file, view = "patient") {
  S.pid = file; S.view = view; S.tab = "overview"; S.selTl = null; S.calPop = null; S.tlScroll = 0; S.openFind = new Set();
  logAccess(file, view === "present" ? "otevřel(a) prezentaci" : "otevřel(a) případ");
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-scope],[data-addatt],[data-nav],[data-open],[data-tab],[data-brief],[data-src],[data-close],[data-page],[data-tl],[data-ack],[data-go],[data-present],[data-sched],[data-pick],[data-free],[data-slot],[data-unsched],[data-filter],[data-act],[data-mode],[data-delstep],[data-done]");
  if (!t) return;
  const d = t.dataset;
  if (d.scope) { S.taskScope = d.scope; render(); }
  else if (d.addatt) { S.att[d.addatt].push(""); render(); }
  else if (d.nav) { S.view = d.nav; S.schedPick = null; render(); }
  else if (d.open) { openPatient(d.open); }
  else if (d.tab) { S.tab = d.tab.replace(/<.*$/, ""); render(); }
  else if (d.brief) { S.brief = d.brief; render(); }
  else if (d.src) { e.preventDefault(); openSource(JSON.parse(d.src)); }
  else if (d.close) { S.overlay = null; renderOverlay(); }
  else if (d.page) { openSource({ file: CASE.file, page: +d.page }); }
  else if (d.tl !== undefined) { S.selTl = S.selTl === +d.tl ? null : +d.tl; render(); }
  else if (d.ack !== undefined) { S.acks[d.ack] = S.user; logAccess(S.pid, "vzal(a) upozornění na vědomí"); render(); }
  else if (d.go) { if (d.go === "present") logAccess(S.pid, "otevřel(a) prezentaci"); S.view = d.go; render(); window.scrollTo(0, 0); }
  else if (d.present) { openPatient(d.present, "present"); }
  else if (d.sched) { S.view = "calendar"; S.schedPick = d.sched; S.calPop = null; render(); }
  else if (d.pick) { S.schedPick = S.schedPick === d.pick ? null : d.pick; render(); }
  else if (d.free) {
    if (!S.schedPick) { toast("Nejdřív vyberte pacienta vpravo."); return; }
    const [day, time] = d.free.split(" "), p = P(S.schedPick);
    p.slot = { day, time }; if (p.status === "new") p.status = "scheduled";
    toast(`${p.id} naplánován na ${slotText(p)}`); S.schedPick = null; S.calPop = p.file; render();
  }
  else if (d.slot) { const [day, time] = d.slot.split(" "); S.calPop = S.patients.find(p => p.slot && p.slot.day === day && p.slot.time === time)?.file; if (S.calPop) logAccess(S.calPop, "zobrazil(a) detail termínu"); render(); }
  else if (d.unsched) { const p = P(d.unsched); p.slot = null; if (p.status === "scheduled") p.status = "new"; S.calPop = null; render(); }
  else if (d.filter) { S.filter = d.filter; render(); }
  else if (d.mode) { curProto().mode = d.mode; render(); }
  else if (d.delstep !== undefined) { curProto().steps.splice(+d.delstep, 1); render(); }
  else if (d.done) { const task = S.tasks.find(x => x.id === +d.done); task.done = t.checked; renderNav(); render(); }
  else if (d.act) action(d.act);
});
const curProto = () => ensureProto(P(S.pid));
async function copyText(text, what) {
  try { await navigator.clipboard.writeText(text); toast(`${what} zkopírováno`); } catch (e) { toast("Kopírování není v tomto prohlížeči dostupné"); }
}
function action(a) {
  const pr = S.view === "protocol" ? curProto() : null;
  if (a === "newpatient") { S.overlay = { kind: "new", step: 0, uploaded: false, progress: 0 }; renderOverlay(); }
  else if (a === "newnext") {
    const o = S.overlay;
    if (o.step === 0 && !document.getElementById("nfg").checked) { toast("Potvrďte souhlas se zpracováním údajů."); return; }
    o.step++; renderOverlay();
    if (o.step === 2) { const tick = () => { o.progress++; renderOverlay(); if (o.progress < 4) setTimeout(tick, 550); }; setTimeout(tick, 450); }
  }
  else if (a === "newback") { S.overlay.step--; renderOverlay(); }
  else if (a === "fakeupload") { S.overlay.uploaded = true; renderOverlay(); }
  else if (a === "newdone") {
    const n = S.patients.length + 11;
    S.patients.push({ file: `${n}_novy`, id: `NO-${String(n).padStart(3, "0")}`, name: "Nový pacient (ukázka)", birth: null, diagnosis: "Čeká na kontrolu lékařem", mkn10: null, question: null, purpose: null, explicit: false, status: "new", slot: null, updated: "2026-10-16", owner: S.user, dept: "Klinická onkologie", summary: "Ukázkový záznam vytvořený v maketě.", pages: 2 });
    S.overlay = null; S.view = "patients"; S.filter = "all"; toast(`Pacient NO-${String(n).padStart(3, "0")} přidán do databáze`); render();
  }
  else if (a === "cancelsched") { S.schedPick = null; render(); }
  else if (a === "addstep") { pr.steps.push({ text: "", who: COORD, due: "2026-10-30" }); render(); }
  else if (a === "copyatt") { copyText(presentList().join(", ") || "nezadáno", "Seznam přítomných"); }
  else if (a === "copytasks") { copyText(pr.steps.filter(x => x.text.trim()).map(x => `${x.text} (${x.who}, do ${fmtDate(x.due)})`).join("\n"), "Úlohy"); }
  else if (a === "newversion") { S.protos[pr.pid] = { pid: pr.pid, mode: "manual", notes: "", concl: "", steps: [], state: "draft" }; render(); }
  else if (a === "approve") {
    if (!pr.concl.trim() || !isDoctor(S.user) || !presentList().includes(S.user)) return;
    pr.approver = S.user;
    pr.state = "approved"; pr.when = new Date().toLocaleString("cs-CZ");
    const p = P(pr.pid); p.status = "done"; p.updated = "2026-10-16";
    S.decisions.push({ pid: p.file, text: pr.concl, by: pr.approver, when: pr.when });
    let id = Math.max(0, ...S.tasks.map(x => x.id));
    pr.steps.filter(s => s.text.trim()).forEach(s => S.tasks.push({ id: ++id, pid: p.file, text: s.text, who: s.who, due: s.due, done: false }));
    const n = pr.steps.filter(s => s.text.trim()).length;
    if (n) S.mails.unshift({ pid: p.file, id: p.id, n });
    logAccess(p.file, "schválil(a) závěr MDT");
    toast(`Závěr schválen${n ? `, koordinátorce ${n === 1 ? "odeslána 1 úloha" : n <= 4 ? `odeslány ${n} úlohy` : `odesláno ${n} úloh`}` : ""}`); render();
  }
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; const pos = t.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
  else if (t.dataset.step !== undefined) { curProto().steps[+t.dataset.step][t.dataset.f] = t.value; refreshReport(); }
  else if (t.id === "notes") curProto().notes = t.value;
  else if (t.id === "concl") {
    const pr = curProto(), had = !!pr.concl.trim(); pr.concl = t.value;
    if (had !== !!t.value.trim()) { const pos = t.selectionStart; render(); const c = document.getElementById("concl"); c.focus(); c.setSelectionRange(pos, pos); }
    else refreshReport();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "user") { S.user = t.value; render(); }
  else if (t.id === "ownerf") { S.ownerFilter = t.value; render(); }
  else if (t.dataset.att) { const arr = S.att[t.dataset.att], k = +t.dataset.k; if (!t.value && k > 0) arr.splice(k, 1); else arr[k] = t.value; render(); }
  else if (t.dataset.pickrep) { t.checked ? S.picked.add(t.dataset.pickrep) : S.picked.delete(t.dataset.pickrep); }
  else if (t.dataset.step !== undefined) { curProto().steps[+t.dataset.step][t.dataset.f] = t.value; render(); }
});
document.addEventListener("toggle", e => { const d = e.target.dataset?.find; if (d) e.target.open ? S.openFind.add(d) : S.openFind.delete(d); }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.overlay) { S.overlay = null; renderOverlay(); } });

render();
</script>
