<style>
/* Soňa's brief: a GLIDE-inspired clinical workspace. Calm, fine lines, minimal shadow, colour only where it means something.
   Layout: three working panes like a mail client (patient list | workspace | source), stacking on phones. */
:root {
  --bg: #f5f5f2;
  --panel: #ffffff;
  --sunk: #eef0ed;
  --fg: #1d2a2a;
  --muted: #586664;
  --line: #dde1dc;
  --accent: #3f7a70;
  --accent-soft: #dfe8e4;
  --missing: #9a5b00;
  --missing-soft: #fbefd9;
  --conflict: #b0283a;
  --conflict-soft: #fbe3e6;
  --change: #2459b3;
  --change-soft: #e1eafb;
  --unclear: #6a5a8c;
  --unclear-soft: #ece7f5;
  --ok: #2c7a4b;
  --ok-soft: #dff1e6;
  --mark: #ffe58a;
  --font-ui: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: "Manrope", "DM Sans", system-ui, sans-serif;
  --font-src: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121716; --panel: #19201f; --sunk: #212a28; --fg: #e4ebe8; --muted: #9eaba7; --line: #2d3835;
  --accent: #7fc0b3; --accent-soft: #223a35;
  --missing: #e5a54a; --missing-soft: #3a2c14; --conflict: #ef7a89; --conflict-soft: #3d1b21;
  --change: #86a9ec; --change-soft: #1d2a45; --unclear: #b6a5d9; --unclear-soft: #2b2540;
  --ok: #6fcb93; --ok-soft: #173325; --mark: #6b5a12; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121716; --panel: #19201f; --sunk: #212a28; --fg: #e4ebe8; --muted: #9eaba7; --line: #2d3835;
  --accent: #7fc0b3; --accent-soft: #223a35;
  --missing: #e5a54a; --missing-soft: #3a2c14; --conflict: #ef7a89; --conflict-soft: #3d1b21;
  --change: #86a9ec; --change-soft: #1d2a45; --unclear: #b6a5d9; --unclear-soft: #2b2540;
  --ok: #6fcb93; --ok-soft: #173325; --mark: #6b5a12; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font: 700 15px/1 var(--font-head); letter-spacing: .01em; }
.nav { display: flex; gap: 2px; }
.nav button { background: none; border: 0; padding: 6px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.view { min-height: 0; overflow: auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.view h1 { font: 700 20px/1.3 var(--font-head); margin: 0 0 14px; }
table.db { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); font-size: 13.5px; }
.db th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.db td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.db tr.click { cursor: pointer; } .db tr.click:hover td { background: var(--sunk); }
.cal { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); min-width: 760px; }
.cal > div { background: var(--panel); padding: 8px; min-height: 180px; display: grid; align-content: start; gap: 6px; }
.cal .dh { font-weight: 600; font-size: 12.5px; color: var(--muted); }
.slot { background: var(--accent-soft); border: 0; border-radius: 4px; padding: 6px 8px; text-align: left; cursor: pointer; }
.slot b { display: block; font-size: 12.5px; }
.slot span { font-size: 12px; color: var(--muted); }
.brand small { font-weight: 500; color: var(--muted); margin-left: 6px; }
.mockflag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--missing-soft); color: var(--missing); font-weight: 600; }
.session { margin-left: auto; color: var(--muted); font-size: 13px; }

.panes { display: grid; grid-template-columns: 280px minmax(0, 1fr) minmax(0, 420px); min-height: 0; }
.pane { min-width: 0; min-height: 0; overflow: auto; }
.list { background: var(--panel); border-right: 1px solid var(--line); }
.source { background: var(--panel); border-left: 1px solid var(--line); }
.main { padding: 20px 24px 48px; }
.source[hidden] { display: none; }
.panes.nosource { grid-template-columns: 280px minmax(0, 1fr); }

.list h2, .source h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 14px 16px 8px; }
.pt { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; cursor: pointer; }
.pt:hover { background: var(--sunk); }
.pt[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.pt .nm { font-weight: 600; }
.pt .pb { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.c-ok { background: var(--ok-soft); color: var(--ok); }
.c-missing { background: var(--missing-soft); color: var(--missing); }
.c-conflict { background: var(--conflict-soft); color: var(--conflict); }
.c-change { background: var(--change-soft); color: var(--change); }
.c-unclear { background: var(--unclear-soft); color: var(--unclear); }
.c-neutral { background: var(--sunk); color: var(--muted); }

.casehead { display: grid; gap: 6px; margin-bottom: 14px; }
.casehead h1 { margin: 0; font: 700 22px/1.25 var(--font-head); line-height: 1.25; text-wrap: balance; }
.ident { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.question { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 10px 14px; }
.question.missing { border-color: var(--missing); background: var(--missing-soft); }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 16px 0; overflow-x: auto; }
.tab { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.summary { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.summary p { margin: 0; max-width: 75ch; }
.levels { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.levels button { border: 0; background: none; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.levels button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

.src { display: inline-flex; align-items: center; gap: 3px; font: 500 11px/1.4 var(--font-src); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 4px; padding: 0 5px; cursor: pointer; vertical-align: 1px; margin-left: 4px; }
.src:hover { text-decoration: underline; }

.flags { display: grid; gap: 6px; margin: 16px 0; }
.flag { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 8px 12px; border-radius: var(--r); border-left: 3px solid; background: var(--panel); }
.flag.missing { border-color: var(--missing); } .flag.contradiction { border-color: var(--conflict); }
.flag.change { border-color: var(--change); } .flag.unclear { border-color: var(--unclear); }
.flag .note { grid-column: 2; color: var(--muted); font-size: 12.5px; }
details.flagwrap > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }

.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-top: 8px; }
.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
.sec[open] > summary::before { transform: rotate(90deg); }
.sec .ttl { font-weight: 600; }
.sec .cnt { color: var(--muted); font-size: 12.5px; }
.sec .pick { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.facts { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 6px; }
.fact { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding-top: 6px; border-top: 1px dashed var(--line); }
.fact .d { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
.tag { font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 3px; margin-left: 4px; }
.fact .why { display: block; color: var(--muted); font-size: 12.5px; }

table.labs { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
.labs th, .labs td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.labs td.hi { color: var(--conflict); font-weight: 600; } .labs td.lo { color: var(--change); font-weight: 600; }
.scroll { overflow-x: auto; }

/* Timeline: one lane per kind of event, like branches in a git graph. */
.tl { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.tl-inner { position: relative; }
.lane { position: absolute; left: 0; right: 0; height: 34px; border-top: 1px solid var(--line); }
.lane span { position: sticky; left: 0; display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--panel); padding: 2px 8px; z-index: 2; }
.lane i { position: absolute; left: 120px; right: 16px; top: 17px; height: 2px; background: var(--line); }
.dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--panel); cursor: pointer; padding: 0; z-index: 1; }
.dot[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 1px; }
.year { position: absolute; top: 0; bottom: 0; border-left: 1px dotted var(--line); font-size: 11px; color: var(--muted); padding-left: 3px; }
.evlist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; }
.ev { display: grid; grid-template-columns: 12px 92px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 5px 8px; border-radius: 4px; }
.ev.sel { background: var(--accent-soft); }
.ev b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.srcpage { font: 12.5px/1.6 var(--font-src); white-space: pre-wrap; word-break: break-word; padding: 0 16px 24px; margin: 0; }
.srcpage mark { background: var(--mark); color: inherit; border-radius: 2px; }
.srcmeta { padding: 0 16px 8px; color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
.closebtn { background: var(--sunk); border: 0; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.pages { display: flex; gap: 4px; padding: 0 16px 10px; flex-wrap: wrap; }
.pages button { border: 1px solid var(--line); background: none; border-radius: 4px; padding: 1px 8px; cursor: pointer; font-size: 12px; }
.pages button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }

.form { display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.form textarea { width: 100%; min-height: 80px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.btn { background: var(--accent); color: var(--panel); border: 0; border-radius: 4px; padding: 7px 14px; font-weight: 600; cursor: pointer; justify-self: start; }
.btn.ghost { background: var(--sunk); color: var(--fg); }
.hist { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
.hist li { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.hist li.old { opacity: .65; }
.hist .meta { color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); padding: 12px 0; }

.sheet { background: #fff; color: #111; max-width: 680px; margin: 0 auto; padding: 36px 40px; box-shadow: 0 1px 4px rgba(0,0,0,.15); font-size: 13px; }
.sheet h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 4px; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
.sheet p, .sheet li { margin: 2px 0; }
.sheet .hdr { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #111; padding-bottom: 8px; }
.note { color: var(--muted); font-size: 12.5px; }

@media (max-width: 1100px) {
  .panes, .panes.nosource { grid-template-columns: 240px minmax(0, 1fr); }
  .source { position: fixed; inset: auto 0 0 0; height: 60%; z-index: 20; border-top: 2px solid var(--accent); border-left: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
}
@media (max-width: 720px) {
  .panes, .panes.nosource { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .list { max-height: 170px; border-right: 0; border-bottom: 1px solid var(--line); }
  .main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  .fact { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .sheet { padding: 20px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">

</div>

<script>
const CASE = JSON.parse(document.getElementById("case-data").textContent);
const OTHERS = JSON.parse(document.getElementById("list-data").textContent);
const GAP = "neuvedeno v dostupné dokumentaci";
/* Lists, calendar and database are shown on the shared screen, so they carry a case number and initials, not the full name. */
const caseNo = file => String(file).replace("_pacient.pdf", "");
const initials = name => String(name || "").split(/\s+/).filter(Boolean).map(w => w[0] + ".").join(" ");
const shortLabel = p => `Případ ${caseNo(p.file)} · ${initials(p.name)}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const SECTIONS = [
  ["clinical_finding", "Klinický nález"],
  ["imaging", "Zobrazovací vyšetření"],
  ["histology", "Histologie"],
  ["past_treatment", "Prodělaná léčba"],
  ["current_state", "Aktuální stav"],
  ["comorbidities", "Komorbidity"],
  ["medication", "Medikace"],
];
const FLAG = { missing: ["Chybí", "c-missing"], contradiction: ["Rozpor", "c-conflict"], change: ["Změna", "c-change"], unclear: ["Nejasné", "c-unclear"] };
const LANES = [
  ["diagnosis", "Diagnóza", "#7a3fa0"], ["histology", "Histologie", "#b0283a"], ["imaging", "Zobrazení", "#2459b3"],
  ["surgery", "Operace", "#9a5b00"], ["systemic", "Systémová léčba", "#2c7a4b"], ["radiotherapy", "Radioterapie", "#c2571a"],
  ["mdt", "MDT", "#0f5f7a"], ["visit", "Kontroly", "#5a6875"], ["other", "Jiné", "#8a8f95"],
];

const state = {
  view: "workspace",
  patient: "10_pacient.pdf",
  tab: "overview",
  level: 2,
  picked: new Set(["summary", "imaging", "histology", "past_treatment"]),
  decisions: [],
  selectedEvent: null,
  source: null,
};

/* Patient list: the MDT session agenda. */
function statusChips(p) {
  const out = [];
  if (p.file === CASE.file) {
    const n = k => CASE.flags.filter(f => f.kind === k).length;
    out.push(`<span class="chip c-ok">Zpracováno</span>`);
    if (state.decisions.length) out.push(`<span class="chip c-neutral">Projednáno</span>`);
    if (n("missing")) out.push(`<span class="chip c-missing">${n("missing")} chybí</span>`);
    if (n("contradiction")) out.push(`<span class="chip c-conflict">${n("contradiction")} rozpor</span>`);
    return out.join("");
  }
  out.push(`<span class="chip c-neutral">Nezpracováno v maketě</span>`);
  if (!p.mdt_question_cs || p.mdt_question_explicit === false) out.push(`<span class="chip c-missing">Bez výslovné otázky</span>`);
  return out.join("");
}
function questionText(q, explicit) {
  if (!q) return `<span class="chip c-missing">Otázka ${GAP}</span>`;
  if (explicit === false) return `<span class="chip c-missing">Výslovná otázka ${GAP}</span> Účel dle dokumentu: ${esc(q)}`;
  return esc(q);
}
function allPatients() {
  return [{ file: CASE.file, name: CASE.patient.name, main_problem_cs: "Světlobuněčný karcinom ledviny (C64), suspekce na MTS v mozečku", mdt_question_cs: CASE.mdt_question.closest_source?.quote, mdt_question_explicit: false }, ...OTHERS];
}
function renderList() {
  document.getElementById("ptlist").innerHTML = allPatients().map(p => `
    <button class="pt" data-file="${esc(p.file)}" aria-current="${p.file === state.patient}">
      <div class="nm">${esc(shortLabel(p))}</div>
      <div class="pb">${esc(p.main_problem_cs || "")}</div>
      <div class="chips">${statusChips(p)}</div>
    </button>`).join("");
}

/* Source panel: the original text with the quoted passage highlighted. */
function srcBtn(s) {
  if (!s) return "";
  return `<button class="src" data-src='${esc(JSON.stringify(s))}' title="Zobrazit ve zdroji">${esc(s.file.replace(".pdf", ""))} · s. ${esc(s.page)}</button>`;
}
function openSource(s) {
  state.source = s;
  const el = document.getElementById("source");
  const page = CASE.full_text_by_page.find(p => p.page === s.page);
  let text = esc(page ? page.text : "(Text stránky není k dispozici.)");
  if (s.quote && page) {
    const pattern = s.quote.trim().split(/\s+/).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+");
    try { text = text.replace(new RegExp(pattern), m => `<mark id="hit">${m}</mark>`); } catch (e) {}
  }
  el.innerHTML = `
    <h2>Zdrojový dokument</h2>
    <div class="srcmeta"><span>${esc(s.file)} · strana ${esc(s.page)} z ${CASE.page_count} · text z OCR</span>
      <button class="closebtn" id="closesrc" aria-label="Zavřít zdroj">Zavřít</button></div>
    <div class="pages">${CASE.full_text_by_page.map(p => `<button data-page="${p.page}" aria-pressed="${p.page === s.page}">s. ${p.page}</button>`).join("")}</div>
    <pre class="srcpage">${text}</pre>`;
  el.hidden = false;
  document.getElementById("panes").classList.remove("nosource");
  document.getElementById("hit")?.scrollIntoView({ block: "center" });
}
function closeSource() {
  document.getElementById("source").hidden = true;
  document.getElementById("panes").classList.add("nosource");
}

/* Case view. */
function factHtml(f) {
  const tags = [];
  if (f.negated) tags.push(`<span class="tag c-change">negace</span>`);
  if (f.certainty === "unclear_ocr") tags.push(`<span class="tag c-unclear">ověřit, nejasné OCR</span>`);
  if (f.certainty === "inferred") tags.push(`<span class="tag c-unclear">odvozeno asistentem</span>`);
  return `<li class="fact"><span class="d">${esc(f.date || "datum " + GAP)}</span>
    <span>${esc(f.text_cs)}${tags.join("")}${srcBtn(f.source)}${f.note ? `<span class="why">${esc(f.note)}</span>` : ""}</span></li>`;
}
function pick(key) {
  return `<label class="pick" onclick="event.stopPropagation()"><input type="checkbox" data-pick="${key}" ${state.picked.has(key) ? "checked" : ""}> do reportu</label>`;
}
function summaryHtml() {
  const s = CASE.summary;
  const shown = s.filter(p => (p.level || 3) <= state.level);
  return `<section class="summary">
    <div class="row"><span class="label">Shrnutí případu</span>
      <span class="row" style="gap:10px">
        <span class="levels" role="group" aria-label="Míra detailu">
          ${[[1, "Krátce"], [2, "Střední"], [3, "Plné"]].map(([n, t]) => `<button data-level="${n}" aria-pressed="${state.level === n}">${t}</button>`).join("")}
        </span>${pick("summary")}</span></div>
    ${shown.map(p => `<p>${esc(p.text_cs)}${(p.sources || []).map(srcBtn).join("")}</p>`).join("")}
    <span class="note">Každá věta je složena jen z údajů v podkladech; odkaz otevře původní text.</span>
  </section>`;
}
function flagsHtml() {
  const order = ["contradiction", "missing", "change", "unclear"];
  const fl = [...CASE.flags].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  const top = fl.some(f => f.relevant) ? fl.filter(f => f.relevant) : fl;
  const rest = fl.filter(f => !top.includes(f));
  const one = f => `<div class="flag ${f.kind}">
      <span class="chip ${FLAG[f.kind][1]}">${FLAG[f.kind][0]}</span>
      <span>${esc(f.text_cs)}${(f.based_on || []).map(srcBtn).join("")}</span>
      ${f.note ? `<span class="note">${esc(f.note)}</span>` : ""}</div>`;
  return `<details class="flagwrap" open><summary>Upozornění k dotazu na MDT (${top.length})</summary>
    <div class="flags">${top.map(one).join("")}</div>
    ${rest.length ? `<details class="flagwrap"><summary>Další upozornění (${rest.length})</summary><div class="flags">${rest.map(one).join("")}</div></details>` : ""}
    <span class="note">Upozornění jsou pozorování asistenta, ne klinický závěr. „Chybí“ znamená: ${GAP}; neznamená, že vyšetření neproběhlo.</span>
  </details>`;
}
function labsHtml() {
  const rows = CASE.labs.map(l => `<tr><td>${esc(l.name_cs)}</td>
    <td class="${l.out_of_range === "high" ? "hi" : l.out_of_range === "low" ? "lo" : ""}">${esc(l.value)} ${l.out_of_range === "high" ? "↑" : l.out_of_range === "low" ? "↓" : ""}</td>
    <td>${esc(l.unit)}</td><td>${esc(l.reference_range)}</td><td>${esc(l.date || GAP)}</td><td>${srcBtn(l.source)}</td></tr>`).join("");
  return `<details class="sec"><summary><span class="ttl">Laboratoř</span><span class="cnt">${CASE.labs.length} hodnot</span>${pick("labs")}</summary>
    <div style="padding:0 14px 12px"><p class="note" style="margin:0 0 8px">${esc(CASE.labs_note_cs || "Jediná sada hodnot bez data odběru, vývoj v čase nelze zobrazit.")}</p>
    <div class="scroll"><table class="labs"><thead><tr><th>Parametr</th><th>Hodnota</th><th>Jednotka</th><th>Referenční mez</th><th>Odběr</th><th>Zdroj</th></tr></thead><tbody>${rows}</tbody></table></div></div></details>`;
}
function overviewHtml() {
  return summaryHtml() + flagsHtml() +
    SECTIONS.map(([k, t]) => {
      const items = CASE.sections[k] || [];
      return `<details class="sec"${k === "imaging" ? " open" : ""}><summary><span class="ttl">${t}</span><span class="cnt">${items.length ? items.length + " záznamů" : GAP}</span>${pick(k)}</summary>
        <ul class="facts">${items.map(factHtml).join("") || `<li class="empty">${GAP}</li>`}</ul></details>`;
    }).join("") + labsHtml();
}

function parseSort(s) {
  const [y, m = "06", d = "15"] = String(s).split("-");
  return Date.UTC(+y, +m - 1, +d);
}
function timelineHtml() {
  const evs = CASE.timeline.map((e, i) => ({ ...e, i })).filter(e => e.date_sort).map(e => ({ ...e, t: parseSort(e.date_sort) })).sort((a, b) => a.t - b.t);
  const undated = CASE.timeline.map((e, i) => ({ ...e, i })).filter(e => !e.date_sort);
  const lanes = LANES.filter(([k]) => evs.some(e => (LANES.some(l => l[0] === e.type) ? e.type : "other") === k));
  const laneOf = e => lanes.findIndex(l => l[0] === (LANES.some(x => x[0] === e.type) ? e.type : "other"));
  const t0 = Math.min(...evs.map(e => e.t)), t1 = Math.max(...evs.map(e => e.t));
  const years = (t1 - t0) / 3.15e10;
  const W = Math.max(760, Math.round(years * 260)) + 160, H = lanes.length * 34 + 26;
  const x = t => 130 + (t - t0) / (t1 - t0 || 1) * (W - 160);
  const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(t1).getUTCFullYear();
  let yearsHtml = "";
  for (let y = y0 + 1; y <= y1; y++) yearsHtml += `<span class="year" style="left:${x(Date.UTC(y, 0, 1))}px">${y}</span>`;
  const sel = state.selectedEvent;
  return `<p class="note" style="margin-top:0">Každý typ události má vlastní linku. Klikněte na bod pro detail a zdroj. Datum je uvedeno tak, jak je v dokumentu (např. jen měsíc).</p>
  <div class="tl scroll"><div class="tl-inner" style="width:${W}px;height:${H}px">
    ${yearsHtml}
    ${lanes.map(([k, t], li) => `<div class="lane" style="top:${22 + li * 34}px"><span>${t}</span><i></i></div>`).join("")}
    ${evs.map(e => { const c = lanes[laneOf(e)][2]; return `<button class="dot" data-ev="${e.i}" aria-pressed="${sel === e.i}" title="${esc(e.date)}: ${esc(e.label_cs)}" style="left:${x(e.t)}px;top:${22 + laneOf(e) * 34 + 17}px;${e.status === "planned" ? `background:var(--panel);box-shadow:inset 0 0 0 2px ${c}` : `background:${c}`}"></button>`; }).join("")}
  </div></div>
  <ul class="evlist">${evs.map(e => `<li class="ev${sel === e.i ? " sel" : ""}" id="ev-${e.i}"><b style="background:${lanes[laneOf(e)][2]}"></b>
    <span class="d" style="font-variant-numeric:tabular-nums;color:var(--muted)">${esc(e.date)}</span>
    <span>${esc(e.label_cs)}${e.status === "planned" ? `<span class="tag c-unclear">plánováno</span>` : ""}${srcBtn(e.source)}</span></li>`).join("")}</ul>
  ${undated.length ? `<p class="label" style="margin-top:16px">Datum ${GAP}</p><ul class="evlist">${undated.map(e => `<li class="ev"><b style="background:var(--muted)"></b><span></span><span>${esc(e.label_cs)}${srcBtn(e.source)}</span></li>`).join("")}</ul>` : ""}`;
}

const SPECIALTIES = ["Neurochirurg", "Klinický onkolog", "Radiační onkolog", "Radiolog", "Patolog", "Neurolog", "Koordinátor"];
function decisionHtml() {
  const hist = state.decisions.map((d, i) => {
    const superseded = i < state.decisions.length - 1;
    return `<li class="${superseded ? "old" : ""}"><div class="row"><b>Závěr #${i + 1}</b>
      <span class="chip ${superseded ? "c-neutral" : "c-ok"}">${superseded ? `nahrazen závěrem #${i + 2}` : "platný"}</span></div>
      <div class="meta">${esc(d.when)} · potvrdil(a): ${esc(d.by)} · přítomni: ${esc(d.who.join(", ") || GAP)}</div><p style="margin:6px 0 0">${esc(d.text)}</p></li>`;
  }).reverse().join("");
  return `<div class="form">
    <span class="label">Přítomní</span>
    <div class="checks">${SPECIALTIES.map((s, i) => `<label><input type="checkbox" id="who-${i}" value="${s}"> ${s}</label>`).join("")}</div>
    <label class="label" for="concl">Závěr MDT (zapisuje lékař)</label>
    <textarea id="concl" placeholder="Závěr a další postup"></textarea>
    <label class="label" for="confirmer">Potvrzuje (jméno lékaře)</label>
    <input id="confirmer" style="font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;max-width:320px" placeholder="MUDr. …">
    <button class="btn" id="savedec">Uložit závěr</button>
    <span class="note">Asistent závěr nenavrhuje. Závěr platí až po potvrzení jmenovaným lékařem. Uložený závěr nelze smazat; nový závěr ten předchozí jen nahradí a historie zůstane.</span>
  </div>
  <ul class="hist">${hist || `<li class="empty">Pacient zatím nebyl na MDT projednán. Předchozí závěry MDT v podkladech nejsou.</li>`}</ul>`;
}

function reportHtml() {
  const p = CASE.patient, today = new Date().toLocaleDateString("cs-CZ");
  const ref = s => s ? ` <span style="color:#555">(${esc(caseNo(s.file))}, s. ${esc(s.page)})</span>` : "";
  const tags = f => [f.negated ? " [negace]" : "", f.certainty === "unclear_ocr" ? " [ověřit, nejasné OCR]" : "", f.certainty === "inferred" ? " [odvozeno asistentem]" : ""].join("");
  const parts = [];
  if (state.picked.has("summary")) parts.push(`<h3>Shrnutí případu (sestavil asistent z podkladů)</h3>${CASE.summary.map(s => `<p>${esc(s.text_cs)}${(s.sources || []).slice(0, 2).map(ref).join("")}</p>`).join("")}`);
  for (const [k, t] of SECTIONS) if (state.picked.has(k)) parts.push(`<h3>${t}</h3><ul>${(CASE.sections[k] || []).map(f => `<li>${esc(f.date ? f.date + ": " : "")}${esc(f.text_cs)}${esc(tags(f))}${ref(f.source)}</li>`).join("") || `<li>${GAP}</li>`}</ul>`);
  if (state.picked.has("labs")) parts.push(`<h3>Laboratoř (datum odběru: ${esc(CASE.labs[0]?.date || GAP)})</h3><ul>${CASE.labs.map(l => `<li>${esc(l.name_cs)} ${esc(l.value)} ${esc(l.unit)}${l.out_of_range === "high" ? " ↑" : l.out_of_range === "low" ? " ↓" : ""} (ref. ${esc(l.reference_range)})${ref(l.source)}</li>`).join("")}</ul>`);
  const last = state.decisions[state.decisions.length - 1];
  return `<div class="row" style="margin-bottom:12px"><span class="note">Report obsahuje identifikaci pacienta a oddíly zaškrtnuté v přehledu (${state.picked.size}).</span>
    <button class="btn ghost" disabled title="V maketě není">Stáhnout PDF</button></div>
  <article class="sheet">
    <div class="hdr"><div><b>Fakultní nemocnice Ostrava</b><br>Zpráva z multidisciplinárního semináře (maketa)</div><div>Datum: ${today}</div></div>
    <h3>Pacient</h3><p>${esc(p.name)} · RČ: ${esc(p.birth_number || GAP)} · pojišťovna: ${esc(p.insurer || GAP)}</p>
    <h3>Otázka pro MDT</h3><p>${esc(CASE.mdt_question.text_cs || "Výslovná otázka " + GAP + ". Účel dle dokumentu: " + (CASE.mdt_question.closest_source?.quote || ""))}</p>
    ${parts.join("")}
    <h3>Závěr MDT</h3><p>${last ? esc(last.text) : "Zatím nezapsán."}</p>
    ${last ? `<p>Potvrdil(a): ${esc(last.by)} · ${esc(last.when)}</p><p>Přítomni: ${esc(last.who.join(", ") || GAP)}</p>` : ""}
    <p style="color:#555;font-size:11.5px;margin-top:16px">Údaje sestavil asistent z uvedených dokumentů (číslo případu, strana). Označení v hranatých závorkách: [negace] zápor uvedený v dokumentu, [ověřit] nejistě přečtený text, [odvozeno asistentem] údaj není v dokumentu výslovně.</p>
  </article>`;
}

function renderMain() {
  const main = document.getElementById("main");
  if (state.patient !== CASE.file) {
    const p = OTHERS.find(o => o.file === state.patient);
    main.innerHTML = `<div class="casehead"><h1>${esc(p.name || p.file)}</h1>
      <div class="ident"><span>věk: ${esc(p.age_or_birth || GAP)}</span><span>pojišťovna: ${esc(p.insurer || GAP)}</span><span>${esc(p.file)} · ${p.page_count} s.</span></div></div>
      <div class="question ${p.mdt_question_cs && p.mdt_question_explicit !== false ? "" : "missing"}"><span class="label">Otázka pro MDT</span><div>${questionText(p.mdt_question_cs, p.mdt_question_explicit)}</div></div>
      <section class="summary" style="margin-top:16px"><span class="label">Jednořádkový přehled</span><p>${esc(p.one_line_summary_cs)}</p>
      <span class="note">V této maketě je plně zpracován jen pacient Daniel Poláček.</span></section>`;
    return;
  }
  const p = CASE.patient, q = CASE.mdt_question;
  const tabs = [["overview", "Přehled"], ["timeline", "Časová osa"], ["decision", "Závěr MDT"], ["report", "Report (PDF)"]];
  main.innerHTML = `<div class="casehead"><h1>${esc(p.name)}</h1>
    <div class="ident"><span>${esc(p.sex || "")}${p.sex_certainty === "inferred" ? " (odvozeno)" : ""}</span><span>věk: ${esc(p.age || GAP)}</span><span>RČ: ${esc(p.birth_number || GAP)}</span><span>pojišťovna: ${esc(p.insurer || GAP)}</span><span>${esc(CASE.file)} · ${CASE.page_count} s.</span></div></div>
    <div class="question ${q.text_cs ? "" : "missing"}"><span class="label">Otázka pro MDT</span>
      <div>${q.text_cs ? esc(q.text_cs) : `${questionText(q.closest_source?.quote, false)}${srcBtn(q.closest_source)}`}</div></div>
    <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${t}</button>`).join("")}</div>
    <div id="tabbody">${{ overview: overviewHtml, timeline: timelineHtml, decision: decisionHtml, report: reportHtml }[state.tab]()}</div>`;
}

/* MDT calendar: one neuro-oncology seminar day per week; the agenda is the session's patient list. */
function calendarHtml() {
  const pts = allPatients();
  const days = ["Po", "Út", "St", "Čt", "Pá"];
  const cols = days.map((d, i) => {
    const slots = i === 3 ? pts.map(p => `<button class="slot" data-open="${esc(p.file)}"><b>${esc(shortLabel(p))}</b><span>${esc(p.main_problem_cs || "")}</span></button>`).join("") : "";
    return `<div><span class="dh">${d}${i === 3 ? " · Neuroonkologický seminář" : ""}</span>${slots}</div>`;
  }).join("");
  return `<h1>Kalendář MDT</h1><p class="note">Ukázkový týden. Pacient se zařadí na konkrétní seminář; kliknutím otevřete jeho pracoviště.</p><div class="scroll"><div class="cal">${cols}</div></div>`;
}
/* Patient database: every referred patient with the fields Soňa listed (diagnosis, owner, MDT date, status). */
function databaseHtml() {
  const rows = allPatients().map(p => `<tr class="click" data-open="${esc(p.file)}"><td><b>${esc(shortLabel(p))}</b></td>
    <td>${esc(p.main_problem_cs || "")}</td><td>${questionText(p.mdt_question_cs, p.mdt_question_explicit)}</td><td>${GAP}</td><td>${statusChips(p)}</td></tr>`).join("");
  return `<h1>Databáze pacientů</h1><p class="note">Seznamy na sdílené obrazovce ukazují jen číslo případu a iniciály; plná identita je až na pracovišti pacienta. Odesílající lékař je zároveň vlastník případu.</p>
    <div class="scroll"><table class="db"><thead><tr><th>Pacient</th><th>Hlavní problém</th><th>Otázka pro MDT</th><th>Odesílající lékař</th><th>Stav</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function render() {
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.view === state.view));
  const other = document.getElementById("otherview"), panes = document.getElementById("panes");
  if (state.view === "workspace") { other.hidden = true; panes.hidden = false; renderList(); renderMain(); }
  else { panes.hidden = true; other.hidden = false; other.innerHTML = state.view === "calendar" ? calendarHtml() : databaseHtml(); }
}

document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { state.view = "workspace"; state.patient = open.dataset.open; state.tab = "overview"; closeSource(); render(); return; }
  const t = e.target.closest("button, input");
  if (!t) return;
  if (t.dataset.view) { state.view = t.dataset.view; render(); }
  else if (t.matches(".pt")) { state.patient = t.dataset.file; state.tab = "overview"; closeSource(); render(); }
  else if (t.matches(".tab")) { state.tab = t.dataset.tab; renderMain(); }
  else if (t.dataset.level) { state.level = +t.dataset.level; renderMain(); }
  else if (t.matches(".src")) { e.preventDefault(); e.stopPropagation(); openSource(JSON.parse(t.dataset.src)); }
  else if (t.id === "closesrc") closeSource();
  else if (t.dataset.page) openSource({ file: CASE.file, page: +t.dataset.page });
  else if (t.dataset.ev !== undefined) {
    state.selectedEvent = +t.dataset.ev; renderMain();
    const ev = CASE.timeline[state.selectedEvent]; if (ev?.source) openSource(ev.source);
    document.getElementById("ev-" + state.selectedEvent)?.scrollIntoView({ block: "nearest" });
  }
  else if (t.dataset.pick) { t.checked ? state.picked.add(t.dataset.pick) : state.picked.delete(t.dataset.pick); }
  else if (t.id === "savedec") {
    const text = document.getElementById("concl").value.trim();
    const by = document.getElementById("confirmer").value.trim();
    if (!text) { document.getElementById("concl").focus(); return; }
    if (!by) { document.getElementById("confirmer").focus(); return; }
    const who = [...document.querySelectorAll(".checks input:checked")].map(i => i.value);
    state.decisions.push({ text, who, by, when: new Date().toLocaleString("cs-CZ") });
    render();
  }
});

document.getElementById("session").textContent = "Neuroonkologický seminář · ukázkový termín";
render();
</script>
