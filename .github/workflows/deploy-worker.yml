# Tests the API Worker, the Nuxt app and the shared packages, runs the browser suite (e2e/) against local Workers,
# then deploys the Worker with the app at /: main -> production (codebridge-mdt.<subdomain>.workers.dev), backend ->
# preview alias "backend". The deploy runs only when the unit tests and the browser suite both pass; on main it applies
# the D1 migrations first.
name: Deploy worker

# The browser suite reads e2e/ and drives everything the Worker serves; the tests read the fixtures and the samples.
# The page reader's files are here too: wrangler deploy builds its container image from them.
on:
  push:
    branches: [main, backend]
    paths: ["api/**", "app/**", "packages/**", "i18n/**", "e2e/**", "package.json", "package-lock.json", "fixtures/**", "data/derived/**", "samples/**", "docs/NO-A/**", "pipeline/container/**", "pipeline/page_reader/**", "pipeline/requirements.lock", ".github/workflows/deploy-worker.yml"]
  pull_request:
    paths: ["api/**", "app/**", "packages/**", "i18n/**", "e2e/**", "package.json", "package-lock.json", "fixtures/**", "data/derived/**", "samples/**", "docs/NO-A/**", "pipeline/container/**", "pipeline/page_reader/**", "pipeline/requirements.lock", ".github/workflows/deploy-worker.yml"]
  # A manual run on any branch tests it; only main and backend deploy.
  workflow_dispatch:

# One run per branch or pull request; a newer push replaces the older run. main (production) and backend (a preview
# version) deploy to different targets, so neither cancels the other, and runs that cannot deploy (pull requests,
# manual runs on other branches) never cancel a deploy. On main a newer run waits instead of cancelling: a cancel
# between the D1 migration and the deploy would leave the old Worker on the new schema.
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # The root install: the Worker, the app and the packages are workspaces of one lockfile.
      - run: npm ci
      - name: Generated runtime types match wrangler.jsonc
        working-directory: api
        run: npm run types && git diff --exit-code src/worker-configuration.d.ts
      - run: npm run typecheck -w codebridge-api
      - run: npm test -w codebridge-api
      # The case rules the Worker and the app import from packages/domain, with their own tests and the type check that
      # keeps runtime globals out of the package (the Worker's tsconfig would not catch them); then the typed client.
      - run: npm run typecheck -w @codebridge/domain
      - run: npm test -w @codebridge/domain
      - run: npm run typecheck -w @codebridge/api-client
      - run: npm test -w @codebridge/api-client
      - run: npm run typecheck -w @codebridge/app
      - run: npm test -w @codebridge/app
      # Builds the app, stages every file the Worker serves and writes the security headers (it fails when the app's
      # inline scripts are not the two the content security policy expects), then checks the first-load size.
      - name: Stage the Worker's files
        working-directory: api
        run: npm run stage
      - run: npm run size -w @codebridge/app

  # The browser suite (e2e/README.md) on four local Workers at once, each with its own seeded local D1 and R2. The job
  # gets no secrets: the Workers run without speech, model or pipeline keys, as the suite requires (it stops when
  # /api/health reports either), and nothing here talks to Cloudflare.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_WORKERS: "4"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      # The seed (api/seed/seed.py) is a uv script with no dependencies.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - run: npm ci
      - run: npm ci
        working-directory: e2e
      # Chromium for the pinned Playwright, cached by the lockfile; the system libraries it needs are installed on
      # every run (apt packages are not in the cache).
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Stage the Worker's files
        working-directory: api
        run: npm run stage
      # The seeded local state, by the files the seed reads: seeding puts every R2 object with its own wrangler call
      # and takes minutes. run-parallel.mjs checks the same inputs (seed.stamp) and seeds again when they differ.
      - name: Cache the seeded state
        uses: actions/cache@v4
        with:
          path: |
            api/.wrangler/e2e/seed
            api/.wrangler/e2e/seed.stamp
          key: e2e-seed-${{ runner.os }}-${{ hashFiles('package-lock.json', 'api/migrations/**', 'api/seed/seed.py', 'fixtures/**', 'data/derived/**', 'data/rakathon-26/**', 'samples/**') }}
      # Seeds one local state, copies it per Worker, starts the Workers, runs the suite and stops them.
      - name: Browser suite
        run: npm --prefix e2e run test:parallel
      - name: Upload the report, traces and Worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            api/.wrangler/e2e/*.log
          retention-days: 7

  deploy:
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/backend')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # At the root: staging builds the app, which needs Nuxt (an `npm ci` inside api/ installs the Worker's only).
      - run: npm ci
        working-directory: .
      - run: npm run stage
      # The page reader's own Worker (page-reader.wrangler.jsonc): wrangler deploy builds its container image with this
      # runner's Docker and pushes it to Cloudflare's registry, so the token needs "Containers: Edit" besides Workers
      # Scripts Edit and D1 Edit. It runs before the D1 migration, so a token without that permission or an image that does
      # not build stops the job while the old Worker still serves its own schema. Only main deploys it: the backend
      # preview binds the same page reader.
      - name: The token can manage containers (main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker version --format 'docker {{.Server.Version}}'
          npx wrangler containers list > /dev/null || { echo "::error::CLOUDFLARE_API_TOKEN cannot list containers: add the account permission 'Containers: Edit'"; exit 1; }
      - name: Deploy the page reader (main)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy -c page-reader.wrangler.jsonc
      # The deployed D1 gets the new migrations right before the code that needs them, so a merge never serves new code
      # on an old schema. Only main migrates: the backend preview uses the same database, so a schema change reaches it
      # through main first (api/AGENTS.md, "Migrations in CI"). wrangler answers its own prompt with yes in CI and exits
      # non-zero when a migration fails, which stops the job before the deploy.
      - name: Apply D1 migrations (main)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply codebridge-mdt --remote
      - name: Deploy production (main)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --var GIT_SHA:${{ github.sha }} --var PAGE_READER_CONTAINER:on
      - name: Upload preview version (backend)
        if: github.ref == 'refs/heads/backend'
        run: npx wrangler versions upload --preview-alias backend --var GIT_SHA:${{ github.sha }} --var PAGE_READER_CONTAINER:on
